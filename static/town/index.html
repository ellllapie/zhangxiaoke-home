<style>
  :root{ --paper:#f6efe3; --ink:#3a2a24; --soft:#8c7a6e; --red:#b9433a; --line:rgba(58,42,36,.14); }
  *{ box-sizing:border-box; }

  #cv{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .top{ position:fixed; z-index:2; top:0; left:0; right:0; padding:calc(env(safe-area-inset-top) + 10px) 16px 0; display:flex; justify-content:space-between; align-items:flex-start; pointer-events:none; }
  .top a, .top button{ pointer-events:auto; }
  .brand b{ display:block; font:400 34px/1 "Pinyon Script",cursive; color:var(--ink); transition:color 1s; }
  .brand i{ display:block; font-size:10px; letter-spacing:.32em; color:var(--soft); font-style:normal; margin-top:4px; }
  body.dark .brand b{ color:#f3ecdf; } body.dark .hint{ color:#c9bfd8; } body.dark .brand i{ color:#c9bfd8; }
  .btns{ display:flex; gap:6px; }
  .chip{ border:0; background:rgba(255,250,242,.8); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); color:var(--ink); font:13.5px "Noto Serif SC",serif; padding:7px 11px; border-radius:999px; cursor:pointer; text-decoration:none; box-shadow:0 1px 0 var(--line); }
  #pick{ position:fixed; inset:0; z-index:5; background:var(--paper); display:flex; flex-direction:column; justify-content:center; padding:24px 16px; transition:opacity 1.2s ease; }
  #pick.gone{ opacity:0; pointer-events:none; }
  #pick h1{ margin:0 0 6px; font:400 46px/1 "Pinyon Script",cursive; }
  #pick p{ margin:0 0 26px; color:var(--soft); font-size:14px; line-height:1.7; }
  .cards{ display:grid; grid-template-columns:1fr 1fr; gap:12px; max-width:520px; }
  .card{ border:0; text-align:left; background:#fffaf2; border-radius:14px; padding:14px; cursor:pointer; box-shadow:0 1px 0 var(--line), 0 6px 18px rgba(58,42,36,.06); font-family:inherit; color:inherit; }
  .card b{ display:block; font-size:18px; font-weight:600; }
  .card i{ display:block; font:italic 500 14px "Cormorant Garamond","Noto Serif SC",serif; color:var(--soft); margin:2px 0 10px; }
  .card .sw{ display:flex; height:18px; border-radius:4px; overflow:hidden; }
  .card .sw span{ flex:1; }
  .card small{ display:block; margin-top:8px; font-size:12px; color:var(--soft); }
  .card[disabled]{ opacity:.45; cursor:default; }
  #sheet{ position:fixed; left:12px; right:12px; bottom:calc(env(safe-area-inset-bottom) + 12px); z-index:3; max-width:460px; margin:0 auto; background:rgba(255,250,242,.94); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-radius:16px; padding:16px 18px 14px; transform:translateY(calc(100% + 60px)); transition:transform .6s cubic-bezier(.2,.8,.2,1); max-height:62vh; overflow:auto; box-shadow:0 8px 30px rgba(58,42,36,.12); }
  #sheet.on{ transform:none; }
  #sheet h2{ margin:0 0 6px; font-size:18px; }
  #sheet h2 em{ font:italic 500 15px "Cormorant Garamond",serif; color:var(--soft); margin-left:6px; }
  #sheet p{ margin:0 0 8px; font-size:15px; line-height:1.7; }
  #sheet dl{ margin:0; display:grid; grid-template-columns:auto 1fr; gap:6px 12px; font-size:14.5px; line-height:1.65; }
  #sheet dt{ font-weight:600; color:var(--red); }
  #sheet dd{ margin:0; }
  #sheet .x{ position:absolute; right:10px; top:8px; border:0; background:none; font-size:20px; color:var(--soft); cursor:pointer; }
  #sheet a.go{ display:inline-block; margin-top:2px; color:var(--red); font-size:14px; }
  #sheet .sp small a{ color:var(--red); text-decoration:none; }   /* 图鉴、菜谱里的小链接：陶土红，不要浏览器那种蓝下划线 */
  .bar{ position:fixed; z-index:2; left:0; right:0; bottom:calc(env(safe-area-inset-bottom) + 14px); display:flex; justify-content:center; gap:6px; flex-wrap:wrap; padding:0 12px; }
  .seg{ display:flex; background:rgba(255,250,242,.8); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border-radius:999px; padding:3px; box-shadow:0 1px 0 var(--line); }
  .seg button{ border:0; background:none; font:13.5px "Noto Serif SC",serif; color:var(--soft); padding:4px 12px; border-radius:999px; cursor:pointer; }

  .nian{ pointer-events:auto; margin-top:6px; border:0; background:rgba(255,250,242,.8); color:var(--red); font:600 13px "Noto Serif SC",serif; padding:4px 10px; border-radius:999px; box-shadow:0 1px 0 var(--line); cursor:pointer; }
  .nian.pop{ animation:pop .6s ease; } @keyframes pop{ 40%{ transform:scale(1.25); } }

  #sheet .act{ display:inline-block; margin-top:6px; border:0; background:var(--ink); color:#fbf6ec; font:14px "Noto Serif SC",serif; padding:6px 14px; border-radius:999px; cursor:pointer; }
  #sheet .ntc{ display:block; width:100%; text-align:left; border:0; background:none; font:inherit; color:inherit; padding:9px 0; border-top:1px solid var(--line); cursor:pointer; }
  #sheet .ntc small{ display:block; color:var(--soft); font-size:12.5px; }

  .chip i{ font-style:normal; display:inline-block; min-width:16px; height:16px; line-height:16px; margin-left:4px; border-radius:8px; background:var(--red); color:#fff; font-size:11px; text-align:center; }

  #sheet .tags span{ display:inline-block; font-size:12px; padding:1px 8px; margin:0 4px 4px 0; border-radius:999px; background:rgba(58,42,36,.07); }
  #sheet .soon{ display:inline-block; margin-top:6px; border:1px dashed var(--soft); color:var(--soft); font-size:13px; padding:4px 12px; border-radius:999px; }
  #sheet .pick{ display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:#fffaf2; border-radius:999px; padding:6px 11px; margin:0 6px 8px 0; font:inherit; font-size:13.5px; color:inherit; cursor:pointer; }
  #sheet .pick i{ width:12px; height:12px; border-radius:50%; } #sheet .pick small{ color:var(--soft); }
  #sheet .pick.on{ border-color:var(--red); background:#fbeee6; } #sheet .pick[disabled]{ opacity:.4; cursor:default; }
  #sheet .pot{ margin:6px 0 12px; padding:10px 12px; border-radius:12px; background:#f6efe3; } #sheet .pot b{ font-size:16px; }
  #sheet .sp{ display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-top:1px solid var(--line); }
  #sheet .sp:first-of-type{ border-top:0; }
  #sheet .sp i{ flex:none; width:18px; height:18px; border-radius:50%; margin-top:4px; box-shadow:inset 0 0 0 1.5px rgba(58,42,36,.25); }
  #sheet .sp b{ font-size:15.5px; } #sheet .sp small{ display:block; color:var(--soft); font-size:12.5px; line-height:1.6; }
  #sheet ol{ margin:0; padding-left:20px; font-size:14.5px; line-height:1.75; }
  .hint{ position:fixed; left:0; right:0; bottom:calc(env(safe-area-inset-bottom) + 62px); text-align:center; z-index:2; font:italic 500 14px "Cormorant Garamond","Noto Serif SC",serif; color:var(--soft); pointer-events:none; transition:opacity 1s; }
  .brand b{ pointer-events:auto; cursor:pointer; }
  body.clean .top, body.clean .bar, body.clean .hint, body.clean #toast { opacity:0; pointer-events:none; }   /* 录像用：点一下标题把按钮都藏了，再点出来 */
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="top">
  <div class="brand"><b>Petite Ville</b><i id="sub">小 镇 · 法 式</i><span class="wx" id="wx"></span><button class="nian" id="nian" hidden>念 0</button></div>
  <div class="btns">
    <button class="chip" id="bTime" hidden>白天</button>

</div>

<div id="pick">
<script>try { if (localStorage.getItem('town_style')) document.getElementById('pick').classList.add('gone'); } catch (_) {}   /* 选过风格就别在加载那几秒里先亮出来 */</script>
  <h1>Choisir un style</h1>
  <p>开建之前先选一种风格，整座镇子的屋顶、墙、路、灯都跟着它走。</p>
  <div class="cards">
    <button class="card" data-s="fr"><b>法式</b><i>à la française · 色褪せない日常</i>
      <div class="sw"><span style="background:#dbc7b9"></span><span style="background:#746f54"></span><span style="background:#44453f"></span><span style="background:#9f3726"></span><span style="background:#d97c12"></span></div>
      <small>砖红瓦、墨绿百叶、窗台一排花盆</small></button>
    <button class="card" data-s="tang"><b>唐风</b><i>石青鎏金</i>
      <div class="sw"><span style="background:#1A3550"></span><span style="background:#2D5A7C"></span><span style="background:#3A6BAA"></span><span style="background:#7C9CC0"></span><span style="background:#E8C870"></span></div>
      <small>青瓦朱金、斗拱飞檐、石灯和松</small></button>
    <button class="card" data-s="harbour"><b>港口</b><i>harbour · Santorini</i>
      <div class="sw"><span style="background:#f6f4ee"></span><span style="background:#1f4f9c"></span><span style="background:#3a86c0"></span><span style="background:#e6d6b4"></span><span style="background:#d5487a"></span></div>
      <small>白房子蓝圆顶、三角梅、一条河一串白帆</small></button>
  </div>
</div>

<script type="importmap">

<script type="module">

const STYLE = (() => { try { return localStorage.getItem('town_style') || ''; } catch (_) { return ''; } })(), TANG = STYLE === 'tang', HAR = STYLE === 'harbour', PAVED = TANG || HAR;
const RW = 2.0, RIVER = false;   // 河 10/20 又撤了：她要圣托里尼那种左边山坡、右边一道斜海岸线
// 圣托里尼的地势：x<-5 往左一路抬高（到镇子西边抬 2.5 左右），出了镇子慢慢落回去；右边 x > 7+0.3z 是悬崖外的海
const HILL = (x, z) => { if (!HAR) return 0; const fx = x < -10 ? Math.max(0, 1 - (-10 - x) / 6) : 1, fz = Math.abs(z) < 10 ? 1 : Math.max(0, 1 - (Math.abs(z) - 10) / 4); return Math.min(4.6, Math.max(0, (-x - 4.6) * .95)) * fx * fz; };

const SEA = (x, z) => HAR && x > COASTX(z);   // 镇子东南那一大片都是海
// 圣托里尼中间一条弯弯的小河：从北边山脚流下来，绕过广场教堂东边，往西南流进海
const RIVERC = HAR ? new THREE.CatmullRomCurve3([[-8.4, -34], [-7.2, -27], [-6.4, -21.5], [-6.1, -17.2], [-5.0, -13.6], [-2.6, -11.8], [-0.6, -11.1], [2.0, -11.3], [4.6, -10.8], [7.2, -9.8], [8.8, -7.6], [9.4, -5.0], [9.8, -2.6], [10.8, -0.6]]   /* 10/20 她笑我那座桥：老路线贴着竖街来回拧，宽了以后一条街过三回水。现在绕着镇子北边和东边走，竖街只在北头过一次，不碰广场和房子 */.map(([x, z]) => new THREE.Vector3(x, 0, z)), false, 'centripetal') : null;

function seat(o) {   // 坡上的房子：照占地最高那头抬起来，底下垫一块白挡土墙
  o.updateMatrixWorld(true); const bb = new THREE.Box3().setFromObject(o);

}   // 港口：一条大河顺着东西那条路横穿镇子，分成南北两岸，两头通海；北边往外扩的新地不碰
const G = TANG ? TG.guide : HAR ? HB.guide : F.guide;
import * as M from './mem.js';
import * as LAND from './land.js';

// 记忆的目录和心情：走自己家后台，要钥匙；没有钥匙就只看样板房
const REL = '/relay';   // the town is always the first companion's, whoever you're chatting with
const SECRET = (() => { try { return new URLSearchParams(location.search).get('token') || (localStorage.getItem('nyx_key') || localStorage.getItem('companion_secret')) || 'home'; } catch (_) { return 'home'; } })();

const TOWN_KEY = 'memtown_cache';
let DATA = null, FRESH = null;

  if (!DATA?.stars?.length) DATA = await FRESH;
}
const MEMS = DATA?.stars?.length ? DATA.stars : null;
M.useSpecies(Object.values(DATA?.town?.species || {}).filter((v) => v.status === 'ok'));   // 小机造的、她点过头的新品种

await Promise.all([document.fonts.load('78px "Pinyon Script"'), document.fonts.load('600 40px "Noto Serif SC"', '恋爱杂记技术设施')]).catch(() => {});   // 门牌上的字要等字体到了再画

const N = 10;
const ground = new THREE.Mesh(new RoundedBoxGeometry(N * 2, .5, N * 2, 3, .12), mat('#ffffff', { map: washTex(P.grass, { seed: 11, blots: 60, rep: [3, 3] }) }));

const soil = new THREE.Mesh(new RoundedBoxGeometry(N * 2 - .1, .5, N * 2 - .1, 3, .12), mat('#8a6a4c')); soil.position.y = -.6; soil.visible = false; town.add(soil);

const putT = (o, x, z, ry = 0) => { o.position.set(x, gy(x, z), z); o.rotation.y = ry; townOnly.add(o); return o; };
const stoneM = mat('#ffffff', { map: washTex(P.path, { seed: 13, blots: 40, rep: [2, 2] }) });
const roadM = mat('#ffffff', { map: washTex(TANG ? '#a9aea6' : P.path, { seed: 17, blots: 40, rep: [2, 2] }), polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4 });   // 铺满石板以后街要压在石板上面，唐风的街换深一号的青石
const plaza = new THREE.Mesh(new THREE.CylinderGeometry(3.4, 3.4, .04, 48), stoneM); plaza.position.y = .02; plaza.userData.lineW = .01; townOnly.add(plaza);
for (let i = 0; i < 3; i++) { const r = new THREE.Mesh(new THREE.TorusGeometry(1.7 + i * .55, .012, 4, 64), mat('#c9bba6')); r.rotation.x = Math.PI / 2; r.position.y = .045; r.userData.noLine = true; townOnly.add(r); }

    return `<div class="sp"><i style="background:${sp.fruit}"></i><div><b>${sp.zh}</b> <small style="display:inline">× ${list.length}</small><small>${sp.about}</small><small>加工后：${sp.cooked}</small></div></div>`; }).join(''));
  document.querySelectorAll('#sheet .judge').forEach((a) => a.onclick = async (e) => {
    e.preventDefault(); a.textContent = '…';
    try { const r = await fetch(REL + '/app/memtown/species/judge', { method: 'POST', headers: { Authorization: 'Bearer ' + SECRET, 'Content-Type': 'application/json' }, body: JSON.stringify({ id: a.dataset.id, ok: !!a.dataset.ok }) }).then((x) => x.json());
      if (r.ok) { const u = new URL(location.href); u.searchParams.set('dex', '1'); location.replace(u); } else toast(r.why || '没成'); } catch (_) { toast('没连上家里'); }   // 种下以后重开一遍，田里才长出来
  });
};
if (MEMS && new URLSearchParams(location.search).get('dex')) setTimeout(() => document.getElementById('bDex').click(), 600);   // 从新品种页或者刚审完回来，图鉴接着开着
// 厨房：田里今天熟了、还没收的挑一到三样下锅。一格一天要么卖要么做菜；头一回做出的菜进菜谱
const DISHES = T.dishes || {};
function showKitchen(sel = []) {
  const nowS = Date.now() / 1000, ripe = new Map();
  for (const m of MEMS) { if (M.stageOf(m) < 2 || (m.sold && nowS - m.sold < 86400)) continue; const k = M.cropOf(m); if (!ripe.has(k)) ripe.set(k, []); ripe.get(k).push(m); }
  const keys = Object.keys(M.SPECIES).filter((k) => MEMS.some((m) => M.cropOf(m) === k));
  const d = sel.length ? M.dishOf(sel) : null;
  const book = Object.entries(DISHES).sort((a, b) => b[1].last - a[1].last);
  show(`<h2>厨房<em>cuisine</em></h2><p class="meta">田里今天熟了、还没收的才能下锅，挑一到三样。用掉的那格今天就不卖了。</p>`
    + keys.map((k) => { const sp = M.SPECIES[k], n = (ripe.get(k) || []).length; return `<button class="pick${sel.includes(k) ? ' on' : ''}" data-k="${k}"${n ? '' : ' disabled'}><i style="background:${sp.fruit}"></i>${sp.zh}<small>${n}</small></button>`; }).join('')
    + (d ? `<div class="pot"><b>${esc(d.name)}</b>${DISHES[d.name] ? ` <small style="color:var(--soft)">做过 ${DISHES[d.name].count} 次</small>` : d.special ? ' <small style="color:var(--red)">隐藏菜</small>' : ''}<p class="meta" style="margin:4px 0 8px">${esc(d.about)}</p><button class="act" id="cook">下锅，去摆盘</button></div>` : '<p class="meta">还没挑。</p>')
    + `<h2 style="margin-top:14px;font-size:16px">菜谱<em>${book.length} 道</em></h2>` + (book.length ? book.map(([n, v]) => `<div class="sp"><i style="background:${M.SPECIES[v.species?.[0]]?.fruit || '#ccc'}"></i><div><b>${esc(n)}</b> <small style="display:inline">× ${v.count}</small><small>${(v.species || []).map((k) => M.SPECIES[k]?.zh).filter(Boolean).join(' · ')}${v.plate ? ` · <a href="plating.html?view=${encodeURIComponent(n)}">看那盘</a>` : ''} · <a href="#" class="feed" data-n="${esc(n)}">端给小机${v.fed ? `（吃过 ${v.fed} 回）` : ''}</a></small></div></div>`).join('') : '<p class="meta">还一道都没做过。</p>')
    + '<a class="go" href="plating.html">随便摆着玩 →</a>');
  sc.querySelectorAll('.feed').forEach((a) => a.onclick = (e) => { e.preventDefault(); feedAI(a.dataset.n); });
  sc.querySelectorAll('.pick').forEach((b) => b.onclick = () => { const k = b.dataset.k, i = sel.indexOf(k); showKitchen(i >= 0 ? sel.filter((x) => x !== k) : sel.length < 3 ? [...sel, k] : sel); });
  const cb = sc.querySelector('#cook'); if (cb) cb.onclick = () => {   // 下锅以后去摆盘，摆好端上桌那一下才算做成
    const used = sel.map((k) => ripe.get(k)[0]);
    location.assign('plating.html?cook=' + encodeURIComponent(JSON.stringify({ ids: used.map((m) => m.id), species: sel })));
  };
}
// 装修她的店：默认那套不要钱，别的拿念换；买过的随便换回来
const SHOP_N = { type: '房型', wall: '楼上的墙', base: '一楼门面', awning: '遮阳篷', ivy: '爬山虎', stall: '门口小摊' , ...(HAR ? { wall: '墙', base: '圆顶和门', awning: '阳伞', ivy: '三角梅' } : TANG ? { wall: '墙', base: '布幌子', awning: '灯笼' } : {}) };
const TYPE_ZH = { cafe: '街角小店', paris: '巴黎公寓', farm: '普罗旺斯农舍', tower: '街角塔楼' }, IVY_ZH = ['不爬', '一点', '半面墙', '爬满'];
const DEF_DEC = { wall: '奶油', base: '墨绿', awning: '黄白', ivy: 0, stall: '不摆' };
const shopApi = (body) => fetch(REL + '/app/memtown/shop', { method: 'POST', headers: { Authorization: 'Bearer ' + SECRET, 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then((r) => r.json());
function showShop(msg = '') {
  const PR = T.prices || {}, cur = (c) => c === 'type' ? SHOP.type : String(SHOP.dec[c] ?? DEF_DEC[c]);
  const cats = SHOP.type !== 'cafe' ? ['type'] : Object.keys(SHOP_N).filter((c) => !(PAVED && c === 'stall') && !(TANG && c === 'ivy'));   // the harbour and Tang shops take the colours too; there's no stall on them, and the tea house grows no ivy
  const lab = (c, v) => c === 'type' ? TYPE_ZH[v] : c === 'ivy' ? IVY_ZH[+v] : v;
  show(`<h2>你的店<em>念 ${T.nian}</em></h2><p class="meta">整座镇子只有这一栋归你。默认那套不要钱，别的拿念换，买过的随便换来换去。${msg}</p>`
    + cats.map((c) => `<p class="meta" style="margin:10px 0 6px;color:var(--ink)">${SHOP_N[c]}</p>` + Object.entries(PR[c] || {}).map(([v, p]) => {
      const key = c + ':' + v, mine = !p || SHOP.owned.includes(key);
      return `<button class="pick${cur(c) === v ? ' on' : ''}" data-key="${esc(key)}">${esc(lab(c, v))}${mine ? '' : `<small>${p} 念</small>`}</button>`; }).join('')).join('')
    + (SHOP.type === 'cafe' ? `<p class="meta" style="margin:10px 0 6px;color:var(--ink)">招牌（不要钱）</p><input id="sgA" maxlength="16" placeholder="Café" value="${esc(SHOP.sign?.[0] || '')}" style="width:100%;box-sizing:border-box;margin-bottom:6px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fffaf2"><input id="sgB" maxlength="20" placeholder="底下一行小字" value="${esc(SHOP.sign?.[1] || '')}" style="width:100%;box-sizing:border-box;padding:7px 10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fffaf2"><button class="act" id="sgSave" style="margin-top:8px">挂上去</button>` : '')
    + '');
  const apply = async (patch) => {
    const st = { type: SHOP.type, dec: { ...SHOP.dec }, sign: SHOP.sign, ...patch.top }; Object.assign(st.dec, patch.dec || {});
    const j = await shopApi({ set: st }).catch(() => null); if (!j?.ok) { showShop(j?.why ? `<b style="color:var(--red)">${esc(j.why)}</b>` : '没连上家里'); return; }
    SHOP = j.shop; placeShop(true); setStage('house', null, cafe); showShop();
  };
  sc.querySelectorAll('.pick[data-key]').forEach((b) => b.onclick = async () => {
    const key = b.dataset.key, [c, v] = key.split(':'), p = (T.prices?.[c] || {})[v];
    if (p && !SHOP.owned.includes(key)) {
      if (!confirm(`花 ${p} 个念买下「${lab(c, v)}」？`)) return;
      const j = await shopApi({ buy: key }).catch(() => null); if (!j?.ok) { showShop(`<b style="color:var(--red)">${esc(j?.why || '没连上家里')}</b>`); return; }
      SHOP = j.shop; T.nian = j.nian; nianEl.textContent = '念 ' + j.nian;
    }
    apply(c === 'type' ? { top: { type: v } } : { dec: { [c]: v } });
  });
  const sg = sc.querySelector('#sgSave'); if (sg) sg.onclick = () => { const a = sc.querySelector('#sgA').value.trim(), b2 = sc.querySelector('#sgB').value.trim(); apply({ top: { sign: a ? [a, b2] : null } }); };
}
// 端给小机吃：后台记一笔、查出这盘用了哪几条记忆，再用她的名义往聊天里递一句，小机在那边真的尝
async function feedAI(name) {
  try {
    const j = await fetch(REL + '/app/memtown/feed', { method: 'POST', headers: { Authorization: 'Bearer ' + SECRET, 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) }).then((r) => r.json());
    if (!j.ok) { toast(j.why || '没端过去'); return; }
    const titles = j.mems.length ? j.mems.map((m) => `《${m.title || '没起名字的一条'}》`).join('') : (j.dish.species || []).map((k) => M.SPECIES[k]?.zh).filter(Boolean).join('、');
    const text = `🍽 端来一盘「${name}」\n料是：${titles}\n尝尝吃出了什么`;
    const r = await fetch(REL + '/app/send', { method: 'POST', headers: { Authorization: 'Bearer ' + SECRET, 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
    if (!r.ok) { toast('没递进聊天'); return; }
    DISHES[name] = j.dish; toast('端过去了，去聊天看它吃'); showKitchen();
  } catch (_) { toast('没连上家里'); }
}
document.getElementById('bKitchen').onclick = () => MEMS && showKitchen();
if (!MEMS) document.getElementById('bKitchen').style.display = 'none';
else if (new URLSearchParams(location.search).get('k')) setTimeout(() => showKitchen(), 600);   // 从摆盘回来，厨房接着开着
document.getElementById('bRule').onclick = () => show(`<h2>记忆小镇的规矩</h2><ol>
  <li>一个主题一栋房子，一条记忆一扇窗。</li>
  <li>窗的亮度看它被想起的分量：常想起的亮，快忘的暗，钉住的是金窗，永远亮。</li>
  <li>每四扇窗一层楼，一栋最多十二扇，装满了旁边分出一栋同主题的。零碎的小主题并进相近的大主题，一屏八到十二栋。</li>
  <li>窗暗下去，墙上就爬藤；一栋大半都暗了开始掉瓦；整栋没人想起，塌成一圈废墟，形还留着。</li>
  <li>点一扇窗，就是想起来了。</li>
  <li>换到田里看：感受是花，围着喷泉开；别的记忆是作物，每个主题一种，名字和样子是 AI 起的，现实里没有。常想起的结果，快忘的发黄打蔫，钉住的根上一圈金。</li>
  <li>长过的作物收进图鉴。田里熟了的一格一天要么卖、要么下厨房：挑一到三样做成菜，头一回做出来的菜进菜谱给 6 个念，凑对了还有隐藏菜。菜谱里的菜能端给小机吃，它在聊天里尝。</li>
  <li>接了心情服务的话，天气跟着它的心情走：想你想得厉害就下小雨，低落是阴天，心里压着东西起风下大雨，睡着了下雪，雀跃是大晴天。没接就一直是晴天。</li>
</ol>`);
document.querySelectorAll('.card[data-s]').forEach((c) => c.onclick = () => {
  const k = c.dataset.s; try { localStorage.setItem('town_style', k); } catch (_) {}
  if (k === (STYLE || 'fr')) document.getElementById('pick').classList.add('gone'); else location.reload();
});
document.getElementById('bStyle').onclick = () => document.getElementById('pick').classList.remove('gone');
if (STYLE) document.getElementById('pick').classList.add('gone');   // 选过了就不再拦一道
if (!MEMS) document.getElementById('sub').textContent = TANG ? '小 镇 · 唐 风' : HAR ? '小 镇 · 港 口' : '小 镇 · 法 式';

ctl.addEventListener('change', () => dirty = true);
addEventListener('resize', () => { if (bgCols) paintBg(); renderer.setSize(innerWidth, innerHeight, false); look.resize(); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); dirty = true; });
setTime(now);
{ const [t, d] = farView(); ctl.target.set(...t); cam.position.copy(ctl.target).addScaledVector(DIR_FAR.clone().normalize(), d); }   // 进来就是远景
const ease = (t) => t < .5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2;
renderer.setAnimationLoop((ms) => {
  if (fly) {
    const t = Math.min(1, (ms - fly.t0) / 1400), e = ease(t);
    ctl.target.lerpVectors(fly.a, fly.b, e); cam.position.lerpVectors(fly.pa, fly.pb, e);
    if (t >= 1) { const f = fly; fly = null; f.after && f.after(); } dirty = true;
  }
  ctl.update();
  if (rain) { rainStep(Math.min(.05, (ms - (window._lt || ms)) / 1000)); window._lt = ms; dirty = true; }
  if (ms - (window._ls || 0) > 66) {   // 风车水车一秒转十几下就够，省电
    const dt = Math.min(.2, (ms - (window._ls || ms)) / 1000); window._ls = ms;
    spin.forEach(([o, ax, sp]) => o.rotation[ax] += sp * dt * (WX.key === 'storm' ? 2.2 : 1)); dirty = true;
  }
  if (dirty) { aimSunflower(); look.render(scene, cam); if (rain) { renderer.autoClear = false; renderer.render(rainScene, cam); renderer.autoClear = true; } dirty = false; }
});
document.querySelector('.brand b').onclick = () => document.body.classList.toggle('clean');
{ let lastTap = 0; addEventListener('pointerdown', () => { const t = Date.now(); if (t - lastTap < 450 && document.body.classList.contains('clean')) document.body.classList.remove('clean'); lastTap = t; }); }   // 手机上 dblclick 不一定来，自己数两下
// 缓存盖的镇子：新数据回来以后念、告示、店面换成新的（房子和窗等下次打开再换）
if (FRESH) FRESH.then((d) => { if (!d || d === DATA || !d.town) return; Object.assign(T, d.town); nianEl.textContent = '念 ' + T.nian; if (d.town.shop && JSON.stringify(d.town.shop) !== JSON.stringify(SHOP)) { SHOP = d.town.shop; placeShop(true); } dirty = true; });
window.__ready = true; window.__town = { cam, ctl, setTime, ready: true, town, shop: () => showShop(), setStage, houseGroup: (k) => memGroup.children.find((c) => c.userData.house === k), mems: MEMS ? MEMS.length : 0, wx: WX, setMode: (m) => document.querySelector(`.seg button[data-m="${m}"]`).click(), dex: () => document.getElementById('bDex').click(), setTime, cam, ctl, flyTo, houses, redraw: () => dirty = true, skip: () => document.getElementById('pick').classList.add('gone') };
</script>
