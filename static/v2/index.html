<div id="float" hidden></div>
<!-- 开屏的海（static/v2/lagoon.js）：点那只海月水母开门。放在最上面，HTML 一到就先盖住 -->
<div id="lagoon">
  <style>
    #lagoon { position: fixed; inset: 0; z-index: 100; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none;
      background: linear-gradient(160deg, #e9dcc0 0%, #7fd6d0 30%, #2fb3c4 65%, #1b7fa6 100%);
      transition: opacity .8s ease, transform .9s cubic-bezier(.5,0,.75,0); }
    #lagoon canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity .6s ease; }
    #lagoon.ready canvas { opacity: 1; }
    #lagoon.out { opacity: 0; transform: scale(1.35); pointer-events: none; }
    #lagoon .lg-days { position: absolute; left: 0; right: 0; bottom: calc(18% + env(safe-area-inset-bottom)); text-align: center; color: #fff;
      pointer-events: none; text-shadow: 0 1px 10px rgba(0,60,80,.45), 0 0 2px rgba(0,60,80,.35); }
    #lagoon .lg-days b { display: block; font-size: 52px; font-weight: 300; letter-spacing: .04em; font-family: "Noto Serif SC", "Songti SC", serif; }
    #lagoon .lg-days span { display: block; margin-top: 4px; font-size: 11px; letter-spacing: .4em; opacity: .9; }
    @media (prefers-reduced-motion: reduce) { #lagoon, #lagoon canvas { transition: none; } }
  </style>
  <canvas></canvas>
  <div class="lg-days"><b>0</b><span>DAYS TOGETHER</span></div>
</div>
<script src="/static/v2/lagoon.js?v=6"></script>
<script>
// 保险：main.js 自己都没跑起来（文件没加载到、某页代码出错）时，别一直白着
(function () {
  var errs = [];
  window.addEventListener("error", function (e) { errs.push((e.message || "加载失败") + (e.filename ? " @" + e.filename.split("/").pop() : "")); }, true);
  window.addEventListener("unhandledrejection", function (e) { errs.push(String(e.reason && e.reason.message || e.reason)); });
  setTimeout(function () {
    if (window.__booted || document.getElementById("bootFail") || document.querySelector("input[type=password]")) return;
    var d = document.createElement("div");
    d.id = "bootFail";
    d.style.cssText = "position:fixed;inset:0;z-index:98;background:#fff3fa;color:#5c0a4f;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center";
    d.innerHTML = '<div><div style="font-size:18px;margin-bottom:8px">没打开</div><div class="small" style="margin-bottom:14px;word-break:break-all"></div><button class="btn">再试一次</button></div>';
    d.querySelector(".small").textContent = errs.slice(0, 3).join(" / ") || "等了 8 秒还没反应";
    d.querySelector("button").onclick = function () { location.reload(); };
    document.body.appendChild(d);
  }, 8000);
})();
</script>
<script type="module" src="/static/v2/main.js?v=ui14"></script>
</body>
</html>
