<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>拼豆板</title>
<style>
  :root { --bg: #f4f1ec; --ink: #3a2a3a; --line: rgba(58,42,58,.14); --pink: #f6c6e0; --plum: #5c0a4f; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; overscroll-behavior: none;
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; -webkit-user-select: none; user-select: none; }
  .app { display: flex; flex-direction: column; height: 100%; max-width: 560px; margin: 0 auto; }
  .top { display: flex; align-items: center; gap: 8px; padding: 10px 12px 6px; }
  .top .name { flex: 1; font-size: 15px; font-weight: 600; border: 0; background: transparent; color: var(--ink); font-family: inherit; min-width: 0; }
  .top .who { font-size: 11px; opacity: .55; white-space: nowrap; }
  .top .nm { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .top .nm .name { flex: none; width: 100%; padding: 0; }
  .top .tb { background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; font: inherit; font-size: 12px; color: var(--ink); white-space: nowrap; flex: none; }
  .top .tb.on { background: var(--plum); color: #fff; border-color: var(--plum); }
  .stage { position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: none; }
  canvas { position: absolute; left: 0; top: 0; transform-origin: 0 0; image-rendering: auto; }
  .tools { display: flex; gap: 5px; padding: 6px 12px; align-items: center; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .tools button { flex: 0 0 auto; }
  .tools button, .row2 button, select { background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px;
    font: inherit; font-size: 12.5px; color: var(--ink); }
  .tools button.on { background: var(--plum); color: #fff; border-color: var(--plum); }
  .pal { display: flex; gap: 6px; overflow-x: auto; padding: 6px 12px 4px; scrollbar-width: none; }
  .pal::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; border: 2px solid rgba(0,0,0,.12); position: relative; }
  .chip::after { content: ""; position: absolute; inset: 9px; border-radius: 50%; background: var(--bg); opacity: .9; }
  .chip.on { outline: 3px solid var(--plum); outline-offset: 2px; }
  .chip.addc { background: #fff; font-size: 18px; color: var(--plum); border-style: dashed; }
  .chip.addc::after { display: none; }
  .cname { font-size: 12px; opacity: .6; padding: 0 12px; height: 16px; }
  .row2 { display: flex; gap: 6px; padding: 6px 12px 12px; flex-wrap: wrap; }
  .row2 .ask { background: var(--pink); border-color: transparent; color: #3a1030; font-weight: 600; }
  .count { font-size: 12px; opacity: .7; padding: 0 12px 10px; line-height: 1.7; max-height: 54px; overflow-y: auto; }
  .count b { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin: 0 3px 0 8px; vertical-align: -1px; }
  .book { position: fixed; inset: 0; background: rgba(244,241,236,.97); z-index: 5; display: flex; flex-direction: column; }
  .book .bh { display: flex; align-items: center; padding: 12px; gap: 8px; font-weight: 600; }
  .book .bh span { flex: 1; }
  .book .bh button, .book .acts button { background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; color: var(--ink); }
  .book .list { flex: 1; overflow-y: auto; padding: 0 12px 20px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; align-content: start; }
  .book .it { background: #fff; border-radius: 14px; padding: 10px; border: 1px solid var(--line); }
  .book .it.cur { border-color: var(--plum); box-shadow: 0 0 0 2px rgba(92,10,79,.15); }
  .book .it canvas { position: static; width: 100%; aspect-ratio: 1; display: block; transform: none; }
  .book .nm { font-size: 13px; font-weight: 600; margin-top: 6px; }
  .book .meta { font-size: 11px; opacity: .55; margin: 2px 0 6px; }
  .book .acts { display: flex; gap: 6px; }
  .book .acts button { padding: 4px 10px; font-size: 12px; }
  .upanel { display: none; gap: 8px; padding: 4px 12px 6px; align-items: center; flex-wrap: wrap; font-size: 12.5px; }
  .upanel.on { display: flex; }
  .upanel input[type=range] { width: 110px; }
  .upanel button { background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; font: inherit; font-size: 12.5px; color: var(--ink); }
  .upanel label { display: flex; align-items: center; gap: 4px; }
  .upanel button.on { background: var(--plum); color: #fff; border-color: var(--plum); }
  .toast { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); background: rgba(58,42,58,.85); color: #fff;
    padding: 6px 14px; border-radius: 999px; font-size: 13px; pointer-events: none; opacity: 0; transition: opacity .25s; white-space: nowrap; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="nm"><input class="name" id="name" placeholder="给这块板起个名字" maxlength="30"><span class="who" id="who"></span></div><button class="tb" id="mmBtn"></button><button class="tb" id="underBtn">🖼 底图</button></div>
  <div class="upanel" id="upanel">
    <button id="uPick">选一张图</button>
    <label>深浅 <input type="range" id="uAlpha" min="10" max="100" value="45"></label>
    <button id="uAdj">✋ 调底图</button><button id="uReset">复位</button>
    <button id="uMode">完整显示</button><button id="uShow">藏起来</button>
    <button id="uConv">✨ 转成豆子</button><label><input type="checkbox" id="uBg" checked>白底当空</label>
    <button id="uDel">去掉底图</button>
    <input type="file" id="uFile" accept="image/*" hidden>
  </div>
  <div class="stage" id="stage"><canvas id="cv"></canvas><div class="toast" id="toast"></div></div>
  <div class="tools">
    <button id="tPen" class="on">✏️ 画</button><button id="tErase">🧽 擦</button><button id="tPick">💧 吸色</button><button id="tMove">✥ 挪图</button>
    <button id="undo">↶</button><button id="redo">↷</button><button id="fit">⤢</button><button id="center">居中</button><button id="gridBtn">#</button>
  </div>
  <div class="pal" id="pal"></div><input type="color" id="cpick" value="#7fb3d5" hidden>
  <div class="cname" id="cname"></div>
  <div class="row2">
    <button class="ask" id="ask">🪼 叫小克来画</button><button id="bookBtn">📒 图纸本</button><button id="keep">收进图纸本</button><button id="export">存图纸</button>
    <select id="size"><option value="">换板子大小</option><option>15</option><option>20</option><option>29</option><option>40</option><option>52</option><option>80</option><option>100</option><option value="fit">贴着图收紧</option><option value="custom">自己填…</option></select>
    <button id="clear">清空</button>
  </div>
  <div class="count" id="count"></div>
</div>
<script>
// 拼豆板：她和小克共用的一块板。单指画、双指拖和放大；存在服务器上，小克在聊天里用 beads_paint 画，这里几秒就看到。
const $ = (id) => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d"), stage = $("stage");
let B = null, colors = [], cur = 11, tool = "pen", grid = true;
let view = { s: 1, x: 0, y: 0 }, CELL = 24;
// 板子很大时格子画小一点，免得画布超出手机能画的大小
function sizeCell() { const dpr = devicePixelRatio || 1; CELL = Math.max(4, Math.min(24, Math.floor(3600 / (Math.max(B.w, B.h) * dpr)))); }
const undoStack = [], redoStack = [];
let dirty = false, saveTimer = 0, saving = false;

function toast(t, ms = 1800) { const e = $("toast"); e.textContent = t; e.classList.add("show"); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove("show"), ms); }
async function api(path, opts = {}) {
  const r = await fetch(path, { method: opts.method || "GET", headers: opts.body ? { "Content-Type": "application/json" } : {}, body: opts.body ? JSON.stringify(opts.body) : undefined });
  if (!r.ok) { let m = r.status + ""; try { m = (await r.json()).detail || m; } catch {} const e = new Error(m); e.status = r.status; throw e; }
  return r.json();
}

// ── 画 ──
// 板子四周留一圈边：上边和左边标这张图实际占了多大（按选的豆子算，成品大约多少厘米）
const OX = 64, OY = 56, OR = 12, OB = 12;
let beadMM = 2.6;
try { beadMM = +localStorage.getItem("beadMM") || 2.6; } catch {}
let under = null;   // 底图：{ img, alpha, mode: "contain"|"cover", show }
function extent() {
  let x0 = B.w, y0 = B.h, x1 = -1, y1 = -1;
  B.cells.forEach((v, i) => { if (v < 0) return; const x = i % B.w, y = (i / B.w) | 0; x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); });
  return x1 < 0 ? null : { x0, y0, x1, y1, w: x1 - x0 + 1, h: y1 - y0 + 1 };
}
const cm = (n) => (n * beadMM / 10).toFixed(n * beadMM >= 100 ? 0 : 1);
// 底图的位置：先按「完整 / 铺满」摆好，再乘上她手调的放大 k、挪 ox/oy（按板子宽高的比例记，换画布大小也对得上）
function underRect(W, H) {
  const iw = under.img.naturalWidth, ih = under.img.naturalHeight;
  const k = (under.mode === "cover" ? Math.max(W / iw, H / ih) : Math.min(W / iw, H / ih)) * (under.k || 1);
  return [(W - iw * k) / 2 + (under.ox || 0) * W, (H - ih * k) / 2 + (under.oy || 0) * H, iw * k, ih * k];
}
function dimLine(c, x0, y0, x1, y1, label, vertical) {
  c.strokeStyle = "rgba(92,10,79,.55)"; c.fillStyle = "rgba(92,10,79,.85)"; c.lineWidth = 1;
  c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke();
  const t = 4;
  c.beginPath();
  if (vertical) { c.moveTo(x0 - t, y0); c.lineTo(x0 + t, y0); c.moveTo(x1 - t, y1); c.lineTo(x1 + t, y1); }
  else { c.moveTo(x0, y0 - t); c.lineTo(x0, y0 + t); c.moveTo(x1, y1 - t); c.lineTo(x1, y1 + t); }
  c.stroke();
  c.save(); c.font = "600 17px -apple-system, sans-serif"; c.textAlign = "center"; c.textBaseline = "middle";
  const mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
  if (vertical) { c.translate(mx - 14, my); c.rotate(-Math.PI / 2); c.fillText(label, 0, 0); }
  else c.fillText(label, mx, my - 13);
  c.restore();
}
function paintBoard(c, CELLp, ox, oy, opts = {}) {
  const W = B.w * CELLp, H = B.h * CELLp, r = CELLp / 2;
  c.fillStyle = "#fbfaf7"; c.fillRect(ox, oy, W, H);
  if (under && under.show && !opts.noUnder) {
    const [ux, uy, uw, uh] = underRect(W, H);
    c.save(); c.beginPath(); c.rect(ox, oy, W, H); c.clip(); c.globalAlpha = under.alpha; c.drawImage(under.img, ox + ux, oy + uy, uw, uh); c.restore();
  }
  for (let y = 0; y < B.h; y++) for (let x = 0; x < B.w; x++) {
    const v = B.cells[y * B.w + x], cx = ox + x * CELLp + r, cy = oy + y * CELLp + r;
    if (v < 0) { if (!opts.noDots && CELLp >= 8) { c.fillStyle = "rgba(58,42,58,.13)"; c.beginPath(); c.arc(cx, cy, 1.6, 0, 7); c.fill(); } continue; }
    if (CELLp < 8) { c.fillStyle = colors[v].hex; c.fillRect(cx - r + .3, cy - r + .3, CELLp - .6, CELLp - .6); continue; }   // 格子太小：画成小方块就好
    c.fillStyle = colors[v].hex; c.beginPath(); c.arc(cx, cy, r - 1.2, 0, 7); c.fill();
    if (CELLp >= 12) { c.strokeStyle = "rgba(0,0,0,.16)"; c.lineWidth = 1; c.stroke(); }
    c.fillStyle = "#fbfaf7"; c.beginPath(); c.arc(cx, cy, r * 0.3, 0, 7); c.fill();
  }
  if (grid || opts.grid) {
    for (let i = 0; i <= B.w; i++) { if (i % 5 && CELLp < 10) continue; c.strokeStyle = i % 5 === 0 ? "rgba(92,10,79,.25)" : "rgba(58,42,58,.07)"; c.beginPath(); c.moveTo(ox + i * CELLp, oy); c.lineTo(ox + i * CELLp, oy + H); c.stroke(); }
    for (let j = 0; j <= B.h; j++) { if (j % 5 && CELLp < 10) continue; c.strokeStyle = j % 5 === 0 ? "rgba(92,10,79,.25)" : "rgba(58,42,58,.07)"; c.beginPath(); c.moveTo(ox, oy + j * CELLp); c.lineTo(ox + W, oy + j * CELLp); c.stroke(); }
  }
  const e = extent();
  if (e) {
    // 实际占的那一块：上边标宽、左边标高
    dimLine(c, ox + e.x0 * CELLp, oy - 18, ox + (e.x1 + 1) * CELLp, oy - 18, `${e.w} 颗 ≈ ${cm(e.w)} cm`, false);
    dimLine(c, ox - 18, oy + e.y0 * CELLp, ox - 18, oy + (e.y1 + 1) * CELLp, `${e.h} 颗 ≈ ${cm(e.h)} cm`, true);
    c.setLineDash([3, 3]); c.strokeStyle = "rgba(92,10,79,.25)";
    c.strokeRect(ox + e.x0 * CELLp + .5, oy + e.y0 * CELLp + .5, e.w * CELLp - 1, e.h * CELLp - 1); c.setLineDash([]);
  }
  return e;
}
function draw() {
  if (!B) return;
  const dpr = devicePixelRatio || 1, W = B.w * CELL + OX + OR, H = B.h * CELL + OY + OB;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cv.style.width = W + "px"; cv.style.height = H + "px"; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  paintBoard(ctx, CELL, OX, OY);
  applyView(); counts();
}
function applyView() { cv.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.s})`; }
function fit() {
  const W = B.w * CELL + OX + OR, H = B.h * CELL + OY + OB, sw = stage.clientWidth, sh = stage.clientHeight;
  view.s = Math.min((sw - 8) / W, (sh - 8) / H);
  view.x = (sw - W * view.s) / 2; view.y = (sh - H * view.s) / 2; applyView();
}
function counts() {
  const n = {}; for (const c of B.cells) if (c >= 0) n[c] = (n[c] || 0) + 1;
  const keys = Object.keys(n).sort((a, b) => n[b] - n[a]);
  const total = keys.reduce((s, k) => s + n[k], 0);
  const e = extent();
  const size = e ? `成品约 ${cm(e.w)}×${cm(e.h)} cm（${beadMM === 5 ? "5mm 大豆" : "2.6mm 迷你豆"}）· ` : "";
  $("count").innerHTML = total ? size + `共 ${total} 颗：` + keys.map((k) => `<b style="background:${colors[k].hex}"></b>${colors[k].name} ${n[k]}`).join("") : "板子是空的。";
}
function palette() {
  $("pal").innerHTML = "";
  colors.forEach((c, i) => {
    const d = document.createElement("button"); d.className = "chip" + (i === cur ? " on" : ""); d.style.background = c.hex; d.title = c.name;
    d.onclick = () => { cur = i; if (tool !== "pen") setTool("pen"); palette(); };
    $("pal").append(d);
  });
  const add = document.createElement("button"); add.className = "chip addc"; add.textContent = "＋"; add.title = "调一个新颜色";
  add.onclick = () => $("cpick").click();
  $("pal").append(add);
  $("cname").textContent = "现在的颜色：" + colors[cur].name + (colors[cur].mine ? "（自己调的）" : "");
}
function setTool(t) {
  tool = t;
  for (const [id, k] of [["tPen", "pen"], ["tErase", "erase"], ["tPick", "pick"], ["tMove", "move"], ["uAdj", "under"]]) $(id) && $(id).classList.toggle("on", k === t);
  if (t === "move") toast("单指拖着整张图挪，一次挪一格");
  if (t === "under") toast("单指拖底图，双指捏着放大缩小");
}

// ── 手势：单指画，双指拖/放大 ──
const ptrs = new Map(); let gest = null, stroke = null;
function cellAt(px, py) {
  const r = stage.getBoundingClientRect();
  const x = Math.floor(((px - r.left - view.x) / view.s - OX) / CELL), y = Math.floor(((py - r.top - view.y) / view.s - OY) / CELL);
  return x >= 0 && y >= 0 && x < B.w && y < B.h ? [x, y] : null;
}
function paintAt(px, py) {
  const p = cellAt(px, py); if (!p) return;
  // 手指划得快会跳格：从上一格到这一格连成一条线
  const last = stroke && stroke.last;
  if (stroke) stroke.last = p;
  if (last && tool !== "pick" && (Math.abs(last[0] - p[0]) > 1 || Math.abs(last[1] - p[1]) > 1)) {
    const n = Math.max(Math.abs(p[0] - last[0]), Math.abs(p[1] - last[1]));
    for (let k = 1; k < n; k++) paintCell(Math.round(last[0] + (p[0] - last[0]) * k / n), Math.round(last[1] + (p[1] - last[1]) * k / n));
  }
  paintCell(p[0], p[1]);
}
function paintCell(cx, cy) {
  const p = [cx, cy], i = cy * B.w + cx;
  if (tool === "pick") { if (B.cells[i] >= 0) { cur = B.cells[i]; palette(); setTool("pen"); toast("拿到了：" + colors[cur].name); } return; }
  const v = tool === "erase" ? -1 : cur;
  if (B.cells[i] === v) return;
  if (!stroke.changes.has(i)) stroke.changes.set(i, B.cells[i]);
  B.cells[i] = v; draw();
}
// 挪图：整张图跟着手指一格一格走，拖到边就停（豆子不会被挤出板子）
let moveDrag = null, underDrag = null;
function shifted(src, dx, dy) {
  const out = Array(B.w * B.h).fill(-1);
  src.forEach((v, i) => { if (v < 0) return; const x = i % B.w + dx, y = ((i / B.w) | 0) + dy; out[y * B.w + x] = v; });
  return out;
}
const boardPx = () => [B.w * CELL, B.h * CELL];
stage.addEventListener("pointerdown", (e) => {
  stage.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1 && B) {
    if (tool === "move") {
      const ex = extent(); if (!ex) return;
      moveDrag = { x: e.clientX, y: e.clientY, src: B.cells.slice(), ex, dx: 0, dy: 0 };
    } else if (tool === "under" && under) {
      underDrag = { x: e.clientX, y: e.clientY, ox: under.ox || 0, oy: under.oy || 0 };
    } else { stroke = { changes: new Map() }; paintAt(e.clientX, e.clientY); }
  }
  if (ptrs.size === 2) {
    if (stroke) { endStroke(true); }                // 第二根手指落下：刚才那一笔不算，改成拖
    if (moveDrag) { B.cells = moveDrag.src; moveDrag = null; draw(); }
    const [a, b] = [...ptrs.values()];
    gest = { d: Math.hypot(a.x - b.x, a.y - b.y), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, ...view,
             under: tool === "under" && under ? { k: under.k || 1, ox: under.ox || 0, oy: under.oy || 0 } : null };
    underDrag = null;
  }
});
stage.addEventListener("pointermove", (e) => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size >= 2 && gest && gest.under) {      // 调底图：双指捏底图本身
    const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const [W, H] = boardPx();
    under.k = Math.min(12, Math.max(0.1, gest.under.k * d / gest.d));
    under.ox = gest.under.ox + (mx - gest.mx) / view.s / W;
    under.oy = gest.under.oy + (my - gest.my) / view.s / H;
    draw(); return;
  }
  if (underDrag) {
    const [W, H] = boardPx();
    under.ox = underDrag.ox + (e.clientX - underDrag.x) / view.s / W;
    under.oy = underDrag.oy + (e.clientY - underDrag.y) / view.s / H;
    draw(); return;
  }
  if (moveDrag) {
    const m = moveDrag, ex = m.ex;
    let dx = Math.round((e.clientX - m.x) / view.s / CELL), dy = Math.round((e.clientY - m.y) / view.s / CELL);
    dx = Math.max(-ex.x0, Math.min(B.w - 1 - ex.x1, dx)); dy = Math.max(-ex.y0, Math.min(B.h - 1 - ex.y1, dy));
    if (dx !== m.dx || dy !== m.dy) { m.dx = dx; m.dy = dy; B.cells = shifted(m.src, dx, dy); draw(); }
    return;
  }
  if (ptrs.size >= 2 && gest) {
    const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const r = stage.getBoundingClientRect(), s = Math.min(6, Math.max(0.3, gest.s * d / gest.d));
    const ox = gest.mx - r.left, oy = gest.my - r.top;
    view.s = s; view.x = ox - (ox - gest.x) * s / gest.s + (mx - gest.mx); view.y = oy - (oy - gest.y) * s / gest.s + (my - gest.my);
    applyView();
  } else if (stroke) paintAt(e.clientX, e.clientY);

function endStroke(cancel) {

  stroke = null;
}
for (const t of ["pointerup", "pointercancel"]) stage.addEventListener(t, (e) => {
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) gest = null;

    if (moveDrag) {
      const m = moveDrag; moveDrag = null;
      if (m.dx || m.dy) {
        const ch = new Map(); m.src.forEach((v, i) => { if (B.cells[i] !== v) ch.set(i, v); });
        undoStack.push(ch); redoStack.length = 0; changed();

  }
});
stage.addEventListener("wheel", (e) => {
  e.preventDefault();
  if (tool === "under" && under) { under.k = Math.min(12, Math.max(0.1, (under.k || 1) * Math.exp(-e.deltaY / 300))); draw(); return; }
  const r = stage.getBoundingClientRect(), ox = e.clientX - r.left, oy = e.clientY - r.top, k = Math.exp(-e.deltaY / 300);

document.addEventListener("gesturestart", (e) => e.preventDefault());

// ── 撤销、存 ──
function undo(from, to) {
  const ch = from.pop(); if (!ch) return;
  const back = new Map(); for (const [i, v] of ch) { back.set(i, B.cells[i]); B.cells[i] = v; }
  to.push(back); draw(); changed();
}
$("undo").onclick = () => undo(undoStack, redoStack);
$("redo").onclick = () => undo(redoStack, undoStack);
function changed() { dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(save, 700); }
async function save() {
  if (saving) { saveTimer = setTimeout(save, 400); return; }
  saving = true;
  try {
    const r = await api("/api/beads", { method: "POST", body: { rev: B.rev, w: B.w, h: B.h, cells: B.cells, name: $("name").value.trim(), book_id: B.book_id ?? null } });
    B.rev = r.rev; B.by = "Ella"; dirty = false; who();
  } catch (e) {
    if (e.status === 409) {           // 小克刚画过：把我这几笔叠到他的上面
      const mine = B.cells.slice(), base = await api("/api/beads");
      const before = baseCells;
      B = { ...base, cells: base.cells.map((v, i) => (mine[i] !== before[i] ? mine[i] : v)) };
      baseCells = base.cells.slice(); dirty = true; draw(); saving = false; return save();
    }
    toast("没存上：" + e.message);
  }
  baseCells = B.cells.slice(); saving = false;
}
let baseCells = [];
function who() { $("who").textContent = B.by ? `最后一笔：${B.by}` : ""; }

// 隔几秒看看小克有没有画
async function poll(force) {
  if (!force && (document.hidden || dirty || saving || ptrs.size)) return;
  try {
    const d = await api("/api/beads");
    if (d.rev !== B.rev) {
      const sizeChanged = d.w !== B.w || d.h !== B.h;
      B = d; baseCells = d.cells.slice(); $("name").value = d.name || ""; who(); draw();
      if (d.colors && d.colors.length !== colors.length) { colors = d.colors; palette(); }
      if (sizeChanged) { cv.width = 0; sizeCell(); draw(); fit(); }
      if (d.by === "章小克") toast("小克画了几笔 🪼");
    }
  } catch {}
}

// ── 按钮 ──
$("tMove").onclick = () => setTool(tool === "move" ? "pen" : "move");
$("tPen").onclick = () => setTool("pen"); $("tErase").onclick = () => setTool("erase"); $("tPick").onclick = () => setTool("pick");
$("fit").onclick = fit;
$("center").onclick = () => {   // 把整张图挪到板子正中间
  const ex = extent(); if (!ex) return;
  const dx = Math.floor((B.w - ex.w) / 2) - ex.x0, dy = Math.floor((B.h - ex.h) / 2) - ex.y0;
  if (!dx && !dy) return toast("已经在正中间了");
  const src = B.cells.slice(); B.cells = shifted(src, dx, dy);
  const ch = new Map(); src.forEach((v, i) => { if (B.cells[i] !== v) ch.set(i, v); });
  undoStack.push(ch); redoStack.length = 0; draw(); changed();
};
$("gridBtn").onclick = () => { grid = !grid; draw(); };
$("name").onchange = changed;
$("clear").onclick = () => {
  if (!confirm("整块板清空？（能用 ↶ 撤回）")) return;
  const ch = new Map(); B.cells.forEach((v, i) => { if (v >= 0) { ch.set(i, v); B.cells[i] = -1; } });
  undoStack.push(ch); redoStack.length = 0; draw(); changed();
};
$("size").onchange = async (e) => {
  const v = e.target.value; e.target.value = ""; if (!v) return;
  let w, hh;
  const ex = extent();
  if (v === "fit") { if (!ex) return toast("板子是空的"); w = ex.w + 2; hh = ex.h + 2; }   // 四周留一格
  else if (v === "custom") {
    const t = prompt("板子多大？宽×高，比如 21x33（最大 150）", `${B.w}x${B.h}`); if (!t) return;
    const m = t.match(/(\d+)\s*[x×*，, ]\s*(\d+)/i) || t.match(/^(\d+)$/);
    if (!m) return toast("没看懂，写成 21x33 这样");
    w = +m[1]; hh = +(m[2] || m[1]);
  } else { w = hh = +v; }
  w = Math.max(5, Math.min(150, w)); hh = Math.max(5, Math.min(150, hh));
  if (w === B.w && hh === B.h) return;
  // 现在的图挪到新板子正中间；放不下就问一下要不要裁
  const out = Array(w * hh).fill(-1);
  if (ex) {
    if ((ex.w > w || ex.h > hh) && !confirm(`图有 ${ex.w}×${ex.h}，新板子 ${w}×${hh} 放不下，边上会被裁掉。还换吗？`)) return;
    const dx = Math.floor((w - ex.w) / 2) - ex.x0, dy = Math.floor((hh - ex.h) / 2) - ex.y0;
    B.cells.forEach((c, i) => { if (c < 0) return; const x = i % B.w + dx, y = ((i / B.w) | 0) + dy; if (x >= 0 && y >= 0 && x < w && y < hh) out[y * w + x] = c; });
  }
  B.w = w; B.h = hh; B.cells = out; undoStack.length = redoStack.length = 0;
  cv.width = 0; sizeCell(); draw(); fit(); changed(); toast(`换成 ${w}×${hh} 了`);
};
// 调一个新颜色：取色盘选好，起个名字，加进调色板（服务器记着，小克那边也能用）
$("cpick").onchange = async (e) => {
  const hx = e.target.value;
  const name = prompt("给这个颜色起个名字（比如 星光蓝）", "");
  if (name === null) return;
  try {
    const r = await api("/api/beads/colors", { method: "POST", body: { hex: hx, name: name.trim() || hx } });
    colors = r.colors; cur = colors.length - 1; setTool("pen"); palette(); toast("加好了：" + colors[cur].name);
    requestAnimationFrame(() => { $("pal").scrollLeft = $("pal").scrollWidth; });
  } catch (err) { toast("没加上：" + err.message); }
};
$("ask").onclick = async () => {
  const note = prompt("想让小克画什么？（不写就是「轮到你画了」）", "");
  if (note === null) return;
  if (dirty) await save();
  try {
    const r = await api("/api/beads/ask", { method: "POST", body: { note: note.trim() } });
    toast(r.busy ? "叫了，他回完手上那句就来" : "叫了，他马上来 🪼", 2600);
  } catch (e) { toast("没叫到：" + e.message); }
};

// ── 豆子大小（只影响标的尺寸）──
function mmLabel() { $("mmBtn").textContent = beadMM === 5 ? "5mm 大豆" : "2.6mm 迷你"; }
$("mmBtn").onclick = () => { beadMM = beadMM === 5 ? 2.6 : 5; try { localStorage.setItem("beadMM", beadMM); } catch {} mmLabel(); draw(); };
mmLabel();

// ── 底图：照着描，或者一键转成豆子。只在这台手机上，不传服务器 ──
$("underBtn").onclick = () => { const on = $("upanel").classList.toggle("on"); $("underBtn").classList.toggle("on", on); requestAnimationFrame(fit); if (on && !under) $("uFile").click(); };
$("uPick").onclick = () => $("uFile").click();
$("uFile").onchange = (e) => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  const img = new Image();
  img.onload = () => { under = { img, alpha: +$("uAlpha").value / 100, mode: "contain", show: true, k: 1, ox: 0, oy: 0 }; $("uMode").textContent = "铺满"; $("uShow").textContent = "藏起来"; $("upanel").classList.add("on"); $("underBtn").classList.add("on"); draw(); toast("底图放好了，照着描，或者点「转成豆子」"); };
  img.onerror = () => toast("这张图打不开");
  img.src = URL.createObjectURL(f);
};
$("uAdj").onclick = () => { if (!under) return toast("先选一张图"); setTool(tool === "under" ? "pen" : "under"); };
$("uReset").onclick = () => { if (!under) return; under.k = 1; under.ox = under.oy = 0; draw(); };
$("uAlpha").oninput = (e) => { if (under) { under.alpha = +e.target.value / 100; draw(); } };
$("uMode").onclick = () => { if (!under) return; under.mode = under.mode === "contain" ? "cover" : "contain"; $("uMode").textContent = under.mode === "contain" ? "铺满" : "完整显示"; draw(); };
$("uShow").onclick = () => { if (!under) return; under.show = !under.show; $("uShow").textContent = under.show ? "藏起来" : "显示"; draw(); };
$("uDel").onclick = () => { if (tool === "under") setTool("pen"); under = null; draw(); $("upanel").classList.remove("on"); $("underBtn").classList.remove("on"); };
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function nearest(r, g, b) {
  let best = 0, bd = 1e9;
  colors.forEach((c, i) => {
    const [R, G, Bc] = c.rgb || (c.rgb = hex2rgb(c.hex));
    const rm = (r + R) / 2, dr = r - R, dg = g - G, db = b - Bc;
    const d = (2 + rm / 256) * dr * dr + 4 * dg * dg + (2 + (255 - rm) / 256) * db * db;   // 比直接算 RGB 距离更像人眼
    if (d < bd) { bd = d; best = i; }
  });
  return best;
}
$("uConv").onclick = () => {
  if (!under) return toast("先选一张图");
  if (B.cells.some((v) => v >= 0) && !confirm("把底图转成豆子，会盖掉板上现在的豆子（能用 ↶ 撤回）。转吗？")) return;
  // 先把图按板子的格数缩小，一格一个像素，就是这一格的平均颜色
  const S = 6, W = B.w * S, H = B.h * S, c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d", { willReadFrequently: true }); x.imageSmoothingQuality = "high";
  const [ux, uy, uw, uh] = underRect(W, H); x.drawImage(under.img, ux, uy, uw, uh);
  const px = x.getImageData(0, 0, W, H).data, bgEmpty = $("uBg").checked, ch = new Map();
  for (let j = 0; j < B.h; j++) for (let i = 0; i < B.w; i++) {
    let r = 0, g = 0, b = 0, a = 0, n = 0;
    for (let yy = 0; yy < S; yy++) for (let xx = 0; xx < S; xx++) {
      const k = ((j * S + yy) * W + i * S + xx) * 4; r += px[k]; g += px[k + 1]; b += px[k + 2]; a += px[k + 3]; n++;
    }
    r /= n; g /= n; b /= n; a /= n;
    let v = a < 110 ? -1 : nearest(r, g, b);
    if (v >= 0 && bgEmpty && r > 238 && g > 238 && b > 238) v = -1;
    const idx = j * B.w + i;
    if (B.cells[idx] !== v) { ch.set(idx, B.cells[idx]); B.cells[idx] = v; }
  }
  if (!ch.size) return toast("没什么要变的");
  undoStack.push(ch); redoStack.length = 0; under.show = false; $("uShow").textContent = "显示"; draw(); changed();
  toast("转好了。不满意就 ↶，或者调「铺满/完整」再转");
};

// ── 图纸本 ──
function thumb(e) {
  const c = document.createElement("canvas"), S = 8; c.width = e.w * S; c.height = e.h * S;
  const x = c.getContext("2d"); x.fillStyle = "#fbfaf7"; x.fillRect(0, 0, c.width, c.height);
  e.cells.forEach((v, i) => { if (v < 0) return; x.fillStyle = colors[v].hex; x.beginPath(); x.arc((i % e.w) * S + S / 2, Math.floor(i / e.w) * S + S / 2, S / 2 - .7, 0, 7); x.fill(); x.strokeStyle = "rgba(0,0,0,.12)"; x.lineWidth = .8; x.stroke(); });
  return c;
}
async function keep(asNew) {
  if (dirty) await save();
  const r = await api("/api/beads/book", { method: "POST", body: { action: "save", as_new: !!asNew, name: $("name").value.trim() } });
  B.book_id = r.saved; await poll(true); toast("收进图纸本了 📒"); return r;
}
$("keep").onclick = () => keep(false).catch((e) => toast("没收进去：" + e.message));
$("bookBtn").onclick = openBook;
async function openBook() {
  let items;
  try { items = (await api("/api/beads/book")).items; } catch (e) { return toast("图纸本没打开：" + e.message); }
  const box = document.createElement("div"); box.className = "book";
  box.innerHTML = `<div class="bh"><span>📒 图纸本 · ${items.length} 张</span><button data-new>另存一张</button><button data-x>关掉</button></div><div class="list"></div>`;
  box.querySelector("[data-x]").onclick = () => box.remove();
  box.querySelector("[data-new]").onclick = async () => { await keep(true); box.remove(); openBook(); };
  const list = box.querySelector(".list");
  for (const e of items) {
    const n = e.cells.filter((v) => v >= 0).length;
    const it = document.createElement("div"); it.className = "it" + (e.id === B.book_id ? " cur" : "");
    it.append(thumb(e));
    it.insertAdjacentHTML("beforeend", `<div class="nm"></div><div class="meta">${e.w}×${e.h} · ${n} 颗${e.id === B.book_id ? " · 板上这张" : ""}</div><div class="acts"><button data-o>摆上板子</button><button data-d>🗑</button></div>`);
    it.querySelector(".nm").textContent = e.name;
    it.querySelector("[data-o]").onclick = async () => {
      if (B.book_id !== e.id && B.cells.some((v) => v >= 0)) {
        if (!B.book_id && confirm("板上这块还没收进图纸本，先收进去吗？")) await keep(false);
        else if (B.book_id) await keep(false);   // 板上这张是从图纸本里打开的：改动先存回那一张
      }
      try {
        const r = await api("/api/beads/book", { method: "POST", body: { action: "open", id: e.id } });
        B = { ...B, ...r.board }; baseCells = B.cells.slice(); $("name").value = B.name || ""; undoStack.length = redoStack.length = 0; sizeCell();
        cv.width = 0; draw(); fit(); who(); box.remove(); toast("摆好了：" + e.name);
      } catch (err) { toast("没摆上：" + err.message); }
    };
    it.querySelector("[data-d]").onclick = async () => {
      if (!confirm(`从图纸本里删掉「${e.name}」？`)) return;
      await api("/api/beads/book", { method: "POST", body: { action: "delete", id: e.id } });
      box.remove(); openBook();
    };
    list.append(it);
  }
  document.body.append(box);
}

// 图纸：带坐标和格线，底下列出每种颜色多少颗，去工作室照着拼
$("export").onclick = async () => {
  const S = Math.max(10, Math.min(28, Math.floor(3800 / Math.max(B.w, B.h)))), padL = 70, padT = 64, padR = 28, W = B.w * S, H = B.h * S;
  const n = {}; for (const c of B.cells) if (c >= 0) n[c] = (n[c] || 0) + 1;
  const keys = Object.keys(n).sort((a, b) => n[b] - n[a]);
  const legendH = 70 + Math.ceil(keys.length / 3) * 30;
  const c = document.createElement("canvas"); c.width = W + padL + padR; c.height = H + padT + legendH;
  const x = c.getContext("2d");
  x.fillStyle = "#fbfaf7"; x.fillRect(0, 0, c.width, c.height);
  const e = paintBoard(x, S, padL, padT, { noUnder: true, noDots: true, grid: true });
  // 行列号：每 5 格标一个，从 1 数
  x.fillStyle = "#3a2a3a"; x.font = "11px -apple-system, sans-serif"; x.textAlign = "center"; x.textBaseline = "middle";
  for (let i = 0; i < B.w; i++) if (i % 5 === 0 || i === B.w - 1) x.fillText(i + 1, padL + i * S + S / 2, padT + H + 12);
  x.textAlign = "right";
  for (let j = 0; j < B.h; j++) if (j % 5 === 0 || j === B.h - 1) x.fillText(j + 1, padL + W + 20, padT + j * S + S / 2);
  x.textAlign = "left"; x.font = "bold 15px -apple-system, sans-serif"; x.fillStyle = "#3a2a3a";
  const total = keys.reduce((s, k) => s + n[k], 0);
  x.fillText(`${$("name").value.trim() || "拼豆图纸"} · ${B.w}×${B.h} 的板 · 共 ${total} 颗`, padL, padT + H + 38);
  x.font = "13px -apple-system, sans-serif"; x.fillStyle = "rgba(58,42,58,.75)";
  if (e) x.fillText(`成品约：2.6mm 迷你豆 ${(e.w * .26).toFixed(1)}×${(e.h * .26).toFixed(1)} cm · 5mm 大豆 ${(e.w * .5).toFixed(1)}×${(e.h * .5).toFixed(1)} cm（熨完会略小一点）`, padL, padT + H + 60);
  x.font = "14px -apple-system, sans-serif";
  const colW = W / 3;
  keys.forEach((k, idx) => {
    const cx = padL + (idx % 3) * colW, cy = padT + H + 90 + Math.floor(idx / 3) * 30;
    x.fillStyle = colors[k].hex; x.beginPath(); x.arc(cx + 9, cy, 9, 0, 7); x.fill(); x.strokeStyle = "rgba(0,0,0,.2)"; x.stroke();
    x.fillStyle = "#3a2a3a"; x.fillText(`${colors[k].name} × ${n[k]}`, cx + 26, cy);
  });
  const blob = await new Promise((r) => c.toBlob(r, "image/png"));
  const name = `${($("name").value.trim() || "拼豆图纸").replace(/[\\/:*?"<>|]/g, "")}.png`;
  const file = new File([blob], name, { type: "image/png" });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; }
  } catch (e) { if (e.name === "AbortError") return; }
  const url = URL.createObjectURL(blob), a = document.createElement("a"); a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000); toast("图纸存好了");
};

(async () => {
  try {
    const d = await api("/api/beads");
    colors = d.colors; B = d; baseCells = d.cells.slice(); $("name").value = d.name || ""; sizeCell();
    cur = Math.max(0, colors.findIndex((c) => c.name === "粉"));
    palette(); who(); draw(); fit();
    setInterval(poll, 3000);
    addEventListener("resize", fit);
  } catch (e) { toast("板子没拿到：" + e.message, 5000); }
})();
