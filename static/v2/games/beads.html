<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>拼豆板</title>
<style>
  :root { --bg: #f4f1ec; --ink: #3a2a3a; --line: rgba(58,42,58,.14); --pink: #f6c6e0; --plum: #5c0a4f; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; overscroll-behavior: none;
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; -webkit-user-select: none; user-select: none; }
  .app { display: flex; flex-direction: column; height: 100%; max-width: 560px; margin: 0 auto; }
  .top { display: flex; align-items: center; gap: 8px; padding: 10px 12px 6px; }
  .top .name { flex: 1; font-size: 15px; font-weight: 600; border: 0; background: transparent; color: var(--ink); font-family: inherit; min-width: 0; }
  .top .who { font-size: 11px; opacity: .55; white-space: nowrap; }
  .stage { position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: none; }
  canvas { position: absolute; left: 0; top: 0; transform-origin: 0 0; image-rendering: auto; }
  .tools { display: flex; gap: 5px; padding: 6px 12px; align-items: center; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .tools button { flex: 0 0 auto; }
  .tools button, .row2 button, select { background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px;
    font: inherit; font-size: 12.5px; color: var(--ink); }
  .tools button.on { background: var(--plum); color: #fff; border-color: var(--plum); }
  .pal { display: flex; gap: 6px; overflow-x: auto; padding: 6px 12px 4px; scrollbar-width: none; }
  .pal::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; border: 2px solid rgba(0,0,0,.12); position: relative; }
  .chip::after { content: ""; position: absolute; inset: 9px; border-radius: 50%; background: var(--bg); opacity: .9; }
  .chip.on { outline: 3px solid var(--plum); outline-offset: 2px; }
  .cname { font-size: 12px; opacity: .6; padding: 0 12px; height: 16px; }
  .row2 { display: flex; gap: 6px; padding: 6px 12px 12px; flex-wrap: wrap; }
  .row2 .ask { background: var(--pink); border-color: transparent; color: #3a1030; font-weight: 600; }
  .count { font-size: 12px; opacity: .7; padding: 0 12px 10px; line-height: 1.7; max-height: 54px; overflow-y: auto; }
  .count b { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin: 0 3px 0 8px; vertical-align: -1px; }
  .toast { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); background: rgba(58,42,58,.85); color: #fff;
    padding: 6px 14px; border-radius: 999px; font-size: 13px; pointer-events: none; opacity: 0; transition: opacity .25s; white-space: nowrap; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="app">
  <div class="top"><input class="name" id="name" placeholder="给这块板起个名字" maxlength="30"><span class="who" id="who"></span></div>
  <div class="stage" id="stage"><canvas id="cv"></canvas><div class="toast" id="toast"></div></div>
  <div class="tools">
    <button id="tPen" class="on">✏️ 画</button><button id="tErase">🧽 擦</button><button id="tPick">💧 吸色</button>
    <button id="undo">↶</button><button id="redo">↷</button><button id="fit">⤢</button><button id="gridBtn">#</button>
  </div>
  <div class="pal" id="pal"></div>
  <div class="cname" id="cname"></div>
  <div class="row2">
    <button class="ask" id="ask">🪼 叫小克来画</button><button id="export">存图纸</button>
    <select id="size"><option value="">换板子大小</option><option>15</option><option>20</option><option>29</option><option>40</option></select>
    <button id="clear">清空</button>
  </div>
  <div class="count" id="count"></div>
</div>
<script>
// 拼豆板：她和小克共用的一块板。单指画、双指拖和放大；存在服务器上，小克在聊天里用 beads_paint 画，这里几秒就看到。
const $ = (id) => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d"), stage = $("stage");
let B = null, colors = [], cur = 11, tool = "pen", grid = true;
let view = { s: 1, x: 0, y: 0 }, CELL = 24;
const undoStack = [], redoStack = [];
let dirty = false, saveTimer = 0, saving = false;

function toast(t, ms = 1800) { const e = $("toast"); e.textContent = t; e.classList.add("show"); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove("show"), ms); }
async function api(path, opts = {}) {
  const r = await fetch(path, { method: opts.method || "GET", headers: opts.body ? { "Content-Type": "application/json" } : {}, body: opts.body ? JSON.stringify(opts.body) : undefined });
  if (!r.ok) { let m = r.status + ""; try { m = (await r.json()).detail || m; } catch {} const e = new Error(m); e.status = r.status; throw e; }
  return r.json();
}

// ── 画 ──
function draw() {
  if (!B) return;
  const dpr = devicePixelRatio || 1, W = B.w * CELL, H = B.h * CELL;
  if (cv.width !== W * dpr) { cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + "px"; cv.style.height = H + "px"; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#fbfaf7"; ctx.fillRect(0, 0, W, H);
  const r = CELL / 2;
  for (let y = 0; y < B.h; y++) for (let x = 0; x < B.w; x++) {
    const c = B.cells[y * B.w + x], cx = x * CELL + r, cy = y * CELL + r;
    if (c < 0) { ctx.fillStyle = "rgba(58,42,58,.10)"; ctx.beginPath(); ctx.arc(cx, cy, 1.6, 0, 7); ctx.fill(); continue; }
    ctx.fillStyle = colors[c].hex; ctx.beginPath(); ctx.arc(cx, cy, r - 1.2, 0, 7); ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,.14)"; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = "#fbfaf7"; ctx.beginPath(); ctx.arc(cx, cy, r * 0.32, 0, 7); ctx.fill();
  }
  if (grid) {
    ctx.strokeStyle = "rgba(58,42,58,.07)"; ctx.lineWidth = 1;
    for (let i = 0; i <= B.w; i++) { ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, H); ctx.stroke(); }
    for (let j = 0; j <= B.h; j++) { ctx.beginPath(); ctx.moveTo(0, j * CELL); ctx.lineTo(W, j * CELL); ctx.stroke(); }
    ctx.strokeStyle = "rgba(92,10,79,.22)";
    for (let i = 5; i < B.w; i += 5) { ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, H); ctx.stroke(); }
    for (let j = 5; j < B.h; j += 5) { ctx.beginPath(); ctx.moveTo(0, j * CELL); ctx.lineTo(W, j * CELL); ctx.stroke(); }
  }
  applyView(); counts();
}
function applyView() { cv.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.s})`; }
function fit() {
  const W = B.w * CELL, H = B.h * CELL, sw = stage.clientWidth, sh = stage.clientHeight;
  view.s = Math.min((sw - 16) / W, (sh - 16) / H);
  view.x = (sw - W * view.s) / 2; view.y = (sh - H * view.s) / 2; applyView();
}
function counts() {
  const n = {}; for (const c of B.cells) if (c >= 0) n[c] = (n[c] || 0) + 1;
  const keys = Object.keys(n).sort((a, b) => n[b] - n[a]);
  const total = keys.reduce((s, k) => s + n[k], 0);
  $("count").innerHTML = total ? `共 ${total} 颗：` + keys.map((k) => `<b style="background:${colors[k].hex}"></b>${colors[k].name} ${n[k]}`).join("") : "板子是空的。";
}
function palette() {
  $("pal").innerHTML = "";
  colors.forEach((c, i) => {
    const d = document.createElement("button"); d.className = "chip" + (i === cur ? " on" : ""); d.style.background = c.hex; d.title = c.name;
    d.onclick = () => { cur = i; if (tool !== "pen") setTool("pen"); palette(); };
    $("pal").append(d);
  });
  $("cname").textContent = "现在的颜色：" + colors[cur].name;
}
function setTool(t) { tool = t; for (const [id, k] of [["tPen", "pen"], ["tErase", "erase"], ["tPick", "pick"]]) $(id).classList.toggle("on", k === t); }

// ── 手势：单指画，双指拖/放大 ──
const ptrs = new Map(); let gest = null, stroke = null;
function cellAt(px, py) {
  const r = stage.getBoundingClientRect();
  const x = Math.floor((px - r.left - view.x) / view.s / CELL), y = Math.floor((py - r.top - view.y) / view.s / CELL);
  return x >= 0 && y >= 0 && x < B.w && y < B.h ? [x, y] : null;
}
function paintAt(px, py) {
  const p = cellAt(px, py); if (!p) return;
  // 手指划得快会跳格：从上一格到这一格连成一条线
  const last = stroke && stroke.last;
  if (stroke) stroke.last = p;
  if (last && tool !== "pick" && (Math.abs(last[0] - p[0]) > 1 || Math.abs(last[1] - p[1]) > 1)) {
    const n = Math.max(Math.abs(p[0] - last[0]), Math.abs(p[1] - last[1]));
    for (let k = 1; k < n; k++) paintCell(Math.round(last[0] + (p[0] - last[0]) * k / n), Math.round(last[1] + (p[1] - last[1]) * k / n));
  }
  paintCell(p[0], p[1]);
}
function paintCell(cx, cy) {
  const p = [cx, cy], i = cy * B.w + cx;
  if (tool === "pick") { if (B.cells[i] >= 0) { cur = B.cells[i]; palette(); setTool("pen"); toast("拿到了：" + colors[cur].name); } return; }
  const v = tool === "erase" ? -1 : cur;
  if (B.cells[i] === v) return;
  if (!stroke.changes.has(i)) stroke.changes.set(i, B.cells[i]);
  B.cells[i] = v; draw();
}
stage.addEventListener("pointerdown", (e) => {
  stage.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1 && B) { stroke = { changes: new Map() }; paintAt(e.clientX, e.clientY); }
  if (ptrs.size === 2) {
    if (stroke) { endStroke(true); }                // 第二根手指落下：刚才那一笔不算，改成拖
    const [a, b] = [...ptrs.values()];
    gest = { d: Math.hypot(a.x - b.x, a.y - b.y), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, ...view };
  }
});
stage.addEventListener("pointermove", (e) => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size >= 2 && gest) {
    const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const r = stage.getBoundingClientRect(), s = Math.min(6, Math.max(0.3, gest.s * d / gest.d));
    const ox = gest.mx - r.left, oy = gest.my - r.top;
    view.s = s; view.x = ox - (ox - gest.x) * s / gest.s + (mx - gest.mx); view.y = oy - (oy - gest.y) * s / gest.s + (my - gest.my);
    applyView();
  } else if (stroke) paintAt(e.clientX, e.clientY);
});
function endStroke(cancel) {
  if (!stroke) return;
  if (cancel) { for (const [i, old] of stroke.changes) B.cells[i] = old; draw(); }
  else if (stroke.changes.size) { undoStack.push(stroke.changes); redoStack.length = 0; changed(); }
  stroke = null;
}
for (const t of ["pointerup", "pointercancel"]) stage.addEventListener(t, (e) => {
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) gest = null;
  if (ptrs.size === 0) endStroke(false);
});
stage.addEventListener("wheel", (e) => {
  e.preventDefault();
  const r = stage.getBoundingClientRect(), ox = e.clientX - r.left, oy = e.clientY - r.top, k = Math.exp(-e.deltaY / 300);
  const s = Math.min(6, Math.max(0.3, view.s * k));
  view.x = ox - (ox - view.x) * s / view.s; view.y = oy - (oy - view.y) * s / view.s; view.s = s; applyView();
}, { passive: false });
document.addEventListener("gesturestart", (e) => e.preventDefault());

// ── 撤销、存 ──
function undo(from, to) {
  const ch = from.pop(); if (!ch) return;
  const back = new Map(); for (const [i, v] of ch) { back.set(i, B.cells[i]); B.cells[i] = v; }
  to.push(back); draw(); changed();
}
$("undo").onclick = () => undo(undoStack, redoStack);
$("redo").onclick = () => undo(redoStack, undoStack);
function changed() { dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(save, 700); }
async function save() {
  if (saving) { saveTimer = setTimeout(save, 400); return; }
  saving = true;
  try {
    const r = await api("/api/beads", { method: "POST", body: { rev: B.rev, w: B.w, h: B.h, cells: B.cells, name: $("name").value.trim() } });
    B.rev = r.rev; B.by = "Ella"; dirty = false; who();
  } catch (e) {
    if (e.status === 409) {           // 小克刚画过：把我这几笔叠到他的上面
      const mine = B.cells.slice(), base = await api("/api/beads");
      const before = baseCells;
      B = { ...base, cells: base.cells.map((v, i) => (mine[i] !== before[i] ? mine[i] : v)) };
      baseCells = base.cells.slice(); dirty = true; draw(); saving = false; return save();
    }
    toast("没存上：" + e.message);
  }
  baseCells = B.cells.slice(); saving = false;
}
let baseCells = [];
function who() { $("who").textContent = B.by ? `最后一笔：${B.by}` : ""; }

// 隔几秒看看小克有没有画
async function poll() {
  if (document.hidden || dirty || saving || ptrs.size) return;
  try {
    const d = await api("/api/beads");
    if (d.rev !== B.rev) {
      const sizeChanged = d.w !== B.w || d.h !== B.h;
      B = d; baseCells = d.cells.slice(); $("name").value = d.name || ""; who(); draw();
      if (sizeChanged) fit();
      if (d.by === "章小克") toast("小克画了几笔 🪼");
    }
  } catch {}
}

// ── 按钮 ──
$("tPen").onclick = () => setTool("pen"); $("tErase").onclick = () => setTool("erase"); $("tPick").onclick = () => setTool("pick");
$("fit").onclick = fit;
$("gridBtn").onclick = () => { grid = !grid; draw(); };
$("name").onchange = changed;
$("clear").onclick = () => {
  if (!confirm("整块板清空？（能用 ↶ 撤回）")) return;
  const ch = new Map(); B.cells.forEach((v, i) => { if (v >= 0) { ch.set(i, v); B.cells[i] = -1; } });
  undoStack.push(ch); redoStack.length = 0; draw(); changed();
};
$("size").onchange = async (e) => {
  const n = +e.target.value; e.target.value = ""; if (!n) return;
  if (!confirm(`换成 ${n}×${n} 的板子？现在这块会清空。（想留着就先存图纸）`)) return;
  B.w = B.h = n; B.cells = Array(n * n).fill(-1); undoStack.length = redoStack.length = 0;
  cv.width = 0; draw(); fit(); changed();
};
$("ask").onclick = async () => {
  const note = prompt("想让小克画什么？（不写就是「轮到你画了」）", "");
  if (note === null) return;
  if (dirty) await save();
  try {
    const r = await api("/api/beads/ask", { method: "POST", body: { note: note.trim() } });
    toast(r.busy ? "叫了，他回完手上那句就来" : "叫了，他马上来 🪼", 2600);
  } catch (e) { toast("没叫到：" + e.message); }
};

// 图纸：带坐标和格线，底下列出每种颜色多少颗，去工作室照着拼
$("export").onclick = async () => {
  const S = 28, pad = 34, W = B.w * S, H = B.h * S;
  const n = {}; for (const c of B.cells) if (c >= 0) n[c] = (n[c] || 0) + 1;
  const keys = Object.keys(n).sort((a, b) => n[b] - n[a]);
  const legendH = 40 + Math.ceil(keys.length / 3) * 30;
  const c = document.createElement("canvas"); c.width = W + pad * 2; c.height = H + pad * 2 + legendH;
  const x = c.getContext("2d");
  x.fillStyle = "#fbfaf7"; x.fillRect(0, 0, c.width, c.height);
  x.fillStyle = "#3a2a3a"; x.font = "13px -apple-system, sans-serif"; x.textAlign = "center"; x.textBaseline = "middle";
  for (let i = 0; i < B.w; i++) if (i % 5 === 0 || i === B.w - 1) x.fillText(i + 1, pad + i * S + S / 2, pad / 2);
  for (let j = 0; j < B.h; j++) if (j % 5 === 0 || j === B.h - 1) x.fillText(j + 1, pad / 2, pad + j * S + S / 2);
  for (let j = 0; j < B.h; j++) for (let i = 0; i < B.w; i++) {
    const v = B.cells[j * B.w + i], cx = pad + i * S + S / 2, cy = pad + j * S + S / 2;
    if (v < 0) continue;
    x.fillStyle = colors[v].hex; x.beginPath(); x.arc(cx, cy, S / 2 - 1.5, 0, 7); x.fill();
    x.strokeStyle = "rgba(0,0,0,.18)"; x.lineWidth = 1; x.stroke();
    x.fillStyle = "#fbfaf7"; x.beginPath(); x.arc(cx, cy, S * 0.15, 0, 7); x.fill();
  }
  x.lineWidth = 1;
  for (let i = 0; i <= B.w; i++) { x.strokeStyle = i % 5 === 0 ? "rgba(92,10,79,.35)" : "rgba(58,42,58,.1)"; x.beginPath(); x.moveTo(pad + i * S, pad); x.lineTo(pad + i * S, pad + H); x.stroke(); }
  for (let j = 0; j <= B.h; j++) { x.strokeStyle = j % 5 === 0 ? "rgba(92,10,79,.35)" : "rgba(58,42,58,.1)"; x.beginPath(); x.moveTo(pad, pad + j * S); x.lineTo(pad + W, pad + j * S); x.stroke(); }
  x.textAlign = "left"; x.font = "bold 15px -apple-system, sans-serif"; x.fillStyle = "#3a2a3a";
  const total = keys.reduce((s, k) => s + n[k], 0);
  x.fillText(`${$("name").value.trim() || "拼豆图纸"} · ${B.w}×${B.h} · 共 ${total} 颗`, pad, pad + H + 22);
  x.font = "14px -apple-system, sans-serif";
  const colW = (W) / 3;
  keys.forEach((k, idx) => {
    const cx = pad + (idx % 3) * colW, cy = pad + H + 52 + Math.floor(idx / 3) * 30;
    x.fillStyle = colors[k].hex; x.beginPath(); x.arc(cx + 9, cy, 9, 0, 7); x.fill(); x.strokeStyle = "rgba(0,0,0,.2)"; x.stroke();
    x.fillStyle = "#3a2a3a"; x.fillText(`${colors[k].name} × ${n[k]}`, cx + 26, cy);
  });
  const blob = await new Promise((r) => c.toBlob(r, "image/png"));
  const name = `${($("name").value.trim() || "拼豆图纸").replace(/[\\/:*?"<>|]/g, "")}.png`;
  const file = new File([blob], name, { type: "image/png" });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; }
  } catch (e) { if (e.name === "AbortError") return; }
  const url = URL.createObjectURL(blob), a = document.createElement("a"); a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000); toast("图纸存好了");
};

(async () => {
  try {
    const d = await api("/api/beads");
    colors = d.colors; B = d; baseCells = d.cells.slice(); $("name").value = d.name || "";
    cur = Math.max(0, colors.findIndex((c) => c.name === "粉"));
    palette(); who(); draw(); fit();
    setInterval(poll, 3000);
    addEventListener("resize", fit);
  } catch (e) { toast("板子没拿到：" + e.message, 5000); }
})();
</script>
</body>
</html>
