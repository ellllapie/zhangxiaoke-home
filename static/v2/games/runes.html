<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>卢恩</title>
<style>
  :root { --ink: #f6eedd; --soft: rgba(246,238,221,.6); --gold: #e8c47e; --serif: "Songti SC", "Noto Serif SC", serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; color: var(--ink); font-family: -apple-system, "PingFang SC", sans-serif; -webkit-tap-highlight-color: transparent; background: #0c1428; }
  #table { position: fixed; inset: 0; z-index: 0; background: #14223f center / cover no-repeat; }
  #table::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(0,0,0,.42) 100%); }
  #props { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .pr { position: absolute; left: 0; top: 0; filter: drop-shadow(5px 9px 7px rgba(0,0,0,.5)); }
  .pr .rot { transform-origin: 50% 50%; }
  .pr img { display: block; width: 100%; pointer-events: none; user-select: none; -webkit-user-drag: none; }
  .pr.book { pointer-events: auto; cursor: pointer; }
  .pr.book:hover { filter: drop-shadow(5px 9px 7px rgba(0,0,0,.5)) drop-shadow(0 0 10px rgba(255,226,170,.45)); }
  body.arranging #props { z-index: 6; pointer-events: auto; touch-action: none; }
  body.arranging .pr { pointer-events: auto; cursor: grab; }
  body.arranging .pr.sel { filter: drop-shadow(5px 9px 7px rgba(0,0,0,.5)) drop-shadow(0 0 2px #fff) drop-shadow(0 0 12px rgba(255,226,170,.8)); }
  body.arranging #field, body.arranging .ic, body.arranging #pouch, body.arranging #menu, body.arranging #rules { opacity: .12; pointer-events: none; }
  #arrangeBar { position: fixed; z-index: 12; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; width: min(96vw, 560px);
                padding: 10px; border-radius: 16px; background: rgba(40,40,52,.55); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,.12); }
  #arrangeBar[hidden], #tray[hidden] { display: none; }
  #arrangeBar .tip { width: 100%; text-align: center; font-size: 11.5px; opacity: .55; }
  #arrangeBar .btn { border: 1px solid rgba(246,238,221,.25); background: none; border-radius: 99px; padding: 5px 12px; font-size: 13px; cursor: pointer; color: var(--ink); }
  #arrangeBar .btn.main { border-color: var(--gold); color: var(--gold); }
  #tray { position: fixed; z-index: 12; left: 50%; bottom: calc(130px + env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(96vw, 560px); max-height: 40vh; overflow-y: auto;
          display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 8px; padding: 10px; border-radius: 16px; background: rgba(40,40,52,.6); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  #tray img { width: 100%; aspect-ratio: 1; object-fit: contain; cursor: pointer; }
  .glow { text-shadow: 0 0 4px rgba(10,8,20,.9), 0 0 12px rgba(255,214,160,.35); }

  /* 珍珠 */
  .pp { position: absolute; left: 0; top: 0; width: var(--s); height: var(--s); margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2); cursor: pointer; z-index: 2;
        transition: transform .55s cubic-bezier(.3,.8,.3,1); }
  .pp .in { position: absolute; inset: 0; transition: transform .25s; }
  .pp img { position: absolute; left: 50%; top: 50%; user-select: none; -webkit-user-drag: none; pointer-events: none; }
  .pp .pl { width: 96%; height: 96%; object-fit: contain; filter: drop-shadow(2px 4px 3px rgba(0,0,0,.5)); }
  .pp.down .pl { filter: drop-shadow(2px 4px 3px rgba(0,0,0,.5)) brightness(.86) saturate(.75); }
  .pp .gl { height: 40%; }
  .pp.on .in::before { content: ""; position: absolute; inset: -38%; border-radius: 50%; pointer-events: none;
        background: radial-gradient(circle, rgba(255,240,215,.55) 0%, rgba(255,226,180,.28) 35%, rgba(255,214,160,0) 68%); animation: breathe 2.2s ease-in-out infinite; }
  .pp.on .pl { filter: drop-shadow(0 0 3px rgba(255,246,228,.95)) drop-shadow(0 0 10px rgba(255,226,180,.7)) brightness(1.08); }
  @keyframes breathe { 50% { opacity: .55; } }
  .pp.drawn { z-index: 3; }
  .pp.flip .in { transform: scaleX(0); }
  .pp .pos { position: absolute; left: 50%; top: 100%; transform: translateX(-50%); margin-top: 3px; white-space: nowrap; font-size: 10.5px; font-family: var(--serif); letter-spacing: .1em; opacity: .7; }

  /* 牌袋、按钮 */
  #pouch { position: absolute; z-index: 4; width: 92px; cursor: grab; touch-action: none; transform-origin: 50% 50%; filter: drop-shadow(4px 8px 6px rgba(0,0,0,.5)); transition: transform .2s; }
  #pouch img { width: 100%; display: block; pointer-events: none; }
  #pouch.ask img { animation: nudge 1.4s ease-in-out infinite; }
  @keyframes nudge { 50% { transform: rotate(-4deg) scale(1.04); filter: drop-shadow(0 0 10px rgba(255,226,170,.6)); } }
  .ic { position: absolute; z-index: 5; width: 46px; height: 46px; border-radius: 50%; border: 0; background: none; cursor: pointer; padding: 0; display: none; }
  .ic.show { display: block; }
  .ic svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 0 4px rgba(10,8,20,.9)) drop-shadow(0 0 8px rgba(255,214,160,.5)); }
  #go { right: 22px; bottom: calc(26px + env(safe-area-inset-bottom)); width: 58px; height: 58px; }
  #menuBtn { display: block; left: 14px; top: calc(12px + env(safe-area-inset-top)); width: 34px; height: 34px; }

  /* 问题 */
  #qline { position: absolute; z-index: 4; left: 50%; transform: translateX(-50%); max-width: 86vw; text-align: center; font-family: var(--serif); font-size: 15px; letter-spacing: .08em;
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
  #qin { position: absolute; z-index: 9; left: 50%; top: 40%; transform: translateX(-50%); width: min(80vw, 420px); display: none; }
  #qin.show { display: block; }
  #qin input { width: 100%; background: transparent; border: 0; border-bottom: 1px solid rgba(246,238,221,.5); color: var(--ink); font: 17px var(--serif); letter-spacing: .06em; text-align: center; padding: 8px 4px; outline: none; }
  #qin input::placeholder { color: var(--soft); }

  /* 菜单 */
  #menu { position: absolute; z-index: 8; left: 18px; top: calc(54px + env(safe-area-inset-top)); font-family: var(--serif); letter-spacing: .14em; display: none; }
  #menu.show { display: block; }
  #menu a { display: block; padding: 5px 0; font-size: 14px; opacity: .55; cursor: pointer; user-select: none; }
  #menu a.on { opacity: 1; text-shadow: 0 0 4px rgba(10,8,20,.9), 0 0 10px rgba(255,236,200,.8), 0 0 22px rgba(255,214,160,.45); }
  #menu .h { font-size: 12px; opacity: .4; margin: 10px 0 2px; }

  /* 卡 */
  #card { position: fixed; z-index: 10; left: 50%; bottom: 0; transform: translate(-50%, 105%); width: min(560px, 100vw); max-height: 72vh; overflow-y: auto;
          background: rgba(40,40,52,.55); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-radius: 20px 20px 0 0; border: 1px solid rgba(255,255,255,.12); border-bottom: 0;
          padding: 22px 22px calc(26px + env(safe-area-inset-bottom)); transition: transform .35s cubic-bezier(.3,.8,.3,1); }
  #card.show { transform: translate(-50%, 0); }
  #card .hd { display: flex; gap: 14px; align-items: center; }
  #card .big { width: 78px; height: 78px; position: relative; flex: none; }
  #card .big img { position: absolute; left: 50%; top: 50%; }
  #card .big .pl { width: 96%; height: 96%; object-fit: contain; }
  #card .big .gl { height: 40%; }
  #card .nm { font: 600 21px var(--serif); letter-spacing: .14em; }
  #card .sub { font-size: 12px; opacity: .6; letter-spacing: .08em; margin-top: 3px; }
  #card .kw { margin-top: 6px; font-size: 12px; color: var(--gold); letter-spacing: .12em; }
  #card h4 { font: 13px var(--serif); letter-spacing: .25em; opacity: .55; margin: 18px 0 6px; font-weight: normal; }
  #card p { margin: 0; font-size: 14.5px; line-height: 1.75; }
  #card p.off { opacity: .4; font-size: 13px; margin-top: 6px; }
  #card .quote { margin-top: 8px; font-size: 13px; color: var(--gold); border-left: 2px solid rgba(232,196,126,.5); padding-left: 10px; }
  #card .today { color: var(--gold); }
  #card .fn { font-size: 11.5px; opacity: .45; margin-top: 6px; }
  #send { position: absolute; right: 14px; top: 14px; width: 36px; height: 36px; border: 0; background: none; cursor: pointer; padding: 0; }
  #ret { position: absolute; right: 58px; top: 10px; width: 40px; height: 42px; border: 0; background: none; cursor: pointer; padding: 0; }
  #ret img { position: absolute; left: 3px; bottom: 0; width: 34px; filter: drop-shadow(0 0 3px rgba(10,8,20,.9)) drop-shadow(0 0 7px rgba(255,214,160,.5)); pointer-events: none; }
  #ret span { position: absolute; left: 16px; top: -3px; width: 9px; height: 9px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #efe6d6 55%, #cbbfae); box-shadow: 0 0 6px rgba(255,236,200,.8); animation: drop 1.8s ease-in infinite; pointer-events: none; }
  @keyframes drop { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: 1; } 75% { transform: translateY(16px); opacity: 1; } 100% { transform: translateY(18px); opacity: 0; } }
  #send svg { width: 100%; height: 100%; filter: drop-shadow(0 0 6px rgba(255,214,160,.5)); }
  #rules i { position: absolute; z-index: 1; left: 50%; width: min(56vw, 300px); height: 1px; transform: translateX(-50%); pointer-events: none;
             background: linear-gradient(90deg, transparent, rgba(246,238,221,.42) 30%, rgba(246,238,221,.42) 70%, transparent); }
  #rules i::after { content: ""; position: absolute; left: 50%; top: -2px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: rgba(246,238,221,.7); box-shadow: 0 0 6px rgba(255,226,180,.7); }
  #save { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; background: rgba(5,8,18,.45); }
  #save.show { display: flex; }
  #save .box { width: min(82vw, 340px); max-height: 70vh; overflow-y: auto; padding: 20px 22px; border-radius: 18px; background: rgba(40,40,52,.6); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,.12); font-family: var(--serif); }
  #save .t { text-align: center; letter-spacing: .2em; margin-bottom: 14px; }
  #save .rd { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid rgba(246,238,221,.12); }
  #save .rd span { font-size: 12px; opacity: .5; width: 1.4em; }
  #save .rd b { font-weight: normal; font-size: 19px; }
  #save .rd b.rv { display: inline-block; transform: rotate(180deg); opacity: .75; }
  #save .bt { display: flex; justify-content: space-around; margin-top: 16px; letter-spacing: .3em; }
  #save .bt a { cursor: pointer; padding: 4px 14px; opacity: .6; } #save .bt a#saveY { opacity: 1; color: var(--gold); }
  #veil { position: fixed; inset: 0; z-index: 9; display: none; }
  #veil.show { display: block; }

  .toast { position: fixed; z-index: 20; left: 50%; top: 45%; transform: translateX(-50%); background: rgba(8,8,16,.8); padding: 8px 16px; border-radius: 99px; font-size: 13px; opacity: 0; transition: opacity .3s; pointer-events: none; }
  .toast.on { opacity: 1; }
</style>
</head>
<body>
<div id="table"></div>
<div id="props"></div>
<div id="field"></div>
<div id="qline" class="glow"></div>
<div id="pouch"><img src="table/pouch-black.webp" alt=""></div>

<!-- 翻开：一颗四芒星套一圈 -->
<button class="ic" id="go" aria-label="翻开"><svg viewBox="0 0 58 58"><circle cx="29" cy="29" r="26" fill="none" stroke="#fff6e6" stroke-width="1.4" opacity=".8"/><path d="M29 12 L32.5 25.5 L46 29 L32.5 32.5 L29 46 L25.5 32.5 L12 29 L25.5 25.5 Z" fill="#fff6e6"/></svg></button>
<!-- 放回去：一道往回绕的弧 -->

<!-- 菜单：三颗小珍珠 -->
<button class="ic" id="menuBtn" aria-label="菜单"><svg viewBox="0 0 34 34"><circle cx="7" cy="17" r="2.6" fill="#fff6e6"/><circle cx="17" cy="17" r="2.6" fill="#fff6e6"/><circle cx="27" cy="17" r="2.6" fill="#fff6e6"/></svg></button>
<div id="menu" class="glow"></div>
<div id="qin"><input id="q" placeholder="想问什么" enterkeyhint="done"></div>

<div id="arrangeBar" hidden>
  <div class="tip">拖着走 · 两根手指转和放大（电脑上滚轮放大，按住 Shift 滚轮转）· 本子收不走</div>
  <button class="btn" data-a="rl">⟲</button><button class="btn" data-a="rr">⟳</button>
  <button class="btn" data-a="up">大</button><button class="btn" data-a="dn">小</button>
  <button class="btn" data-a="top">放上面</button><button class="btn" data-a="del">收起来</button>
  <button class="btn" data-a="add">＋ 加一件</button><button class="btn" data-a="reset">恢复默认</button>
  <button class="btn main" data-a="done">摆好了</button>
</div>
<div id="tray" hidden></div>

<div id="rules"></div>
<div id="save"><div class="box glow"><div class="t">✦ 存进影子书？</div><div id="saveIn"></div><div class="bt"><a id="saveN">不存</a><a id="saveY">存</a></div></div></div>
<div id="veil"></div>
<div id="card"><button id="ret" aria-label="放回袋子"><img src="table/pouch-black.webp" alt=""><span></span></button><button id="send" aria-label="发给小克"><svg viewBox="0 0 36 36"><path d="M7 18 L29 8 L23 29 L17 21 Z M17 21 L29 8" fill="none" stroke="#fff6e6" stroke-width="1.5" stroke-linejoin="round"/></svg></button><div id="cardIn"></div></div>
<div class="toast" id="toast"></div>

<script src="runes-base.js"></script>
<script src="runes-more.js"></script>
<script>
const $ = (id) => document.getElementById(id);
async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  if (!r.ok) throw new Error((await r.text()).slice(0, 80) || r.status); return r.json();
}

const G = "table/";
const BASE = Object.fromEntries(RUNES_BASE.map((r, i) => [r.latin, { ...r, i, aett: Math.floor(i / 8) }]));
BASE.WYRD = { ...RUNE_BLANK, i: 24, aett: -1 };
const MORE = { ...RUNES_MORE, WYRD: RUNE_BLANK_MORE };
const ORDER = RUNES_BASE.map((r) => r.latin);
const AETT = ["弗雷族", "哈格尔族", "提尔族"];
const SPREADS = {
  odin: { name: "奥丁单符", pos: ["奥丁之符"] },
  norn: { name: "诺伦三符", pos: ["已成的", "正在成的", "将要来的"] },
  cross: { name: "五符十字", pos: ["此刻", "来处", "去处", "帮你的", "挡你的"] },
};
// 近代整理的卢恩半月历：从 6/29 起，每颗管半个月
const CAL = { FEHU: "6/29–7/14", URUZ: "7/14–7/29", THURISAZ: "7/29–8/13", ANSUZ: "8/13–8/29", RAIDHO: "8/29–9/13", KENAZ: "9/13–9/28", GEBO: "9/28–10/13", WUNJO: "10/13–10/28",
  HAGALAZ: "10/28–11/13", NAUTHIZ: "11/13–11/28", ISA: "11/28–12/13", JERA: "12/13–12/28", EIHWAZ: "12/28–1/13", PERTHRO: "1/13–1/28", ALGIZ: "1/28–2/12", SOWILO: "2/12–2/27",
  TIWAZ: "2/27–3/14", BERKANO: "3/14–3/30", EHWAZ: "3/30–4/14", MANNAZ: "4/14–4/29", LAGUZ: "4/29–5/14", INGWAZ: "5/14–5/29", OTHALA: "5/29–6/14", DAGAZ: "6/14–6/29" };
function md(s) { const [m, d] = s.split("/").map(Number); return m * 100 + d; }
function inCal(k, now = new Date()) {
  const c = CAL[k]; if (!c) return false; const [a, b] = c.split("–").map(md), t = (now.getMonth() + 1) * 100 + now.getDate();
  return a <= b ? t >= a && t < b : t >= a || t < b;
}
const NP = 25;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
function toast(t) { const e = $("toast"); e.textContent = t; e.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove("on"), 1800); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

let mode = "free", upOnly = false, blank = true, question = "";
let pearls = [];   // {el, k, seed, rot, tilt, rev, x, y, on, drawn, pos}
let drawnCount = 0, round = 0, seq = 0, drawnBottom = 0;   // round：第几轮；每轮翻开的排成一行，轮与轮之间一道细线
const S = () => Math.max(48, Math.min(70, Math.min(innerWidth, innerHeight) * .14));

function pearlHTML(p, open) {
  const g = open && p.k !== "WYRD" ? `<img class="gl" src="${G}g/${p.k}.webp" style="transform:translate(-50%,-50%) rotate(${(p.rev ? 180 : 0) + p.tilt}deg)">` : "";
  return `<div class="in"><img class="pl" src="${G}p/${p.seed}.webp" style="transform:translate(-50%,-50%) rotate(${p.rot}deg)">${g}</div>${p.pos ? `<div class="pos glow">${esc(p.pos)}</div>` : ""}`;
}

// 桌上能放珍珠的区域：避开顶上翻开的那排、底下牌袋和按钮
function area() { const W = innerWidth, H = innerHeight, s = S(); return { x0: s * .9, x1: W - s * .9, y0: Math.min(H - 120 - s * 2.5, Math.max(H * .27, drawnBottom + s * .4)) + s * .5, y1: H - 120 - s * .5 }; }
function spots(n) {
  const a = area(), out = [], s = S();
  for (let i = 0; i < n; i++) {
    let best = null, bd = -1;
    for (let t = 0; t < 40; t++) {
      const x = a.x0 + Math.random() * (a.x1 - a.x0), y = a.y0 + Math.random() * (a.y1 - a.y0);
      const d = Math.min(1e9, ...out.map((o) => Math.hypot(o.x - x, o.y - y)));
      if (d > bd) { bd = d; best = { x, y }; } if (d > s * 1.05) break;
    }
    out.push(best);
  }
  return out;
}
function put(p, x, y, r = 0) { p.x = x; p.y = y; p.el.style.transform = `translate(${x}px,${y}px) rotate(${r}deg)`; }
function pouchXY() { const r = $("pouch").getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; }

function keys() { return shuffle([...ORDER, ...(blank ? ["WYRD"] : [])]); }
function build() {
  $("field").innerHTML = ""; pearls = []; drawnCount = 0; round = 0; drawnBottom = 0; $("rules").innerHTML = "";
  const ks = keys(), seeds = shuffle([...Array(NP).keys()]);
  ks.forEach((k, i) => {
    const el = document.createElement("div"); el.className = "pp down";
    const p = { el, k, seed: seeds[i % NP], rot: Math.floor(Math.random() * 360), tilt: Math.floor(Math.random() * 21) - 10, rev: false, on: false, drawn: false, pos: "" };
    el.innerHTML = pearlHTML(p, false); el.style.setProperty("--s", S() + "px");
    el.onclick = () => tap(p);
    $("field").appendChild(el); pearls.push(p);
  });
  const o = pouchXY(); pearls.forEach((p) => put(p, o.x, o.y));
  requestAnimationFrame(() => requestAnimationFrame(scatter));
}
function scatter() {
  const free = pearls.filter((p) => !p.drawn), sp = spots(free.length);
  free.forEach((p, i) => { p.on = false; p.el.classList.remove("on"); setTimeout(() => put(p, sp[i].x, sp[i].y, Math.random() * 360), i * 18); });
  updateBtns();
}
// 洗：没翻开的珍珠先收回袋口，再撒出去，顺手换一下谁是谁
function wash() {
  const free = pearls.filter((p) => !p.drawn), o = pouchXY(), ks = shuffle(free.map((p) => p.k));
  free.forEach((p, i) => { p.k = ks[i]; p.on = false; p.el.classList.remove("on"); put(p, o.x + (Math.random() - .5) * 20, o.y + (Math.random() - .5) * 20); });
  setTimeout(scatter, 480);
}
const inRound = () => pearls.filter((p) => p.drawn && p.round === round);
function limit() { return mode === "free" ? Infinity : SPREADS[mode].pos.length - inRound().length; }
function tap(p) {
  if (p.drawn) return openCard(p);
  if (mode !== "free" && !question) { $("pouch").classList.add("ask"); toast("先点牌袋，写下问题"); return; }
  if (!p.on && pearls.filter((q) => q.on).length >= limit()) { toast(mode === "free" ? "" : `这个阵只要 ${SPREADS[mode].pos.length} 颗`); return; }
  p.on = !p.on; p.el.classList.toggle("on", p.on); updateBtns();
}
// 翻开的按轮排：一轮一行（太多就折行），轮与轮之间画一道细线
function layout() {
  const rounds = [...new Set(pearls.filter((p) => p.drawn).map((p) => p.round))].sort((a, b) => a - b);
  const top0 = (question && mode !== "free" ? 86 : 58), maxH = innerHeight * .42;
  // 轮次多了就把翻开的珍珠缩小、行距收紧，整块不超过屏幕上面四成
  let plan;
  for (let f = .82; f >= .4; f -= .04) {

  const o = cur(); if (!o || !document.body.classList.contains("arranging")) return; e.preventDefault();
  if (e.shiftKey) o.r = (o.r || 0) + (e.deltaY > 0 ? 8 : -8); else o.s = Math.max(3, Math.min(60, o.s * (e.deltaY > 0 ? 1 / 1.06 : 1.06)));
  place(elOf(o), o); clearTimeout(saveLay.t); saveLay.t = setTimeout(saveLay, 400);
}, { passive: false });
addEventListener("resize", () => { if (orient() !== orn) loadLay(); else lay.forEach((o) => { const el = elOf(o); if (el) place(el, o); }); });


// ── 存进影子书 ──
// 牌阵：一个问题一篇，翻一颗存一次（同一个 id 就是改）
// 随手抽：整张桌子一篇，按轮次排；离开时问存不存。没来得及问（直接关了）就先放在本机，下次打开再问
const DRAFT_KEY = "runes-free-draft";
const newId = () => (Date.now().toString(36) + Math.random().toString(36).slice(2, 6)).slice(0, 14);
let spreadId = "";
const stoneOf = (p) => ({ k: p.k, rev: !!p.rev, p: p.seed, ...(p.pos ? { pos: p.pos } : {}) });
function saveSpread() {
  const ps = pearls.filter((p) => p.drawn).sort((a, b) => a.pi - b.pi); if (!ps.length) return;
  if (!spreadId) spreadId = newId();
  api("/api/runes/book", { item: { id: spreadId, at: Date.now(), q: question, spread: mode, up: upOnly, stones: ps.map(stoneOf) } }).catch((e) => toast("没存上：" + e.message));
}
function freeItem() {
  const rs = [...new Set(pearls.filter((p) => p.drawn).map((p) => p.round))].sort((a, b) => a - b);
  const rounds = rs.map((r) => ({ q: "", stones: pearls.filter((p) => p.drawn && p.round === r).sort((a, b) => a.seq - b.seq).map(stoneOf) }));
  return rounds.length ? { id: newId(), at: Date.now(), q: "", spread: "free", up: upOnly, rounds, stones: [] } : null;
}
function stashFree() { const it = freeItem(); if (it) localStorage.setItem(DRAFT_KEY, JSON.stringify(it)); else localStorage.removeItem(DRAFT_KEY); }
function showSave(it, then) {
  const n = ["一", "二", "三", "四", "五", "六", "七", "八", "九", "十"];
  $("saveIn").innerHTML = it.rounds.map((r, i) => `<div class="rd"><span>${n[i] || i + 1}</span>${r.stones.map((x) => `<b class="${x.rev ? "rv" : ""}">${esc(BASE[x.k]?.symbol || "○")}</b>`).join("")}</div>`).join("");
  $("save").classList.add("show");
  $("saveY").onclick = async () => { $("save").classList.remove("show"); localStorage.removeItem(DRAFT_KEY);
    try { await api("/api/runes/book", { item: it }); toast("收进影子书了"); } catch (e) { localStorage.setItem(DRAFT_KEY, JSON.stringify(it)); toast("没存上：" + e.message); } then && then(); };
  $("saveN").onclick = () => { $("save").classList.remove("show"); localStorage.removeItem(DRAFT_KEY); then && then(); };
}
function askSave(then) { const it = freeItem(); if (!it) return then && then(); showSave(it, then); }
addEventListener("pagehide", () => { if (mode === "free") stashFree(); });
document.addEventListener("visibilitychange", () => { if (document.hidden && mode === "free") stashFree(); });
function leftover() { try { const it = JSON.parse(localStorage.getItem(DRAFT_KEY)); if (it?.rounds?.length) showSave(it); } catch {} }
// 卡
let cardP = null;
function openCard(p) {
  cardP = p; const b = BASE[p.k], M = MORE[p.k] || {}, still = M.still, cal = CAL[p.k];
  const mine = p.rev ? b.reversed : b.upright, other = p.rev ? b.upright : b.reversed;
  $("cardIn").innerHTML =
    `<div class="hd"><div class="big">${pearlHTML({ ...p, pos: "" }, true).replace('<div class="in">', '<div class="in" style="position:absolute;inset:0">')}</div><div>` +
    `<div class="nm glow">${esc(b.cn)}${still ? "" : p.rev ? " · 逆" : " · 正"}</div>` +
    `<div class="sub">${esc(b.symbol || "（空白）")}　${esc(b.latin)}${b.aett >= 0 ? "　" + AETT[b.aett] + " 第 " + (b.i % 8 + 1) + " 颗" : ""}</div>` +
    `<div class="kw">${(b.keywords || []).map(esc).join(" · ")}</div></div></div>` +
    (p.pos ? `<h4>位置</h4><p>${esc(p.pos)}</p>` : "") +
    `<h4>${still ? "意思" : p.rev ? "逆位" : "正位"}</h4><p>${esc(mine)}</p>` +
    (!still && other ? `<p class="off">${p.rev ? "正位" : "逆位"}：${esc(other)}</p>` : "") +
    (b.myth ? `<h4>来历</h4><p>${esc(b.myth)}</p>` : "") + (b.mythQuote ? `<div class="quote">${esc(b.mythQuote)}</div>` : "") +
    (cal ? `<h4>它的日子</h4><p>${cal}<span class="fn">（近代整理）</span>${inCal(p.k) ? `　<span class="today">今天就在它的日子里</span>` : ""}</p>` : "");
  $("card").classList.add("show"); $("veil").classList.add("show"); $("card").scrollTop = 0;
}
function closeCard() { $("card").classList.remove("show"); $("veil").classList.remove("show"); }
$("veil").onclick = closeCard;
$("ret").onclick = () => cardP && putOne(cardP);
$("send").onclick = async () => {
  const ps = pearls.filter((p) => p.drawn), name = (p) => BASE[p.k].cn + (MORE[p.k]?.still ? "" : p.rev ? "（逆）" : "（正）");
  let note;
  if (mode === "free") {
    const r = cardP.round, rs = [...new Set(ps.map((p) => p.round))].sort((a, b) => a - b);
    note = `随手抽，第 ${rs.indexOf(r) + 1} 轮（问题她心里有，没写）：` + ps.filter((p) => p.round === r).sort((a, b) => a.seq - b.seq).map(name).join("、") + `\n她点开的是：${name(cardP)}`;
  } else note = `问题：${question || "（没写）"}\n阵：${SPREADS[mode].name}${upOnly ? "（只读正位）" : ""}\n` + ps.sort((a, b) => a.pi - b.pi).map((p) => `${p.pos}：${name(p)}`).join("\n");
  try { const r = await api("/api/runes/ask", { note }); toast(r.busy ? "叫过了，我说完手上这句就来" : "叫过了，回聊天看我"); } catch (e) { toast("没叫到：" + e.message); }
};

$("go").onclick = flip;
addEventListener("resize", () => { placePouch(); pearls.forEach((p) => p.el.style.setProperty("--s", (p.drawn ? S() * .82 : S()) + "px")); layout(); scatter(); });
setCloth(cloth(), true); loadLay(); pullRemote();
placePouch(); build(); leftover();
</script>
</body>
</html>
