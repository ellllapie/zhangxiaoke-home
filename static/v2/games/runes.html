<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>卢恩</title>
<style>
  :root { --bg: #f4f1ec; --ink: #3a2a3a; --soft: rgba(58,42,58,.6); --line: rgba(58,42,58,.14); --plum: #5c0a4f; --pink: #f6c6e0; --card: #fffdf9;
    --stone1: #e9e4dc; --stone2: #cfc7bb; --cut: #4a3a46; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; -webkit-tap-highlight-color: transparent; }
  body { padding: 0 0 calc(40px + env(safe-area-inset-bottom)); }
  button { font: inherit; color: inherit; }
  .tabs { position: sticky; top: 0; z-index: 5; display: flex; gap: 6px; padding: 12px 14px 10px; background: var(--bg); border-bottom: 1px solid var(--line); }
  .tabs h1 { font-size: 16px; font-weight: 600; letter-spacing: .12em; margin: 0 auto 0 2px; align-self: center; }
  .tab, .pill, .btn { background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .tab.on, .pill.on { background: var(--plum); color: #fff; border-color: var(--plum); }
  .btn.main { background: var(--plum); color: #fff; border-color: var(--plum); padding: 9px 18px; }
  .btn.pink { background: var(--pink); border-color: transparent; color: #3a1030; font-weight: 600; }
  .btn:disabled { opacity: .4; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 14px; }
  .lab { font-size: 12px; color: var(--soft); letter-spacing: .1em; margin: 14px 2px 8px; }
  textarea { width: 100%; border: 1px solid var(--line); border-radius: 14px; background: #fff; padding: 10px 12px; font: inherit; font-size: 15px; color: var(--ink); resize: none; height: 64px; outline: none; }
  textarea:focus { border-color: var(--plum); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .note { font-size: 12px; color: var(--soft); line-height: 1.7; margin: 6px 2px 0; }
  .sw { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--soft); cursor: pointer; user-select: none; }
  .sw input { accent-color: var(--plum); width: 16px; height: 16px; }

  /* 石头 */
  .stone { display: block; overflow: visible; }
  .stone .peb { fill: url(#peb); stroke: rgba(58,42,58,.18); stroke-width: 1; }
  .stone .back { fill: url(#pebBack); stroke: rgba(58,42,58,.18); stroke-width: 1; }
  .stone .cut { fill: none; stroke: var(--cut); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
  .stone .hl { fill: none; stroke: rgba(255,255,255,.55); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; transform: translate(.8px, 1.1px); }
  .field { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; padding: 14px; background: #fff; border: 1px solid var(--line); border-radius: 18px; margin-top: 10px; }
  .field .s { aspect-ratio: 1 / 1.1; cursor: pointer; transition: transform .25s, opacity .3s; }
  .field .s:active { transform: scale(.94); }
  .field .s.picked { opacity: .25; pointer-events: none; }
  .field .s.flip { animation: flip .5s ease; }
  @keyframes flip { 0% { transform: rotateY(0) } 50% { transform: rotateY(90deg) } 100% { transform: rotateY(0) } }
  .hint { text-align: center; font-size: 13px; color: var(--soft); margin: 12px 0 0; min-height: 1.4em; }

  /* 撒石 */
  .cloth { position: relative; width: 100%; aspect-ratio: 1; margin-top: 10px; border-radius: 50%; background: radial-gradient(circle, #fff 0 33%, #fbf6ef 33% 66%, #f6efe5 66% 100%); border: 1px solid var(--line); }
  .cloth::before, .cloth::after { content: ""; position: absolute; border: 1px dashed rgba(58,42,58,.15); border-radius: 50%; }
  .cloth::before { inset: 17%; } .cloth::after { inset: 33.5%; }
  .cloth .s { position: absolute; width: 15%; transform: translate(-50%, -50%); transition: left .7s cubic-bezier(.2,.9,.3,1.2), top .7s cubic-bezier(.2,.9,.3,1.2); cursor: pointer; }
  .cloth .zl { position: absolute; left: 50%; transform: translateX(-50%); font-size: 10px; color: var(--soft); letter-spacing: .1em; }

  /* 阵 */
  .spread { display: grid; gap: 10px; margin-top: 16px; justify-content: center; }
  .spread.n1 { grid-template-columns: 110px; }
  .spread.n3 { grid-template-columns: repeat(3, 1fr); }
  .spread.n5 { grid-template-columns: repeat(3, 1fr); grid-template-areas: ". up ." "left mid right" ". down ."; }
  .slot { text-align: center; }
  .slot .pz { font-size: 11px; color: var(--soft); letter-spacing: .08em; margin-bottom: 6px; min-height: 1.3em; }
  .slot .sv { width: 72px; margin: 0 auto; cursor: pointer; }
  .spread.n1 .slot .sv { width: 100px; }
  .slot .nm { font-size: 13px; font-weight: 600; margin-top: 4px; }
  .slot .rv { font-size: 11px; color: var(--soft); }
  .slot.empty .sv { opacity: .25; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; margin-top: 12px; }
  .card h3 { margin: 0 0 8px; font-size: 13px; letter-spacing: .12em; color: var(--soft); font-weight: 500; }
  .card p { margin: 0; font-size: 15px; line-height: 1.85; }
  .one { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); cursor: pointer; }
  .one:first-of-type { border-top: 0; padding-top: 2px; }
  .one .sv { width: 40px; flex: none; }
  .one .t { font-size: 12px; color: var(--soft); margin-bottom: 2px; }
  .one .t b { color: var(--ink); font-size: 14px; margin-right: 6px; }
  .one p { font-size: 14.5px; line-height: 1.75; }
  .syn p + p { margin-top: 8px; }
  .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }

  /* 底部抽屉：一颗符文的全部 */
  .sheet { position: fixed; inset: 0; z-index: 20; background: rgba(40,25,40,.35); display: none; align-items: flex-end; justify-content: center; }
  .sheet.on { display: flex; }
  .sheet .in { background: var(--bg); width: 100%; max-width: 560px; max-height: 86vh; overflow-y: auto; border-radius: 22px 22px 0 0; padding: 18px 18px calc(28px + env(safe-area-inset-bottom)); }
  .sheet .hd { display: flex; gap: 14px; align-items: center; }
  .sheet .hd .sv { width: 64px; }
  .sheet .hd .big { font-size: 18px; font-weight: 600; letter-spacing: .08em; }
  .sheet .hd .sm { font-size: 12px; color: var(--soft); margin-top: 2px; }
  .kw { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 4px; }
  .kw span { font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; background: #fff; }
  .sheet h4 { font-size: 12px; color: var(--soft); letter-spacing: .12em; font-weight: 500; margin: 16px 0 6px; }
  .sheet p { margin: 0; font-size: 14.5px; line-height: 1.85; }
  .sheet .q { font-size: 13px; color: var(--plum); border-left: 2px solid var(--pink); padding-left: 10px; margin-top: 8px; }
  .sheet .x { float: right; background: none; border: 0; font-size: 22px; line-height: 1; opacity: .5; cursor: pointer; }

  /* 占卜本 */
  .entry { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; margin-bottom: 10px; }
  .entry .top { display: flex; justify-content: space-between; font-size: 12px; color: var(--soft); }
  .entry .qq { font-size: 15px; margin: 6px 0 8px; line-height: 1.6; }
  .entry .gl { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .entry .gl .sv { width: 30px; }
  .entry .gl .n { font-size: 12px; color: var(--soft); margin-right: 6px; }
  .entry .vd { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
  .entry .vd .pill { padding: 4px 10px; font-size: 12px; }
  .entry .vd .pill.del { color: var(--soft); }
  .entry input { flex: 1; min-width: 120px; border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; font: inherit; font-size: 13px; background: #fff; color: var(--ink); outline: none; }
  .stat { font-size: 13px; color: var(--soft); margin: 4px 2px 12px; line-height: 1.7; }

  /* 认符 */
  .aett { margin-top: 6px; }
  .aett .an { font-size: 13px; font-weight: 600; margin: 14px 2px 2px; }
  .aett .ab { font-size: 12px; color: var(--soft); margin: 0 2px 8px; }
  .grid8 { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
  .grid8 .c { text-align: center; cursor: pointer; }
  .grid8 .c .sv { width: 100%; }
  .grid8 .c .n { font-size: 10px; color: var(--soft); margin-top: 2px; }
  .grid8 .c.weak .n { color: var(--plum); font-weight: 600; }
  .quiz { text-align: center; }
  .quiz .sv { width: 120px; margin: 16px auto 8px; }
  .quiz .ans { min-height: 64px; font-size: 15px; line-height: 1.7; }

  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: rgba(58,42,58,.92); color: #fff;
    padding: 8px 16px; border-radius: 999px; font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 30; white-space: nowrap; }
  .toast.on { opacity: 1; }
  .imgv { position: fixed; inset: 0; z-index: 25; background: rgba(40,25,40,.6); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 20px; }
  .imgv.on { display: flex; }
  .imgv img { max-width: 100%; max-height: 76vh; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
  .imgv .note { color: #fff; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <radialGradient id="peb" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#f6f2ec"/><stop offset=".65" stop-color="#e3ddd3"/><stop offset="1" stop-color="#cbc2b5"/></radialGradient>
    <radialGradient id="pebBack" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#e6dfd6"/><stop offset=".7" stop-color="#cfc6b9"/><stop offset="1" stop-color="#b6ab9c"/></radialGradient>
  </defs>
</svg>

<div class="tabs">
  <h1>卢恩</h1>
  <button class="tab on" data-v="cast">占卜</button>
  <button class="tab" data-v="book">占卜本</button>
  <button class="tab" data-v="learn">认符</button>
</div>

<div class="wrap" id="vCast">
  <div class="lab">想问什么</div>
  <textarea id="q" placeholder="写下来，或者空着，让石头自己说"></textarea>
  <div class="lab">阵</div>
  <div class="row" id="spreads"></div>
  <div class="note" id="spreadNote"></div>
  <div class="row" style="margin-top:10px">
    <label class="sw"><input type="checkbox" id="optUp"> 只读正位</label>
    <label class="sw"><input type="checkbox" id="optBlank"> 放进空白符</label>
  </div>
  <div id="board"></div>
  <div class="hint" id="hint"></div>
  <div id="result"></div>
</div>

<div class="wrap" id="vBook" hidden>
  <div class="stat" id="bookStat"></div>
  <div id="bookList"></div>
</div>

<div class="wrap" id="vLearn" hidden>
  <div class="row"><button class="btn main" id="quizBtn">抽查</button><span class="note" style="margin:0">点一颗看它的全部；抽查里答错的，名字会变成紫色</span></div>
  <div class="card quiz" id="quiz" hidden></div>
  <div id="aettList"></div>
</div>

<div class="sheet" id="sheet"><div class="in" id="sheetIn"></div></div>
<div class="imgv" id="imgv"><img id="imgvImg" alt=""><div class="note">手机上长按图片保存</div><div class="row"><a class="btn" id="imgvDl" download="卢恩.png">下载</a><button class="btn" id="imgvX">关掉</button></div></div>
<div class="toast" id="toast"></div>

<script src="runes-base.js"></script>
<script src="runes-more.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const BASE = Object.fromEntries(RUNES_BASE.map((r, i) => [r.latin, { ...r, i, aett: Math.floor(i / 8) }]));
BASE.WYRD = { ...RUNE_BLANK, i: 24, aett: -1 };
const MORE = { ...RUNES_MORE, WYRD: RUNE_BLANK_MORE };
const ORDER = RUNES_BASE.map((r) => r.latin);

const SPREADS = {
  odin: { name: "奥丁单符", n: 1, pos: ["奥丁之符"], about: "一件事，一颗。问题越具体越好。" },
  norn: { name: "诺伦三符", n: 3, pos: ["乌尔德 · 已成的", "薇尔丹蒂 · 正在成的", "斯库尔德 · 将要来的"],
    about: "三位命运女神：乌尔德管已经织好的，薇尔丹蒂管正在织的，斯库尔德管还欠着、要来的。" },
  cross: { name: "五符十字", n: 5, pos: ["中心 · 此刻", "左 · 来处", "右 · 去处", "上 · 帮你的", "下 · 挡你的"],
    about: "依次抽五颗：中心、左、右、上、下。适合想看清一件事的来龙去脉。" },
  cast: { name: "九符撒石", n: 9, pos: [], about: "一把九颗撒在布上：落在中心的是核心，中圈是牵动它的，边缘是远一点、慢一点的。背面朝上的不读。" },
};
const CROSS_AREA = ["mid", "left", "right", "up", "down"];

let spread = "norn", deck = [], picks = [], reading = null, busy = false;

// ── 小工具 ──
function toast(t) { const e = $("toast"); e.textContent = t; e.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove("on"), 2200); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }
async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.status);
  return r.json();
}
function seedOf(s) { let h = 7; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; }

// 一颗石头：形状每颗略不一样（按名字定，同一颗永远一样）
function pebPath(seed) {
  const pts = [], n = 10;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2, j = ((seed >> (i % 16)) & 7) / 7 - .5;
    const rx = 44 + j * 3, ry = 49 + j * 3;
    pts.push([50 + Math.cos(a) * rx, 55 + Math.sin(a) * ry]);
  }
  let d = "";
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    if (!i) d += `M${p1[0].toFixed(1)},${p1[1].toFixed(1)}`;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += `C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d + "Z";
}
function glyphD(k) {
  return (MORE[k]?.s || []).map((line) => line.map(([x, y], i) => `${i ? "L" : "M"}${(30 + x * 40).toFixed(1)},${(30 + y * 50).toFixed(1)}`).join("")).join("");
}
function stoneSVG(k, rev = false, down = false, seed) {
  const sd = seed ?? seedOf(k || "x");
  const g = k && !down ? glyphD(k) : "";
  const rot = rev ? ' transform="rotate(180 50 55)"' : "";
  return `<svg class="stone sv" viewBox="-2 2 104 108"><path class="${down || !k ? "back" : "peb"}" d="${pebPath(sd)}"/>` +
    (g ? `<g${rot}><path class="hl" d="${g}"/><path class="cut" d="${g}"/></g>` : "") + "</svg>";
}

// ── 解读 ──
const LABEL = { center: "中心 · 核心", middle: "中圈 · 牵动它的", edge: "边缘 · 远一点的" };
function lines(st) { const M = MORE[st.k]; return st.rev && M.r ? M.r : M.u; }
function toneOf(st) { const t = MORE[st.k].tone; return st.rev ? -Math.max(.5, Math.abs(t)) : t; }
function nameOf(st) { const b = BASE[st.k]; return b.cn + (MORE[st.k].still ? "" : st.rev ? "（逆）" : "（正）"); }
function posLabel(st, i) { return reading.spread === "cast" ? (st.down ? "背面朝上" : LABEL[st.zone]) : SPREADS[reading.spread].pos[i]; }
function posText(st, i) {
  const M = MORE[st.k], L = lines(st), sp = reading.spread;
  if (sp === "odin") {
    const b = BASE[st.k], g = st.rev && b.guidance.r?.length ? b.guidance.r : b.guidance.u;
    return (st.rev ? b.reversed : b.upright).replace(/（此符无逆位）/g, "") + "\n" + g[st.g % g.length].replace(/（此符无逆位）/g, "");
  }
  if (sp === "norn") return L[i];
  if (sp === "cross") {
    if (i === 3) return "帮你的是：" + M.help + (st.rev ? "不过它逆着，这份力现在有点使不上。" : "");
    if (i === 4) return "挡着你的是：" + M.block + (st.rev ? "它逆着，这道坎比看起来更硬一点。" : "");
    return L[[1, 0, 2][i]];
  }
  if (st.down) return "这一颗还没翻面，现在不到看它的时候。";
  if (st.zone === "center") return L[1];
  if (st.zone === "middle") return toneOf(st) > 0 ? "在帮你：" + M.help : "在牵绊你：" + M.block;
  return L[2];
}
function synthesis() {
  const sp = reading.spread, all = reading.stones, vis = all.filter((s) => !s.down), out = [];
  if (sp === "odin") {
    const s = vis[0], b = BASE[s.k];
    out.push(`这一颗是${nameOf(s)}，${b.keywords.join("、")}。`);
    out.push(toneOf(s) > 0 ? "它是顺的，问题的答案偏向「可以」。" : toneOf(s) < 0 ? "它带着阻力，问题的答案偏向「先等等」。" : "它不偏好也不偏坏，答案要你自己去碰。");
    if (s.k === "WYRD") out.push("抽到空白：这件事现在问不出答案，先放一放。");
    return out;
  }
  // 三族
  const real = vis.filter((s) => s.k !== "WYRD"), cnt = [0, 0, 0];
  real.forEach((s) => cnt[BASE[s.k].aett]++);
  if (real.length >= 3) {
    const m = cnt.indexOf(Math.max(...cnt));
    if (cnt[m] * 2 >= real.length) out.push(`${AETT[m].name}占了 ${cnt[m]} 颗：这件事多半关于${AETT[m].about}。`);
    else if (cnt.every((c) => c > 0)) out.push("三族都有，这件事牵得比较广，不只一个方面。");
  }
  // 正逆
  const rev = real.filter((s) => s.rev).length;
  if (real.length >= 2) {
    if (!rev) out.push("没有一颗逆着，路是通的。");
    else if (rev * 2 >= real.length) out.push(`逆着的有 ${rev} 颗，过了一半：这件事里堵的地方多，先疏通，再往前。`);
  }
  // 走向
  if (sp === "norn" || sp === "cross") {
    const seq = sp === "norn" ? [all[0], all[1], all[2]] : [all[1], all[0], all[2]];
    const [a, b, c] = seq.map(toneOf), [A, , C] = seq.map((s) => BASE[s.k].cn);
    if (b < a - .4 && b < c - .4) out.push("中间这一截最难，两头都还好，挺过眼下就是。");
    else if (b > a + .4 && b > c + .4) out.push("眼下就是高点，趁现在做想做的事。");
    else if (c > a + .4) out.push(`从${A}走到${C}，是往上走的：先难后顺。`);
    else if (a > c + .4) out.push(`从${A}走到${C}，开头比结尾顺，后面那一段要多留心。`);
    else out.push("前后起伏不大，这是一件稳稳往前走的事。");
  }
  if (sp === "cross") {
    const u = toneOf(all[3]), d = toneOf(all[4]);
    out.push(u >= Math.abs(d) ? `帮你的${BASE[all[3].k].cn}压得住挡你的${BASE[all[4].k].cn}。` : `挡你的${BASE[all[4].k].cn}比帮你的${BASE[all[3].k].cn}重，先处理那道坎。`);
  }
  if (sp === "cast") {
    const c = vis.filter((s) => s.zone === "center"), down = all.filter((s) => s.down).length;
    if (c.length) out.push(`落在中心的是${c.map((s) => BASE[s.k].cn).join("、")}，这件事的核心在${c.length > 1 ? "它们" : "它"}身上。`);
    else out.push("中心是空的：这件事还没有一个真正的核心，可能问题本身还没想清。");
    if (down) out.push(`有 ${down} 颗背面朝上，这些事现在还不到看的时候。`);
  }
  // 搭配
  for (let i = 0; i < vis.length; i++) for (let j = i + 1; j < vis.length; j++) {
    const key = [vis[i].k, vis[j].k].sort().join("+");
    if (RUNE_PAIRS[key]) out.push(RUNE_PAIRS[key]);
  }
  if (vis.some((s) => s.k === "WYRD")) out.push("里面有一颗空白：有一部分还没写下，不由你，也不由牌。");
  return out;
}

// ── 占卜 ──
function renderSpreads() {
  $("spreads").innerHTML = Object.entries(SPREADS).map(([k, s]) => `<button class="pill${k === spread ? " on" : ""}" data-s="${k}">${s.name}</button>`).join("");
  $("spreadNote").textContent = SPREADS[spread].about;
}
$("spreads").onclick = (e) => { const b = e.target.closest("[data-s]"); if (!b || busy) return; spread = b.dataset.s; renderSpreads(); newBoard(); };
$("optUp").onchange = $("optBlank").onchange = () => { if (!picks.length) newBoard(); };

function newBoard() {
  picks = []; reading = null; $("result").innerHTML = "";
  deck = shuffle([...ORDER, ...($("optBlank").checked ? ["WYRD"] : [])]);
  if (spread === "cast") {
    $("board").innerHTML = `<div class="cloth" id="cloth"><span class="zl" style="top:4%">边缘</span><span class="zl" style="top:20%">中圈</span><span class="zl" style="top:42%">中心</span></div>`;
    $("hint").innerHTML = `<button class="btn main" id="castBtn">撒</button>`;
    $("castBtn").onclick = doCast;
    return;
  }
  const n = SPREADS[spread].n;
  $("board").innerHTML = `<div class="field" id="field">${deck.map((k, i) => `<div class="s" data-i="${i}">${stoneSVG(null, false, true, seedOf(k) + i)}</div>`).join("")}</div>` + slotsHTML(n);
  $("hint").textContent = `凭手感点 ${n} 颗` + (n > 1 ? `，按顺序落进上面的位置` : "");
  $("field").onclick = (e) => { const s = e.target.closest(".s"); if (s && !busy) pick(s); };
}
function slotsHTML(n) {
  const pos = SPREADS[spread].pos;
  return `<div class="spread n${n}">${pos.map((p, i) => `<div class="slot empty" id="slot${i}" style="${spread === "cross" ? `grid-area:${CROSS_AREA[i]}` : ""}"><div class="pz">${p}</div><div class="sv">${stoneSVG(null, false, true, i)}</div><div class="nm"></div><div class="rv"></div></div>`).join("")}</div>`;
}
function rollRev(k) { return !$("optUp").checked && !MORE[k].still && Math.random() < .3; }
function pick(el) {
  const n = SPREADS[spread].n, k = deck[+el.dataset.i], i = picks.length;
  const st = { k, rev: rollRev(k), g: Math.floor(Math.random() * 2) };
  picks.push(st);
  el.classList.add("flip");
  setTimeout(() => { el.innerHTML = stoneSVG(k, st.rev); el.classList.add("picked"); }, 250);
  const slot = $("slot" + i);
  slot.classList.remove("empty");
  slot.querySelector(".sv").outerHTML = stoneSVG(k, st.rev);
  slot.querySelector(".nm").textContent = BASE[k].cn;
  slot.querySelector(".rv").textContent = MORE[k].still ? "" : st.rev ? "逆位" : "正位";
  slot.onclick = () => openRune(k, st.rev);
  if (picks.length < n) { $("hint").textContent = `还差 ${n - picks.length} 颗`; return; }
  $("hint").textContent = "";
  busy = true;
  setTimeout(() => { $("field").style.display = "none"; finish(picks); busy = false; }, 650);
}
function doCast() {
  const cloth = $("cloth"), stones = deck.slice(0, 9).map((k) => {
    const r = Math.sqrt(Math.random()) * .44, a = Math.random() * Math.PI * 2;
    const zone = r < .165 ? "center" : r < .33 ? "middle" : "edge";
    return { k, rev: rollRev(k), down: Math.random() < .25, zone, x: 50 + Math.cos(a) * r * 100, y: 50 + Math.sin(a) * r * 100, g: 0 };
  });
  $("hint").textContent = "";
  stones.forEach((st, i) => {
    const d = document.createElement("div");
    d.className = "s"; d.style.left = "50%"; d.style.top = "108%";
    d.innerHTML = stoneSVG(st.k, st.rev, st.down);
    d.onclick = () => !st.down && openRune(st.k, st.rev);
    cloth.append(d);
    setTimeout(() => { d.style.left = st.x + "%"; d.style.top = st.y + "%"; }, 30 + i * 70);
  });
  setTimeout(() => finish(stones), 1100);
}
function finish(stones) {
  reading = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5), at: new Date().toISOString(), q: $("q").value.trim(), spread, stones,
    up: $("optUp").checked, blank: $("optBlank").checked, verdict: "", memo: "" };
  renderResult();
  saveReading(reading);
}
function renderResult() {
  const sp = reading.spread, order = sp === "cross" ? [1, 0, 2, 3, 4] : sp === "cast" ? reading.stones.map((s, i) => i).sort((a, b) => zoneRank(reading.stones[a]) - zoneRank(reading.stones[b])) : reading.stones.map((s, i) => i);
  const each = order.map((i) => { const st = reading.stones[i];
    return `<div class="one" data-i="${i}">${stoneSVG(st.k, st.rev, st.down)}<div><div class="t"><b>${st.down ? "？" : esc(nameOf(st))}</b>${esc(posLabel(st, i))}</div><p>${esc(posText(st, i)).replace(/\n/g, "<br>")}</p></div></div>`; }).join("");
  $("result").innerHTML = (reading.q ? `<div class="card"><h3>问</h3><p>${esc(reading.q)}</p></div>` : "") +
    `<div class="card">${each}</div>` +
    `<div class="card syn"><h3>${sp === "odin" ? "这一颗" : "合起来读"}</h3>${synthesis().map((t) => `<p>${esc(t)}</p>`).join("")}</div>` +
    `<div class="acts"><button class="btn pink" id="askBtn">让小克读</button><button class="btn" id="imgBtn">出图</button><button class="btn" id="againBtn">再来一次</button></div>` +
    `<div class="note">已经记进占卜本了。</div>`;
  $("result").querySelectorAll(".one").forEach((e) => { const st = reading.stones[+e.dataset.i]; if (!st.down) e.onclick = () => openRune(st.k, st.rev); });
  $("askBtn").onclick = askXiaoke;
  $("imgBtn").onclick = makeImage;
  $("againBtn").onclick = () => { newBoard(); window.scrollTo({ top: 0, behavior: "smooth" }); };
  const goRes = () => $("result").scrollIntoView({ behavior: "smooth", block: "start" });
  if (!$("board").innerHTML.trim()) setTimeout(goRes, 200);
  else { $("hint").innerHTML = `<a href="#" id="toRes" style="color:inherit">石头都在这儿了，看够了往下读 ↓</a>`; $("toRes").onclick = (e) => { e.preventDefault(); goRes(); }; }
}
function zoneRank(s) { return s.down ? 3 : { center: 0, middle: 1, edge: 2 }[s.zone]; }

// ── 一颗的全部 ──
function openRune(k, rev) {
  const b = BASE[k], M = MORE[k], ar = rev && !M.still ? "r" : "u";
  const clean = (t) => esc(String(t || "").replace(/（此符无逆位）/g, ""));
  $("sheetIn").innerHTML = `<button class="x" id="sx">×</button><div class="hd">${stoneSVG(k, rev && !M.still)}<div><div class="big">${esc(b.cn)} ${esc(b.latin)}</div><div class="sm">${b.aett >= 0 ? AETT[b.aett].name + " · 第 " + (b.i % 8 + 1) + " 颗" : "现代加的空白符"}${M.still ? " · 没有逆位" : rev ? " · 逆位" : " · 正位"}</div></div></div>` +
    `<div class="kw">${b.keywords.map((x) => `<span>${esc(x)}</span>`).join("")}</div>` +
    `<h4>${M.still ? "意思" : "正位"}</h4><p>${clean(b.upright)}</p>` + (M.still ? "" : `<h4>逆位</h4><p>${clean(b.reversed)}</p>`) +
    `<h4>落在三个位置</h4><p>已成的：${esc((ar === "r" ? M.r : M.u)[0])}<br>正在成的：${esc((ar === "r" ? M.r : M.u)[1])}<br>将要来的：${esc((ar === "r" ? M.r : M.u)[2])}</p>` +
    `<h4>帮你 / 挡你</h4><p>${esc(M.help)}<br>${esc(M.block)}</p>` +
    (b.love?.[ar] ? `<h4>爱情</h4><p>${clean(b.love[ar])}</p><h4>事业</h4><p>${clean(b.work[ar])}</p><h4>成长</h4><p>${clean(b.growth[ar])}</p>` : "") +
    `<h4>神话</h4><p>${esc(b.myth)}</p><div class="q">${esc(b.mythQuote)}</div>`;
  $("sheet").classList.add("on");
  $("sx").onclick = () => $("sheet").classList.remove("on");
}
$("sheet").onclick = (e) => { if (e.target.id === "sheet") $("sheet").classList.remove("on"); };

// ── 让小克读 ──
function readingText(r) {
  const prev = reading; reading = r;
  const L = [`问题：${r.q || "（没写）"}`, `阵：${SPREADS[r.spread].name}${r.up ? "（只读正位）" : ""}`];
  r.stones.forEach((s, i) => L.push(`${posLabel(s, i)}：${s.down ? BASE[s.k].cn + "（背面朝上）" : nameOf(s)}`));
  reading = prev;
  return L.join("\n");
}
async function askXiaoke() {
  const b = $("askBtn"); b.disabled = true;
  try { const r = await api("/api/runes/ask", { note: readingText(reading) }); toast(r.busy ? "叫过了，我说完手上这句就来" : "叫过了，回聊天看我"); }
  catch (e) { toast("没叫到：" + e.message); b.disabled = false; }
}

// ── 出图 ──
function strokeGlyph(ctx, k, cx, cy, w, rev) {
  const M = MORE[k]; if (!M?.s.length) return;
  const h = w * 1.25;
  ctx.save(); ctx.translate(cx, cy); if (rev) ctx.rotate(Math.PI);
  ctx.lineCap = ctx.lineJoin = "round";
  for (const [col, off, lw] of [["rgba(255,255,255,.6)", w * .02, w * .085], ["#4a3a46", 0, w * .085]]) {
    ctx.strokeStyle = col; ctx.lineWidth = lw;
    for (const line of M.s) { ctx.beginPath(); line.forEach(([x, y], i) => ctx[i ? "lineTo" : "moveTo"]((x - .5) * w + off, (y - .5) * h + off)); ctx.stroke(); }
  }
  ctx.restore();
}
function pebble(ctx, cx, cy, r, down) {
  const g = ctx.createRadialGradient(cx - r * .3, cy - r * .35, r * .1, cx, cy, r * 1.15);
  g.addColorStop(0, down ? "#e6dfd6" : "#f7f3ed"); g.addColorStop(.65, down ? "#cfc6b9" : "#e3ddd3"); g.addColorStop(1, down ? "#b6ab9c" : "#cbc2b5");
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(cx, cy, r * .9, r, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "rgba(58,42,58,.18)"; ctx.lineWidth = 2; ctx.stroke();
}
function wrapText(ctx, t, x, y, maxW, lh) {
  let line = "";
  for (const ch of t) { if (ctx.measureText(line + ch).width > maxW && line) { ctx.fillText(line, x, y); y += lh; line = ch; } else line += ch; }
  if (line) { ctx.fillText(line, x, y); y += lh; }
  return y;
}
function makeImage() {
  const W = 1080, H = 1440, c = document.createElement("canvas"); c.width = W; c.height = H;
  const ctx = c.getContext("2d"), font = '-apple-system, "PingFang SC", "Helvetica Neue", sans-serif';
  ctx.fillStyle = "#f4f1ec"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#5c0a4f"; ctx.textAlign = "center";
  ctx.font = `600 34px ${font}`; ctx.fillText(SPREADS[reading.spread].name, W / 2, 110);
  ctx.fillStyle = "#3a2a3a"; ctx.font = `44px ${font}`;
  let y = reading.q ? wrapText(ctx, reading.q, W / 2, 190, 880, 60) : 170;
  const st = reading.stones, sp = reading.spread;
  let spots;
  if (sp === "odin") spots = [[W / 2, y + 190, 150]];
  else if (sp === "norn") spots = [0, 1, 2].map((i) => [W / 2 + (i - 1) * 300, y + 170, 105]);
  else if (sp === "cross") spots = [[W / 2, y + 290, 88], [W / 2 - 260, y + 290, 88], [W / 2 + 260, y + 290, 88], [W / 2, y + 90, 88], [W / 2, y + 490, 88]];
  else { const R = 300, cy = y + 340; ctx.strokeStyle = "rgba(58,42,58,.15)"; ctx.setLineDash([8, 10]); [R, R * .66, R * .33].forEach((r) => { ctx.beginPath(); ctx.arc(W / 2, cy, r, 0, Math.PI * 2); ctx.stroke(); }); ctx.setLineDash([]);
    spots = st.map((s) => [W / 2 + (s.x - 50) / 50 * R / .88, cy + (s.y - 50) / 50 * R / .88, 46]); }
  ctx.textAlign = "center";
  st.forEach((s, i) => {
    const [x, yy, r] = spots[i];
    pebble(ctx, x, yy, r, s.down);
    if (!s.down) strokeGlyph(ctx, s.k, x, yy, r * .8, s.rev);
    if (sp !== "cast") {
      ctx.fillStyle = "#3a2a3a"; ctx.font = `600 ${sp === "cross" ? 28 : 32}px ${font}`; ctx.fillText(nameOf(s), x, yy + r + 46);
      ctx.fillStyle = "rgba(58,42,58,.6)"; ctx.font = `${sp === "cross" ? 22 : 24}px ${font}`; ctx.fillText(SPREADS[sp].pos[i].split(" · ").pop(), x, yy + r + 80);
    }
  });
  y = sp === "odin" ? y + 470 : sp === "norn" ? y + 400 : sp === "cross" ? y + 680 : y + 720;
  ctx.textAlign = "left"; ctx.fillStyle = "#3a2a3a"; ctx.font = `34px ${font}`;
  for (const t of synthesis().slice(0, 4)) { if (y > H - 160) break; y = wrapText(ctx, t, 110, y, 860, 54) + 18; }
  ctx.textAlign = "center"; ctx.fillStyle = "rgba(58,42,58,.45)"; ctx.font = `24px ${font}`;
  const d = new Date(reading.at); ctx.fillText(`${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()} · Elder Futhark`, W / 2, H - 70);
  const url = c.toDataURL("image/png");
  $("imgvImg").src = url; $("imgvDl").href = url; $("imgv").classList.add("on");
}
$("imgvX").onclick = () => $("imgv").classList.remove("on");

// ── 占卜本 ──
let book = [];
async function saveReading(r) { try { await api("/api/runes/book", { item: r }); } catch (e) { toast("占卜本没存上：" + e.message); } }
async function loadBook() {
  try { book = (await api("/api/runes/book")).items || []; } catch (e) { $("bookList").innerHTML = `<div class="note">打不开：${esc(e.message)}</div>`; return; }
  const done = book.filter((b) => b.verdict), hit = done.filter((b) => b.verdict === "中").length, half = done.filter((b) => b.verdict === "一半").length;
  $("bookStat").textContent = book.length ? `一共 ${book.length} 次，回头看过 ${done.length} 次` + (done.length ? `：应验 ${hit}，一半 ${half}，没有 ${done.length - hit - half}` : "") : "";
  $("bookList").innerHTML = book.length ? book.map((r, n) => {
    const d = new Date(r.at);
    return `<div class="entry" data-n="${n}"><div class="top"><span>${SPREADS[r.spread]?.name || ""}</span><span>${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}</span></div>` +
      `<div class="qq">${esc(r.q || "（没写问题）")}</div><div class="gl">${r.stones.filter((s) => !s.down).map((s) => `${stoneSVG(s.k, s.rev)}<span class="n">${esc(BASE[s.k]?.cn || "")}</span>`).join("")}</div>` +
      `<div class="vd">${["中", "一半", "没有"].map((v) => `<button class="pill${r.verdict === v ? " on" : ""}" data-v="${v}">${v === "中" ? "应验了" : v}</button>`).join("")}<input placeholder="后来怎样了" value="${esc(r.memo || "")}"><button class="pill" data-open="1">再看</button><button class="pill del" data-del="1" title="删掉这一次">删</button></div></div>`;
  }).join("") : `<div class="note">还没有。占卜一次就会记在这里，过一阵回来勾一下准不准。</div>`;
}
$("bookList").onclick = (e) => {
  const en = e.target.closest(".entry"); if (!en) return;
  const r = book[+en.dataset.n], b = e.target.closest("button"); if (!b) return;
  if (b.dataset.del) { if (!confirm("删掉这一次？删了就找不回来了")) return; api("/api/runes/book/delete", { id: r.id }).then(() => { toast("删掉了"); loadBook(); }).catch((x) => toast("没删掉：" + x.message)); return; }
  if (b.dataset.open) { reading = r; spread = r.spread; showView("cast"); renderSpreads(); $("board").innerHTML = ""; $("hint").textContent = ""; $("q").value = r.q || ""; renderResult(); return; }
  r.verdict = r.verdict === b.dataset.v ? "" : b.dataset.v; saveReading(r).then(loadBook);
};
$("bookList").addEventListener("change", (e) => { if (e.target.tagName !== "INPUT") return; const r = book[+e.target.closest(".entry").dataset.n]; r.memo = e.target.value.trim().slice(0, 300); saveReading(r).then(() => toast("记下了")); });

// ── 认符 ──
const WEAK_KEY = "runes-weak";
function weak() { try { return JSON.parse(localStorage.getItem(WEAK_KEY)) || {}; } catch { return {}; } }
function renderLearn() {
  const w = weak();
  $("aettList").innerHTML = AETT.map((a, ai) => `<div class="aett"><div class="an">${a.name}</div><div class="ab">${a.about}</div><div class="grid8">` +
    ORDER.slice(ai * 8, ai * 8 + 8).map((k) => `<div class="c${(w[k] || 0) > 0 ? " weak" : ""}" data-k="${k}">${stoneSVG(k)}<div class="n">${BASE[k].cn}</div></div>`).join("") + `</div></div>`).join("");
}
$("aettList").onclick = (e) => { const c = e.target.closest("[data-k]"); if (c) openRune(c.dataset.k, false); };
function quiz() {
  const w = weak(), pool = ORDER.flatMap((k) => Array(1 + 3 * (w[k] || 0)).fill(k)), k = pool[Math.floor(Math.random() * pool.length)];
  const q = $("quiz"); q.hidden = false;
  q.innerHTML = `${stoneSVG(k)}<div class="ans" id="ans"><button class="btn" id="showAns">它叫什么、说什么？</button></div>`;
  $("showAns").onclick = () => {
    $("ans").innerHTML = `<b>${BASE[k].cn} ${BASE[k].latin}</b><br>${BASE[k].keywords.join(" · ")}<div class="acts" style="justify-content:center"><button class="btn" id="qy">认得</button><button class="btn" id="qn">还不熟</button></div>`;
    const mark = (d) => { const x = weak(); x[k] = Math.max(0, Math.min(3, (x[k] || 0) + d)); localStorage.setItem(WEAK_KEY, JSON.stringify(x)); renderLearn(); quiz(); };
    $("qy").onclick = () => mark(-1); $("qn").onclick = () => mark(1);
  };
}
$("quizBtn").onclick = quiz;

// ── 切页 ──
function showView(v) {
  document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("on", t.dataset.v === v));
  $("vCast").hidden = v !== "cast"; $("vBook").hidden = v !== "book"; $("vLearn").hidden = v !== "learn";
  if (v === "book") loadBook();
  if (v === "learn") renderLearn();
}
document.querySelector(".tabs").onclick = (e) => { const t = e.target.closest(".tab"); if (t) showView(t.dataset.v); };

renderSpreads(); newBoard();
</script>
