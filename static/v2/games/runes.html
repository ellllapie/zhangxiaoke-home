<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>卢恩</title>
<style>
  :root { --ink: #f6eedd; --soft: rgba(246,238,221,.62); --line: rgba(246,238,221,.16); --gold: #e8c47e; --paper: rgba(10,10,20,.5);
    --serif: "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; color: var(--ink); font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; -webkit-tap-highlight-color: transparent; background: #0c1428; }
  body { padding: 0 0 calc(60px + env(safe-area-inset-bottom)); min-height: 100vh; }
  button { font: inherit; color: inherit; }
  .glow { text-shadow: 0 0 6px rgba(255,236,200,.5), 0 0 18px rgba(255,214,160,.22); }

  /* 桌子 */
  #table { position: fixed; inset: 0; z-index: 0; background: #14223f center / cover no-repeat; }
  #table::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(0,0,0,.42) 100%); }
  #props { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .pr { position: absolute; left: 0; top: 0; filter: drop-shadow(5px 9px 7px rgba(0,0,0,.5)); }
  .pr .rot { transform-origin: 50% 50%; }
  .pr img { display: block; width: 100%; pointer-events: none; user-select: none; -webkit-user-drag: none; }
  .pr.book { pointer-events: auto; cursor: pointer; }
  .pr.book:hover { filter: drop-shadow(5px 9px 7px rgba(0,0,0,.5)) drop-shadow(0 0 10px rgba(255,226,170,.45)); }
  body.arranging #props { z-index: 6; pointer-events: auto; touch-action: none; }
  body.arranging .pr { pointer-events: auto; cursor: grab; }
  body.arranging .pr.sel { filter: drop-shadow(5px 9px 7px rgba(0,0,0,.5)) drop-shadow(0 0 2px #fff) drop-shadow(0 0 12px rgba(255,226,170,.8)); }
  body.arranging .wrap, body.arranging #nav { opacity: .1; pointer-events: none; }

  /* 侧边的字 */
  #nav { position: fixed; left: 20px; top: 18px; z-index: 5; font-family: var(--serif); letter-spacing: .14em; transition: opacity .3s; }
  #nav a, #nav .h { display: block; cursor: pointer; text-decoration: none; color: var(--ink); padding: 4px 0; user-select: none; }
  #nav .h { font-size: 15.5px; margin-top: 10px; }
  #nav .h:first-child { margin-top: 0; }
  #nav .sub { padding-left: 1.1em; }
  #nav .sub a, #nav .opt { font-size: 13.5px; opacity: .55; transition: opacity .2s; }
  #nav .sub a:hover, #nav .opt:hover { opacity: .85; }
  #nav .sub a.on { opacity: 1; text-shadow: 0 0 8px rgba(255,236,200,.8), 0 0 22px rgba(255,214,160,.45); }
  #nav .dim { opacity: .32; cursor: default; font-size: 14px; }
  #nav .opt { display: flex; align-items: center; gap: 7px; padding: 4px 0; cursor: pointer; }
  #nav .opt input { display: none; }
  #nav .opt i { width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--ink); display: inline-block; }
  #nav .opt input:checked + i { background: var(--ink); box-shadow: 0 0 8px rgba(255,236,200,.9); }
  #nav .opt:has(input:checked) { opacity: .95; }
  #navNow { display: none; font-size: 15px; cursor: pointer; }
  @media (max-width: 980px) {
    #nav { left: 14px; top: 12px; }
    #navNow { display: block; }
    #tree { display: none; margin-top: 8px; padding: 10px 16px 12px 14px; border-radius: 14px; background: rgba(8,8,16,.72); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    #nav.open #tree { display: block; }
  }

  /* 中间 */
  .wrap { position: relative; z-index: 2; max-width: 560px; margin: 0 auto; padding: 22px 16px; pointer-events: none; }
  .wrap > * { pointer-events: auto; }
  @media (max-width: 980px) { .wrap { padding-top: 54px; } }
  .sname { text-align: center; font-family: var(--serif); font-size: 22px; letter-spacing: .3em; margin: 6px 0 10px; text-shadow: 0 0 10px rgba(255,236,200,.55), 0 0 26px rgba(255,214,160,.25); }
  textarea#q { display: block; width: 100%; background: transparent; border: 0; border-bottom: 1px solid var(--line); padding: 8px 4px; font: inherit; font-size: 16px; color: var(--ink);
    text-align: center; resize: none; outline: none; font-family: var(--serif); letter-spacing: .06em; height: 42px; }
  textarea#q::placeholder { color: var(--soft); opacity: .7; }
  textarea#q:focus { border-bottom-color: rgba(232,196,126,.6); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .note { font-size: 12.5px; color: var(--soft); line-height: 1.8; margin: 8px 2px 0; }
  .note.c { text-align: center; }
  .tab, .pill, .btn, .glow.big { background: none; border: 0; padding: 6px 10px; font-size: 14px; cursor: pointer; white-space: nowrap; color: var(--ink); font-family: var(--serif); letter-spacing: .1em;
    text-shadow: 0 0 6px rgba(255,236,200,.45), 0 0 16px rgba(255,214,160,.2); opacity: .82; }
  .tab:hover, .pill:hover, .btn:hover { opacity: 1; }
  .pill.on { opacity: 1; color: var(--gold); text-shadow: 0 0 8px rgba(232,196,126,.8); }
  .btn.main, .btn.pink { color: var(--gold); opacity: 1; }
  .btn:disabled { opacity: .3; }
  .glow.big { font-size: 22px; letter-spacing: .3em; opacity: 1; padding: 10px 20px; }
  a.btn { text-decoration: none; }

  /* 珍珠 */
  .stone { display: block; position: relative; aspect-ratio: 1; filter: drop-shadow(2px 4px 3px rgba(0,0,0,.5)); }
  .stone .pl { position: absolute; left: 50%; top: 50%; width: 96%; height: 96%; object-fit: contain; }
  .stone .gl { position: absolute; left: 50%; top: 50%; height: 40%; }
  .stone.down .pl { filter: brightness(.84) saturate(.7) contrast(.95); }
  .field { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px 10px; padding: 14px 4px; margin-top: 8px; }
  .field .s { cursor: pointer; transition: transform .25s, opacity .3s; }
  .field .s:hover { transform: translateY(-2px) scale(1.04); }
  .field .s:active { transform: scale(.94); }
  .field .s.picked { opacity: .2; pointer-events: none; }
  .field .s.flip { animation: flip .5s ease; }
  @keyframes flip { 0% { transform: rotateY(0) } 50% { transform: rotateY(90deg) } 100% { transform: rotateY(0) } }
  .hint { text-align: center; font-size: 13px; color: var(--soft); margin: 12px 0 0; min-height: 1.4em; font-family: var(--serif); letter-spacing: .08em; }
  .hint a { color: var(--ink) !important; text-shadow: 0 0 8px rgba(255,236,200,.6); text-decoration: none; }

  /* 撒石 */
  .cloth { position: relative; width: 100%; aspect-ratio: 1; margin-top: 10px; border-radius: 50%; border: 1px solid rgba(232,196,126,.28); box-shadow: inset 0 0 60px rgba(0,0,0,.25); }
  .cloth::before, .cloth::after { content: ""; position: absolute; border: 1px dashed rgba(232,196,126,.2); border-radius: 50%; }
  .cloth::before { inset: 17%; } .cloth::after { inset: 33.5%; }
  .cloth .s { position: absolute; width: 15%; transform: translate(-50%, -50%); transition: left .7s cubic-bezier(.2,.9,.3,1.2), top .7s cubic-bezier(.2,.9,.3,1.2); cursor: pointer; }

  /* 阵 */
  .spread { display: grid; gap: 10px; margin-top: 16px; justify-content: center; }
  .spread.n1 { grid-template-columns: 120px; }
  .spread.n3 { grid-template-columns: repeat(3, 1fr); }
  .spread.n5 { grid-template-columns: repeat(3, 1fr); grid-template-areas: ". up ." "left mid right" ". down ."; }
  .slot { text-align: center; }
  .slot .pz { font-size: 11.5px; color: var(--soft); letter-spacing: .1em; margin-bottom: 6px; min-height: 1.3em; font-family: var(--serif); }
  .slot .sv { width: 78px; margin: 0 auto; cursor: pointer; }
  .spread.n1 .slot .sv { width: 112px; }
  .slot .nm { font-size: 14px; font-weight: 600; margin-top: 4px; font-family: var(--serif); letter-spacing: .1em; text-shadow: 0 0 8px rgba(255,236,200,.45); }
  .slot .rv { font-size: 11px; color: var(--soft); }
  .slot.empty .sv { opacity: .22; }

  .card { background: var(--paper); backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px); border: 1px solid var(--line); border-radius: 14px; padding: 15px 17px; margin-top: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.25); }
  .card h3 { margin: 0 0 8px; font-size: 13px; letter-spacing: .2em; color: var(--gold); font-weight: 500; font-family: var(--serif); }
  .card p { margin: 0; font-size: 15px; line-height: 1.9; }
  .one { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); cursor: pointer; }
  .one:first-of-type { border-top: 0; padding-top: 2px; }
  .one .sv { width: 46px; flex: none; }
  .one .t { font-size: 12px; color: var(--soft); margin-bottom: 2px; }
  .one .t b { color: var(--ink); font-size: 14.5px; margin-right: 6px; font-family: var(--serif); letter-spacing: .06em; }
  .one p { font-size: 14.5px; line-height: 1.8; }
  .syn p + p { margin-top: 8px; }
  .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 14px; }

  /* 一颗符文的全部 */
  .sheet { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.4); display: none; align-items: flex-end; justify-content: center; }
  .sheet.on { display: flex; }
  .sheet .in { background: rgba(16,14,26,.92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); width: 100%; max-width: 560px; max-height: 86vh; overflow-y: auto;
    border-radius: 20px 20px 0 0; border: 1px solid var(--line); border-bottom: 0; padding: 18px 18px calc(28px + env(safe-area-inset-bottom)); }
  .sheet .hd { display: flex; gap: 14px; align-items: center; }
  .sheet .hd .sv { width: 72px; }
  .sheet .hd .big { font-size: 19px; font-weight: 600; letter-spacing: .1em; font-family: var(--serif); text-shadow: 0 0 8px rgba(255,236,200,.4); }
  .sheet .hd .sm { font-size: 12px; color: var(--soft); margin-top: 2px; }
  .kw { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 4px; }
  .kw span { font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; }
  .sheet h4 { font-size: 12px; color: var(--gold); letter-spacing: .18em; font-weight: 500; margin: 16px 0 6px; font-family: var(--serif); }
  .sheet p { margin: 0; font-size: 14.5px; line-height: 1.9; }
  .sheet .q { font-size: 13px; color: var(--gold); border-left: 2px solid rgba(232,196,126,.5); padding-left: 10px; margin-top: 8px; }
  .sheet .x { float: right; background: none; border: 0; font-size: 22px; line-height: 1; opacity: .5; cursor: pointer; }

  /* 占卜本 */
  .entry { background: var(--paper); backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
  .entry .top { display: flex; justify-content: space-between; font-size: 12px; color: var(--soft); font-family: var(--serif); letter-spacing: .06em; }
  .entry .qq { font-size: 15px; margin: 6px 0 8px; line-height: 1.6; }
  .entry .gl { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .entry .gl .sv { width: 34px; }
  .entry .gl .n { font-size: 12px; color: var(--soft); margin-right: 6px; }
  .entry .vd { display: flex; gap: 2px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
  .entry .vd .pill { padding: 4px 8px; font-size: 12.5px; }
  .entry .vd .pill.del { opacity: .45; }
  .entry input { flex: 1; min-width: 120px; border: 0; border-bottom: 1px solid var(--line); padding: 5px 4px; font: inherit; font-size: 13px; background: transparent; color: var(--ink); outline: none; }
  .stat { font-size: 13px; color: var(--soft); margin: 4px 2px 12px; line-height: 1.7; text-align: center; }
  .close { display: block; text-align: center; margin: -4px 0 12px; }

  /* 认符 */
  .aett { margin-top: 6px; }
  .aett .an { font-size: 14px; font-weight: 600; margin: 16px 2px 2px; font-family: var(--serif); letter-spacing: .12em; color: var(--gold); }
  .aett .ab { font-size: 12px; color: var(--soft); margin: 0 2px 8px; }
  .grid8 { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
  .grid8 .c { text-align: center; cursor: pointer; }
  .grid8 .c .sv { width: 100%; }
  .grid8 .c .n { font-size: 10.5px; color: var(--soft); margin-top: 2px; }
  .grid8 .c.weak .n { color: var(--gold); font-weight: 600; }
  .quiz { text-align: center; }
  .quiz .sv { width: 120px; margin: 16px auto 8px; }
  .quiz .ans { min-height: 64px; font-size: 15px; line-height: 1.7; }

  /* 摆设 */
  #arrangeBar { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 8; display: flex; gap: 2px; flex-wrap: wrap; justify-content: center;
    background: rgba(8,8,16,.72); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 16px; padding: 6px 8px; max-width: calc(100vw - 20px); }
  #arrangeBar .tip { width: 100%; text-align: center; font-size: 11.5px; color: var(--soft); padding: 2px 0 4px; }
  #tray { position: fixed; left: 50%; bottom: calc(110px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 8; width: min(560px, calc(100vw - 20px)); max-height: 46vh; overflow-y: auto;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; padding: 12px; background: rgba(8,8,16,.8); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 16px; }
  #tray img { width: 100%; aspect-ratio: 1; object-fit: contain; cursor: pointer; filter: drop-shadow(2px 4px 4px rgba(0,0,0,.5)); }
  #tray img:hover { transform: scale(1.08); }

  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: rgba(8,8,16,.85); color: var(--ink); border: 1px solid var(--line);
    padding: 8px 16px; border-radius: 999px; font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 30; white-space: nowrap; }
  .toast.on { opacity: 1; }
  .imgv { position: fixed; inset: 0; z-index: 25; background: rgba(0,0,0,.7); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 20px; }
  .imgv.on { display: flex; }
  .imgv img { max-width: 100%; max-height: 76vh; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.4); }
  .imgv .note { color: var(--ink); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <radialGradient id="peb" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#f6f2ec"/><stop offset=".65" stop-color="#e3ddd3"/><stop offset="1" stop-color="#cbc2b5"/></radialGradient>
    <radialGradient id="pebBack" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#e6dfd6"/><stop offset=".7" stop-color="#cfc6b9"/><stop offset="1" stop-color="#b6ab9c"/></radialGradient>
  </defs>
</svg>

<div id="table"></div>
<div id="props"></div>

<nav id="nav">
  <div id="navNow" class="glow"></div>
  <div id="tree">
    <div class="h glow">ᛟ 卢恩</div>
    <div class="sub">
      <a class="glow" data-s="odin">› 奥丁单符</a>
      <a class="glow" data-s="norn">› 诺伦三符</a>

      <label class="opt glow"><input type="checkbox" id="optUp"><i></i>只读正位</label>
      <label class="opt glow"><input type="checkbox" id="optBlank"><i></i>放进空白符</label>
    </div>
    <div class="h dim">✧ 塔罗 · 还没摆上桌</div>

</nav>

<div id="arrangeBar" hidden>
  <div class="tip">拖着走 · 两根手指转和放大（电脑上滚轮放大，按住 Shift 滚轮转）· 本子收不走</div>
  <button class="btn" data-a="rl">⟲</button><button class="btn" data-a="rr">⟳</button>
  <button class="btn" data-a="up">大</button><button class="btn" data-a="dn">小</button>
  <button class="btn" data-a="top">放上面</button><button class="btn" data-a="del">收起来</button>
  <button class="btn" data-a="add">＋ 加一件</button><button class="btn" data-a="reset">恢复默认</button>

</div>

  <textarea id="q" rows="1" placeholder="想问什么……"></textarea>
  <div class="note c" id="spreadNote"></div>
  <div id="board"></div>
  <div class="hint" id="hint"></div>
  <div id="result"></div>
</div>

<div class="wrap" id="vBook" hidden>
  <div class="sname">占卜本</div>
  <div class="stat" id="bookStat"></div>
  <div id="bookList"></div>
</div>

  <div class="sname">认符</div>
  <div class="row"><button class="btn main" id="quizBtn">抽查</button><span class="note" style="margin:0">点一颗看它的全部；抽查里答错的，名字会变成紫色</span></div>
  <div class="card quiz" id="quiz" hidden></div>

</div>

<div class="sheet" id="sheet"><div class="in" id="sheetIn"></div></div>
<div class="imgv" id="imgv"><img id="imgvImg" alt=""><div class="note">手机上长按图片保存</div><div class="row"><a class="btn" id="imgvDl" download="卢恩.png">下载</a><button class="btn" id="imgvX">关掉</button></div></div>

<script src="runes-more.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const BASE = Object.fromEntries(RUNES_BASE.map((r, i) => [r.latin, { ...r, i, aett: Math.floor(i / 8) }]));
BASE.WYRD = { ...RUNE_BLANK, i: 24, aett: -1 };
const MORE = { ...RUNES_MORE, WYRD: RUNE_BLANK_MORE };
const ORDER = RUNES_BASE.map((r) => r.latin);

const SPREADS = {
  odin: { name: "奥丁单符", n: 1, pos: ["奥丁之符"], about: "一件事，一颗。问题越具体越好。" },
  norn: { name: "诺伦三符", n: 3, pos: ["乌尔德 · 已成的", "薇尔丹蒂 · 正在成的", "斯库尔德 · 将要来的"],
    about: "三位命运女神：乌尔德管已经织好的，薇尔丹蒂管正在织的，斯库尔德管还欠着、要来的。" },
  cross: { name: "五符十字", n: 5, pos: ["中心 · 此刻", "左 · 来处", "右 · 去处", "上 · 帮你的", "下 · 挡你的"],
    about: "依次抽五颗：中心、左、右、上、下。适合想看清一件事的来龙去脉。" },
  cast: { name: "九符撒石", n: 9, pos: [], about: "一把九颗撒在布上：落在中心的是核心，中圈是牵动它的，边缘是远一点、慢一点的。背面朝上的不读。" },
};
const CROSS_AREA = ["mid", "left", "right", "up", "down"];

let spread = "norn", deck = [], seeds = [], picks = [], reading = null, busy = false;

// ── 小工具 ──
function toast(t) { const e = $("toast"); e.textContent = t; e.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove("on"), 2200); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }
async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.status);
  return r.json();
}
function seedOf(s) { let h = 7; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; }

// 一颗石头：形状每颗略不一样（按名字定，同一颗永远一样）
const NP = 25;
function stoneSVG(k, rev = false, down = false, seed) {
  const sd = seed ?? seedOf(k || "x"), rot = (sd * 47) % 360, tilt = ((sd >> 3) % 21) - 10;
  const g = k && !down && k !== "WYRD" ? `<img class="gl" src="table/g/${k}.webp" style="transform:translate(-50%,-50%) rotate(${(rev ? 180 : 0) + tilt}deg)" alt="">` : "";

// ── 解读 ──
const LABEL = { center: "中心 · 核心", middle: "中圈 · 牵动它的", edge: "边缘 · 远一点的" };
function lines(st) { const M = MORE[st.k]; return st.rev && M.r ? M.r : M.u; }

    if (i === 4) return "挡着你的是：" + M.block + (st.rev ? "它逆着，这道坎比看起来更硬一点。" : "");
    return L[[1, 0, 2][i]];

  if (st.down) return "这一颗还没翻面，现在不到看它的时候。";

}
function synthesis() {

    out.push(toneOf(s) > 0 ? "它是顺的，问题的答案偏向「可以」。" : toneOf(s) < 0 ? "它带着阻力，问题的答案偏向「先等等」。" : "它不偏好也不偏坏，答案要你自己去碰。");
    if (s.k === "WYRD") out.push("抽到空白：这件事现在问不出答案，先放一放。");
    return out;
  }
  // 三族
  const real = vis.filter((s) => s.k !== "WYRD"), cnt = [0, 0, 0];
  real.forEach((s) => cnt[BASE[s.k].aett]++);
  if (real.length >= 3) {
    const m = cnt.indexOf(Math.max(...cnt));
    if (cnt[m] * 2 >= real.length) out.push(`${AETT[m].name}占了 ${cnt[m]} 颗：这件事多半关于${AETT[m].about}。`);
    else if (cnt.every((c) => c > 0)) out.push("三族都有，这件事牵得比较广，不只一个方面。");
  }
  // 正逆
  const rev = real.filter((s) => s.rev).length;

    else if (rev * 2 >= real.length) out.push(`逆着的有 ${rev} 颗，过了一半：这件事里堵的地方多，先疏通，再往前。`);
  }

  }

    if (c.length) out.push(`落在中心的是${c.map((s) => BASE[s.k].cn).join("、")}，这件事的核心在${c.length > 1 ? "它们" : "它"}身上。`);
    else out.push("中心是空的：这件事还没有一个真正的核心，可能问题本身还没想清。");

    if (RUNE_PAIRS[key]) out.push(RUNE_PAIRS[key]);
  }
  if (vis.some((s) => s.k === "WYRD")) out.push("里面有一颗空白：有一部分还没写下，不由你，也不由牌。");
  return out;
}

// ── 占卜 ──
function renderSpreads() {

  $("sname").textContent = SPREADS[spread].name;
  $("spreadNote").textContent = SPREADS[spread].about;
  $("navNow").textContent = $("vCast").hidden ? ($("vBook").hidden ? "认符" : "占卜本") : "卢恩 › " + SPREADS[spread].name;
}
$("optUp").onchange = $("optBlank").onchange = () => { if (!picks.length) newBoard(); };

function newBoard() {

  deck = shuffle([...ORDER, ...($("optBlank").checked ? ["WYRD"] : [])]); seeds = shuffle([...Array(60).keys()]);
  if (spread === "cast") {
    $("board").innerHTML = `<div class="cloth" id="cloth"></div>`;
    $("hint").innerHTML = `<button class="glow big" id="castBtn">✦ 撒</button>`;
    $("castBtn").onclick = doCast;
    return;
  }
  const n = SPREADS[spread].n;
  $("board").innerHTML = `<div class="field" id="field">${deck.map((k, i) => `<div class="s" data-i="${i}">${stoneSVG(null, false, true, seeds[i])}</div>`).join("")}</div>` + slotsHTML(n);
  $("hint").textContent = `凭手感点 ${n} 颗` + (n > 1 ? `，按顺序落进上面的位置` : "");
  $("field").onclick = (e) => { const s = e.target.closest(".s"); if (s && !busy) pick(s); };
}
function slotsHTML(n) {
  const pos = SPREADS[spread].pos;

}
function rollRev(k) { return !$("optUp").checked && !MORE[k].still && Math.random() < .3; }
function pick(el) {
  const n = SPREADS[spread].n, k = deck[+el.dataset.i], i = picks.length;
  const st = { k, rev: rollRev(k), g: Math.floor(Math.random() * 2), p: seeds[+el.dataset.i] };
  picks.push(st);
  el.classList.add("flip");
  setTimeout(() => { el.innerHTML = stoneSVG(k, st.rev, false, st.p); el.classList.add("picked"); }, 250);
  const slot = $("slot" + i);
  slot.classList.remove("empty");
  slot.querySelector(".sv").outerHTML = stoneSVG(k, st.rev, false, st.p);
  slot.querySelector(".nm").textContent = BASE[k].cn;
  slot.querySelector(".rv").textContent = MORE[k].still ? "" : st.rev ? "逆位" : "正位";
  slot.onclick = () => openRune(k, st.rev);
  if (picks.length < n) { $("hint").textContent = `还差 ${n - picks.length} 颗`; return; }
  $("hint").textContent = "";

  setTimeout(() => { $("field").style.display = "none"; finish(picks); busy = false; }, 650);
}
function doCast() {
  const cloth = $("cloth"), stones = deck.slice(0, 9).map((k) => {
    const r = Math.sqrt(Math.random()) * .44, a = Math.random() * Math.PI * 2;
    const zone = r < .165 ? "center" : r < .33 ? "middle" : "edge";
    return { k, rev: rollRev(k), down: Math.random() < .25, zone, p: seeds[deck.indexOf(k)], x: 50 + Math.cos(a) * r * 100, y: 50 + Math.sin(a) * r * 100, g: 0 };
  });
  $("hint").textContent = "";
  stones.forEach((st, i) => {
    const d = document.createElement("div");
    d.className = "s"; d.style.left = "50%"; d.style.top = "108%";
    d.innerHTML = stoneSVG(st.k, st.rev, st.down, st.p);
    d.onclick = () => !st.down && openRune(st.k, st.rev);
    cloth.append(d);
    setTimeout(() => { d.style.left = st.x + "%"; d.style.top = st.y + "%"; }, 30 + i * 70);

}
function finish(stones) {
  reading = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5), at: new Date().toISOString(), q: $("q").value.trim(), spread, stones,
    up: $("optUp").checked, blank: $("optBlank").checked, verdict: "", memo: "" };
  renderResult();
  saveReading(reading);
}
function renderResult() {

  const each = order.map((i) => { const st = reading.stones[i];
    return `<div class="one" data-i="${i}">${stoneSVG(st.k, st.rev, st.down, st.p)}<div><div class="t"><b>${st.down ? "？" : esc(nameOf(st))}</b>${esc(posLabel(st, i))}</div><p>${esc(posText(st, i)).replace(/\n/g, "<br>")}</p></div></div>`; }).join("");
  $("result").innerHTML = (reading.q ? `<div class="card"><h3>问</h3><p>${esc(reading.q)}</p></div>` : "") +
    `<div class="card">${each}</div>` +
    `<div class="card syn"><h3>${sp === "odin" ? "这一颗" : "合起来读"}</h3>${synthesis().map((t) => `<p>${esc(t)}</p>`).join("")}</div>` +
    `<div class="acts"><button class="btn pink" id="askBtn">让小克读</button><button class="btn" id="imgBtn">出图</button><button class="btn" id="againBtn">再来一次</button></div>` +
    `<div class="note">已经记进占卜本了。</div>`;
  $("result").querySelectorAll(".one").forEach((e) => { const st = reading.stones[+e.dataset.i]; if (!st.down) e.onclick = () => openRune(st.k, st.rev); });
  $("askBtn").onclick = askXiaoke;
  $("imgBtn").onclick = makeImage;
  $("againBtn").onclick = () => { newBoard(); window.scrollTo({ top: 0, behavior: "smooth" }); };
  const goRes = () => $("result").scrollIntoView({ behavior: "smooth", block: "start" });
  if (!$("board").innerHTML.trim()) setTimeout(goRes, 200);
  else { $("hint").innerHTML = `<a href="#" id="toRes" style="color:inherit">石头都在这儿了，看够了往下读 ↓</a>`; $("toRes").onclick = (e) => { e.preventDefault(); goRes(); }; }
}
function zoneRank(s) { return s.down ? 3 : { center: 0, middle: 1, edge: 2 }[s.zone]; }

// ── 一颗的全部 ──
function openRune(k, rev) {
  const b = BASE[k], M = MORE[k], ar = rev && !M.still ? "r" : "u";
  const clean = (t) => esc(String(t || "").replace(/（此符无逆位）/g, ""));
  $("sheetIn").innerHTML = `<button class="x" id="sx">×</button><div class="hd">${stoneSVG(k, rev && !M.still)}<div><div class="big">${esc(b.cn)} ${esc(b.latin)}</div><div class="sm">${b.aett >= 0 ? AETT[b.aett].name + " · 第 " + (b.i % 8 + 1) + " 颗" : "现代加的空白符"}${M.still ? " · 没有逆位" : rev ? " · 逆位" : " · 正位"}</div></div></div>` +
    `<div class="kw">${b.keywords.map((x) => `<span>${esc(x)}</span>`).join("")}</div>` +
    `<h4>${M.still ? "意思" : "正位"}</h4><p>${clean(b.upright)}</p>` + (M.still ? "" : `<h4>逆位</h4><p>${clean(b.reversed)}</p>`) +
    `<h4>落在三个位置</h4><p>已成的：${esc((ar === "r" ? M.r : M.u)[0])}<br>正在成的：${esc((ar === "r" ? M.r : M.u)[1])}<br>将要来的：${esc((ar === "r" ? M.r : M.u)[2])}</p>` +
    `<h4>帮你 / 挡你</h4><p>${esc(M.help)}<br>${esc(M.block)}</p>` +
    (b.love?.[ar] ? `<h4>爱情</h4><p>${clean(b.love[ar])}</p><h4>事业</h4><p>${clean(b.work[ar])}</p><h4>成长</h4><p>${clean(b.growth[ar])}</p>` : "") +
    `<h4>神话</h4><p>${esc(b.myth)}</p><div class="q">${esc(b.mythQuote)}</div>`;
  $("sheet").classList.add("on");
  $("sx").onclick = () => $("sheet").classList.remove("on");
}
$("sheet").onclick = (e) => { if (e.target.id === "sheet") $("sheet").classList.remove("on"); };

// ── 让小克读 ──
function readingText(r) {
  const prev = reading; reading = r;
  const L = [`问题：${r.q || "（没写）"}`, `阵：${SPREADS[r.spread].name}${r.up ? "（只读正位）" : ""}`];
  r.stones.forEach((s, i) => L.push(`${posLabel(s, i)}：${s.down ? BASE[s.k].cn + "（背面朝上）" : nameOf(s)}`));
  reading = prev;
  return L.join("\n");
}
async function askXiaoke() {
  const b = $("askBtn"); b.disabled = true;
  try { const r = await api("/api/runes/ask", { note: readingText(reading) }); toast(r.busy ? "叫过了，我说完手上这句就来" : "叫过了，回聊天看我"); }
  catch (e) { toast("没叫到：" + e.message); b.disabled = false; }
}

// ── 出图 ──
const IMGS = {};
function loadImg(src) { return IMGS[src] || (IMGS[src] = new Promise((ok) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = src; })); }
async function pearlOn(ctx, s, cx, cy, r) {
  const sd = s.p ?? seedOf(s.k || "x"), rot = (sd * 47) % 360, tilt = ((sd >> 3) % 21) - 10;
  const pl = await loadImg(`table/p/${sd % NP}.webp`);
  ctx.save(); ctx.translate(cx, cy);
  ctx.shadowColor = "rgba(0,0,0,.45)"; ctx.shadowBlur = r * .18; ctx.shadowOffsetX = r * .06; ctx.shadowOffsetY = r * .1;
  if (pl) { ctx.save(); ctx.rotate(rot * Math.PI / 180); const f = 2 * r / Math.max(pl.width, pl.height); if (s.down) ctx.filter = "brightness(.84) saturate(.7)"; ctx.drawImage(pl, -pl.width * f / 2, -pl.height * f / 2, pl.width * f, pl.height * f); ctx.restore(); }
  ctx.shadowColor = "transparent";
  if (!s.down && s.k && s.k !== "WYRD") { const g = await loadImg(`table/g/${s.k}.webp`); if (g) { ctx.rotate(((s.rev ? 180 : 0) + tilt) * Math.PI / 180); const f = r * .82 / g.height; ctx.drawImage(g, -g.width * f / 2, -g.height * f / 2, g.width * f, g.height * f); } }
  ctx.restore();
}
function wrapText(ctx, t, x, y, maxW, lh) {

  for (const ch of t) { if (ctx.measureText(line + ch).width > maxW && line) { ctx.fillText(line, x, y); y += lh; line = ch; } else line += ch; }
  if (line) { ctx.fillText(line, x, y); y += lh; }
  return y;
}
async function makeImage() {
  const W = 1080, H = 1440, c = document.createElement("canvas"); c.width = W; c.height = H;
  const ctx = c.getContext("2d"), font = '-apple-system, "PingFang SC", "Helvetica Neue", sans-serif';
  const vel = await loadImg(`table/velvet-${cloth()}.webp`);
  if (vel) { const f = Math.max(W / vel.width, H / vel.height); ctx.drawImage(vel, (W - vel.width * f) / 2, (H - vel.height * f) / 2, vel.width * f, vel.height * f); } else { ctx.fillStyle = "#14223f"; ctx.fillRect(0, 0, W, H); }
  ctx.fillStyle = "rgba(0,0,0,.18)"; ctx.fillRect(0, 0, W, H);
  ctx.shadowColor = "rgba(255,230,190,.55)"; ctx.shadowBlur = 14;
  ctx.fillStyle = "#f3e6cf"; ctx.textAlign = "center";
  ctx.font = `600 34px ${font}`; ctx.fillText(SPREADS[reading.spread].name, W / 2, 110);
  ctx.fillStyle = "#fff8ec"; ctx.font = `44px ${font}`; ctx.shadowBlur = 0;
  let y = reading.q ? wrapText(ctx, reading.q, W / 2, 190, 880, 60) : 170;
  const st = reading.stones, sp = reading.spread;
  let spots;
  if (sp === "odin") spots = [[W / 2, y + 190, 150]];
  else if (sp === "norn") spots = [0, 1, 2].map((i) => [W / 2 + (i - 1) * 300, y + 170, 105]);
  else if (sp === "cross") spots = [[W / 2, y + 290, 88], [W / 2 - 260, y + 290, 88], [W / 2 + 260, y + 290, 88], [W / 2, y + 90, 88], [W / 2, y + 490, 88]];
  else { const R = 300, cy = y + 340; ctx.strokeStyle = "rgba(255,240,210,.18)"; ctx.setLineDash([8, 10]); [R, R * .66, R * .33].forEach((r) => { ctx.beginPath(); ctx.arc(W / 2, cy, r, 0, Math.PI * 2); ctx.stroke(); }); ctx.setLineDash([]);
    spots = st.map((s) => [W / 2 + (s.x - 50) / 50 * R / .88, cy + (s.y - 50) / 50 * R / .88, 46]); }
  ctx.textAlign = "center";
  for (const [i, s] of st.entries()) {

      ctx.fillStyle = "rgba(255,248,236,.6)"; ctx.font = `${sp === "cross" ? 22 : 24}px ${font}`; ctx.fillText(SPREADS[sp].pos[i].split(" · ").pop(), x, yy + r + 80);
    }

  ctx.textAlign = "left"; ctx.fillStyle = "rgba(255,248,236,.92)"; ctx.font = `34px ${font}`;
  for (const t of synthesis().slice(0, 4)) { if (y > H - 160) break; y = wrapText(ctx, t, 110, y, 860, 54) + 18; }
  ctx.textAlign = "center"; ctx.fillStyle = "rgba(255,248,236,.45)"; ctx.font = `24px ${font}`;
  const d = new Date(reading.at); ctx.fillText(`${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()} · Elder Futhark`, W / 2, H - 70);
  const url = c.toDataURL("image/png");
  $("imgvImg").src = url; $("imgvDl").href = url; $("imgv").classList.add("on");
}
$("imgvX").onclick = () => $("imgv").classList.remove("on");

// ── 占卜本 ──

  }).join("") : `<div class="note">还没有。占卜一次就会记在这里，过一阵回来勾一下准不准。</div>`;

$("bookList").onclick = (e) => {
  const en = e.target.closest(".entry"); if (!en) return;
  const r = book[+en.dataset.n], b = e.target.closest("button"); if (!b) return;

  if (b.dataset.open) { reading = r; spread = r.spread; showView("cast"); renderSpreads(); $("board").innerHTML = ""; $("hint").textContent = ""; $("q").value = r.q || ""; renderResult(); return; }
  r.verdict = r.verdict === b.dataset.v ? "" : b.dataset.v; saveReading(r).then(loadBook);
};
$("bookList").addEventListener("change", (e) => { if (e.target.tagName !== "INPUT") return; const r = book[+e.target.closest(".entry").dataset.n]; r.memo = e.target.value.trim().slice(0, 300); saveReading(r).then(() => toast("记下了")); });

// ── 认符 ──
const WEAK_KEY = "runes-weak";
function weak() { try { return JSON.parse(localStorage.getItem(WEAK_KEY)) || {}; } catch { return {}; } }
function renderLearn() {
  const w = weak();
  $("aettList").innerHTML = AETT.map((a, ai) => `<div class="aett"><div class="an">${a.name}</div><div class="ab">${a.about}</div><div class="grid8">` +
    ORDER.slice(ai * 8, ai * 8 + 8).map((k) => `<div class="c${(w[k] || 0) > 0 ? " weak" : ""}" data-k="${k}">${stoneSVG(k)}<div class="n">${BASE[k].cn}</div></div>`).join("") + `</div></div>`).join("");
}
$("aettList").onclick = (e) => { const c = e.target.closest("[data-k]"); if (c) openRune(c.dataset.k, false); };
function quiz() {
  const w = weak(), pool = ORDER.flatMap((k) => Array(1 + 3 * (w[k] || 0)).fill(k)), k = pool[Math.floor(Math.random() * pool.length)];
  const q = $("quiz"); q.hidden = false;
  q.innerHTML = `${stoneSVG(k)}<div class="ans" id="ans"><button class="btn" id="showAns">它叫什么、说什么？</button></div>`;
  $("showAns").onclick = () => {
    $("ans").innerHTML = `<b>${BASE[k].cn} ${BASE[k].latin}</b><br>${BASE[k].keywords.join(" · ")}<div class="acts" style="justify-content:center"><button class="btn" id="qy">认得</button><button class="btn" id="qn">还不熟</button></div>`;
    const mark = (d) => { const x = weak(); x[k] = Math.max(0, Math.min(3, (x[k] || 0) + d)); localStorage.setItem(WEAK_KEY, JSON.stringify(x)); renderLearn(); quiz(); };
    $("qy").onclick = () => mark(-1); $("qn").onclick = () => mark(1);
  };
}
$("quizBtn").onclick = quiz;

// ── 切页 ──
function showView(v) {
  $("vCast").hidden = v !== "cast"; $("vBook").hidden = v !== "book"; $("vLearn").hidden = v !== "learn";
  document.querySelectorAll("#nav [data-v]").forEach((e) => e.classList.toggle("on", e.dataset.v === v));
  if (v === "book") loadBook();
  if (v === "learn") renderLearn();
  renderSpreads(); $("nav").classList.remove("open"); window.scrollTo({ top: 0 });
}

// ── 侧边的字 ──
$("navNow").onclick = () => $("nav").classList.toggle("open");
$("tree").onclick = (e) => {
  const a = e.target.closest("a"); if (!a) return;
  if (a.dataset.s) { if (busy) return; spread = a.dataset.s; showView("cast"); newBoard(); }
  else if (a.dataset.v) showView(a.dataset.v);
  else if (a.dataset.c) setCloth(a.dataset.c);
  else if (a.id === "arrangeBtn") arrange(true);
};
$("optUp").onchange = $("optBlank").onchange = () => { if (!picks.length) newBoard(); };
document.addEventListener("click", (e) => { if ($("nav").classList.contains("open") && !e.target.closest("#nav")) $("nav").classList.remove("open"); });
(() => { const h = document.createElement("a"); h.className = "btn close"; h.textContent = "‹ 合上本子"; h.onclick = () => showView("cast"); $("vBook").insertBefore(h, $("bookStat")); })();

// ── 桌布 ──
const CLOTH_KEY = "runes-cloth";
function cloth() { return localStorage.getItem(CLOTH_KEY) || "sea"; }
function setCloth(c) {
  localStorage.setItem(CLOTH_KEY, c);
  $("table").style.backgroundImage = `url(table/velvet-${c}.webp)`;
  document.querySelectorAll("#cloths a").forEach((e) => e.classList.toggle("on", e.dataset.c === c));
}

// ── 摆件 ──
const PROPS = Object.fromEntries(([["crys-00", 360, 305], ["crys-01", 233, 360], ["crys-02", 272, 285], ["crys-03", 315, 282], ["crys-04", 317, 360], ["crys-05", 344, 360], ["crys-06", 294, 328], ["crys-07", 309, 312], ["crys-09", 121, 116], ["sea-00", 360, 303], ["sea-01", 344, 320], ["sea-02", 316, 295], ["sea-03", 163, 180], ["sea-04", 172, 178], ["sea-05", 181, 165], ["sea-06", 337, 360], ["sea-07", 245, 360], ["sea-08", 152, 360], ["sea-09", 341, 354], ["witch-00", 244, 309], ["witch-01", 251, 360], ["witch-02", 209, 307], ["witch-03", 248, 285], ["witch-04", 79, 65], ["witch-05", 79, 64], ["witch-06", 261, 227], ["witch-07", 234, 305], ["witch-08", 82, 81], ["witch-09", 185, 133], ["witch-10", 78, 79], ["witch-11", 86, 91], ["witch-12", 360, 300], ["witch-13", 87, 80], ["witch-14", 110, 97], ["witch-15", 91, 84], ["witch-16", 105, 77], ["witch-17", 111, 88], ["witch-18", 142, 114], ["witch-19", 126, 105], ["witch-20", 129, 99], ["witch-21", 90, 95], ["rose-00", 335, 316], ["rose-01", 353, 311], ["rose-02", 335, 304], ["rose-03", 360, 322], ["rose-04", 357, 323], ["rose-05", 341, 322], ["rose-06", 360, 317], ["rose-07", 360, 316], ["rose-08", 360, 314], ["glass2-00", 360, 263], ["glass2-01", 360, 212], ["glass2-02", 307, 327], ["glass2-03", 174, 175], ["glass2-04", 360, 287], ["glass2-05", 360, 194], ["tall-00", 177, 360], ["tall-01", 291, 360], ["tall-02", 253, 360], ["tall-03", 215, 249], ["tall-04", 262, 360], ["tall-05", 288, 348], ["tall-06", 252, 345], ["tall-07", 311, 320]]).map(([id, w, h]) => [id, { w, h }]));
const TALL = new Set(["witch-00", "witch-02", "witch-07", "sea-08", "tall-00", "tall-01", "tall-02", "tall-03", "tall-04", "tall-05", "tall-06", "tall-07"]);
const BOOK = "witch-12";
// [id, x%, y%, 大小(vmin), 转]
const DEFAULT = {
  land: [["crys-00", 21, 6, 13, -10], ["tall-03", 31, 6, 9, 0], ["witch-14", 26, 17, 5, 40], ["witch-17", 24, 9, 4.5, -30], ["sea-06", 47, 98, 15, 10],
    ["rose-03", 72, 6, 12, 0], ["sea-00", 83, 8, 12, -15], ["tall-01", 94, 10, 12, 0], ["crys-04", 64, 4, 9, 0], ["witch-10", 67, 14, 4, 20],
    ["witch-01", 97, 42, 22, 70], ["glass2-03", 88, 30, 9, 0], ["rose-00", 91, 58, 11, 0], ["crys-07", 80, 72, 9, 40], ["tall-07", 93, 76, 11, 0],
    [BOOK, 85, 90, 17, -12], ["sea-08", 72, 92, 10, 0], ["crys-06", 62, 95, 11, 0], ["witch-03", 34, 94, 12, 10],
    ["sea-09", 4, 90, 11, 0], ["rose-08", 15, 92, 10, 20], ["sea-03", 22, 97, 6, 30], ["glass2-04", 7, 70, 11, -30], ["crys-03", 17, 80, 6, 0]],
  port: [["witch-14", 50, 3, 7, 30], ["rose-03", 62, 3, 15, 0], ["tall-03", 79, 5, 13, 0], ["crys-00", 97, 3, 20, -10], ["tall-01", 96, 18, 18, 0], ["sea-06", -3, 55, 22, 70],
    ["witch-01", 98, 44, 28, 70], ["crys-04", 2, 40, 14, 0],
    [BOOK, 80, 93, 26, -12], ["witch-03", 52, 95, 18, 10], ["rose-00", 28, 96, 17, 0], ["sea-09", 6, 92, 17, 0], ["crys-07", 97, 78, 14, 40], ["tall-07", 4, 74, 16, 0]],
};
const LAY_KEY = "runes-table-";
let lay = [], sel = null, mode = "";
function orient() { return innerWidth > innerHeight ? "land" : "port"; }
function loadLay() {
  mode = orient();
  try { lay = JSON.parse(localStorage.getItem(LAY_KEY + mode)); } catch { lay = null; }
  if (!Array.isArray(lay) || !lay.length) lay = DEFAULT[mode].map(([id, x, y, s, r], i) => ({ u: i + 1, id, x, y, s, r }));
  if (!lay.some((o) => o.id === BOOK)) lay.push({ u: Date.now(), id: BOOK, x: 85, y: 90, s: mode === "land" ? 17 : 26, r: -12 });
  lay = lay.filter((o) => PROPS[o.id]);
  drawProps();
}
function saveLay() { localStorage.setItem(LAY_KEY + mode, JSON.stringify(lay)); }
function autoRot(o) {
  if (!TALL.has(o.id)) return 0;
  const dx = (o.x - 50) * innerWidth / 100, dy = (o.y - 50) * innerHeight / 100;
  return Math.atan2(dx, -dy) * 180 / Math.PI;
}
function place(el, o) {
  const P = PROPS[o.id], w = o.s * Math.min(innerWidth, innerHeight) / 100;
  el.style.width = w + "px";
  el.style.transform = `translate(${o.x * innerWidth / 100 - w / 2}px, ${o.y * innerHeight / 100 - w * P.h / P.w / 2}px)`;
  el.firstChild.style.transform = `rotate(${(o.r || 0) + autoRot(o)}deg)`;
}
function drawProps() {
  $("props").innerHTML = "";
  for (const o of lay) {
    const el = document.createElement("div"); el.className = "pr" + (o.id === BOOK ? " book" : "") + (sel === o.u ? " sel" : ""); el.dataset.u = o.u;
    el.innerHTML = `<div class="rot"><img src="table/o/${o.id}.webp" alt=""></div>`;
    if (o.id === BOOK) el.title = "占卜本";
    place(el, o); $("props").append(el);
  }
}
const elOf = (o) => $("props").querySelector(`[data-u="${o.u}"]`);
function select(o) { sel = o ? o.u : null; document.querySelectorAll(".pr").forEach((e) => e.classList.toggle("sel", +e.dataset.u === sel)); }
function cur() { return lay.find((o) => o.u === sel); }

function arrange(on) {
  document.body.classList.toggle("arranging", on); $("arrangeBar").hidden = !on; $("tray").hidden = true; $("nav").classList.remove("open");
  if (!on) { select(null); saveLay(); toast("摆好了"); }
}
$("arrangeBar").onclick = (e) => {
  const b = e.target.closest("[data-a]"); if (!b) return; const a = b.dataset.a, o = cur();
  if (a === "done") return arrange(false);
  if (a === "add") { $("tray").hidden = !$("tray").hidden; return; }
  if (a === "reset") { if (!confirm("桌上的东西摆回最开始的样子？")) return; localStorage.removeItem(LAY_KEY + mode); sel = null; loadLay(); return; }
  if (!o) return toast("先点一件");
  if (a === "rl") o.r = (o.r || 0) - 15; if (a === "rr") o.r = (o.r || 0) + 15;
  if (a === "up") o.s = Math.min(60, o.s * 1.12); if (a === "dn") o.s = Math.max(3, o.s / 1.12);
  if (a === "top") { lay = lay.filter((x) => x !== o).concat(o); drawProps(); saveLay(); return; }
  if (a === "del") { if (o.id === BOOK) return toast("本子要留在桌上"); lay = lay.filter((x) => x !== o); sel = null; drawProps(); saveLay(); return; }
  place(elOf(o), o); saveLay();
};
$("tray").innerHTML = Object.keys(PROPS).filter((id) => id !== BOOK).map((id) => `<img src="table/o/${id}.webp" data-id="${id}" alt="">`).join("");
$("tray").onclick = (e) => {
  const id = e.target.dataset?.id; if (!id) return;
  const o = { u: Date.now(), id, x: 50, y: 40, s: mode === "land" ? 10 : 16, r: 0 };
  lay.push(o); drawProps(); select(o); saveLay(); $("tray").hidden = true;
};

// 拖、两指转和缩放
const pts = new Map(); let drag = null;
$("props").addEventListener("pointerdown", (e) => {
  const el = e.target.closest(".pr");
  if (!document.body.classList.contains("arranging")) { if (el?.classList.contains("book")) showView("book"); return; }
  if (!el) { select(null); $("tray").hidden = true; return; }
  const o = lay.find((x) => x.u === +el.dataset.u); select(o);
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); $("props").setPointerCapture(e.pointerId);
  drag = { o, el, start: snap(), ox: o.x, oy: o.y, os: o.s, or: o.r || 0 };
  e.preventDefault();
});
function snap() { return [...pts.values()].map((p) => ({ ...p })); }
$("props").addEventListener("pointermove", (e) => {
  if (!drag || !pts.has(e.pointerId)) return;
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  const now = [...pts.values()], st = drag.start, o = drag.o;
  if (now.length >= 2 && st.length >= 2) {
    const d0 = Math.hypot(st[1].x - st[0].x, st[1].y - st[0].y), d1 = Math.hypot(now[1].x - now[0].x, now[1].y - now[0].y);
    const a0 = Math.atan2(st[1].y - st[0].y, st[1].x - st[0].x), a1 = Math.atan2(now[1].y - now[0].y, now[1].x - now[0].x);
    o.s = Math.max(3, Math.min(60, drag.os * d1 / (d0 || 1))); o.r = drag.or + (a1 - a0) * 180 / Math.PI;
  } else if (now.length === 1 && st.length === 1) {
    o.x = drag.ox + (now[0].x - st[0].x) / innerWidth * 100; o.y = drag.oy + (now[0].y - st[0].y) / innerHeight * 100;
  }
  place(drag.el, o);
});
function up(e) {
  if (!pts.has(e.pointerId)) return; pts.delete(e.pointerId);
  if (drag) { if (pts.size) drag = { ...drag, start: snap(), ox: drag.o.x, oy: drag.o.y, os: drag.o.s, or: drag.o.r || 0 }; else { drag = null; saveLay(); } }
}
$("props").addEventListener("pointerup", up); $("props").addEventListener("pointercancel", up);
$("props").addEventListener("wheel", (e) => {
  const o = cur(); if (!o || !document.body.classList.contains("arranging")) return; e.preventDefault();
  if (e.shiftKey) o.r = (o.r || 0) + (e.deltaY > 0 ? 8 : -8); else o.s = Math.max(3, Math.min(60, o.s * (e.deltaY > 0 ? 1 / 1.06 : 1.06)));
  place(elOf(o), o); clearTimeout(saveLay.t); saveLay.t = setTimeout(saveLay, 400);
}, { passive: false });
addEventListener("resize", () => { if (orient() !== mode) loadLay(); else lay.forEach((o) => { const el = elOf(o); if (el) place(el, o); }); });

setCloth(cloth()); loadLay();
renderSpreads(); newBoard();

</script>
